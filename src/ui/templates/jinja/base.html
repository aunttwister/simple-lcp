<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LCP{% endblock %}</title>
<link rel="stylesheet" href="/static/dashboard.css?v={{ cache_buster }}">
{% block head_extra %}{% endblock %}
</head>
<body>
{% block sidebar %}
{% include "_sidebar.html" %}
{% endblock %}
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
<div class="main-content">
  <!-- Global top-right widget: latest active provider + usage/credits (all pages) -->
  <div class="header-plugin-badge global" id="pluginHeaderBadge" title="">
    <div class="hp-head-row">
      <span class="header-plugin-dot" id="pluginHeaderDot"></span>
      <span class="header-plugin-text" id="pluginHeaderText">…</span>
    </div>
    <div class="hp-usage" id="hpUsage" style="display:none">
      <div class="hp-usage-track">
        <div class="hp-usage-fill" id="hpUsageFill"></div>
      </div>
      <span class="hp-usage-label" id="hpUsageLabel"></span>
      <div class="hp-usage-popover" id="hpUsagePopover"></div>
    </div>
  </div>
  {% block content %}{% endblock %}
</div>

<script>
var monthly = {{ monthly_json | safe }};
var configuredProviders = {{ configured_providers_json | safe }};
// Display name for a provider key (internal ids stay stable; only the label
// shown to users changes). e.g. llamacpp -> "Local LLM".
function providerDisplayName(key) {
  if (key === 'llamacpp') return 'Local LLM';
  return key;
}
</script>
{% block base_scripts %}
<script src="/static/js/api.js?v={{ cache_buster }}"></script>
<script src="/static/js/sidebar.js?v={{ cache_buster }}"></script>
<script src="/static/js/header-status.js?v={{ cache_buster }}"></script>
<script src="/static/js/modal.js?v={{ cache_buster }}"></script>
<script src="/static/js/stack.js?v={{ cache_buster }}"></script>
{% endblock %}
{% block scripts %}{% endblock %}
{% block body_end %}{% endblock %}
</body>
</html>
