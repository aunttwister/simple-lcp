{#- generated by the M2 merge — section: sec_profiles_script
    Do not edit the block boundaries: this partial is included by a merged page
    (profiles) inside a tab guard for the tab 'profiles'. -#}

{% if tab == 'profiles' %}
<script>
{% raw %}
var _addProfileMode = false;

// M2d: `prefillAgent` is the uncovered Hermes profile the operator clicked, so the
// create flow starts from the thing they picked rather than from an empty name.
function openAddProfile(prefillAgent) {
  _addProfileMode = true;
  _editProfileName = '';
  _editProfileTools = [];
  _editProfileChain = [];
  _editProfileIntents = [];
  api('GET', '/api/providers').then(function(d) {
    _allProviders = d.providers || {};
    _allChains = d.profile_chains || {};
    document.getElementById('pemProfileTitle').textContent = 'Add Profile';
    document.getElementById('pemNameRow').style.display = '';
    document.getElementById('pemName').value = '';
    document.getElementById('pemAuthRequired').checked = true;
    document.getElementById('pemDescription').value = '';
    document.getElementById('pemAuthLabel').textContent = 'API key required';
    document.getElementById('pemBudgetAmount').value = '';
    document.getElementById('pemBudgetAction').value = 'log';
    document.getElementById('pemBudgetThresholds').value = '';
    document.getElementById('pemBudgetSpend').value = '';
    document.getElementById('pemSaveStatus').textContent = '';
    document.getElementById('pemSaveBtn').textContent = 'Create Profile';
    document.getElementById('pemAgentProfile').value = prefillAgent || '';
    document.getElementById('pemRoutingMode').value = '';
    onRoutingToggle();
    renderPemTools();
    renderPemChain();
    renderPemIntents();
    openDialog('profileEditModal');
    // With an agent prefilled the name is the next thing to decide; without one it
    // is the first.
    if (prefillAgent) document.getElementById('pemName').focus();
    else document.getElementById('pemName').focus();
  });
}

function addProfile() {
  var name = prompt('Profile name (lowercase, e.g. "admin"):');
  if (!name) return;
  api('POST', '/api/profiles', { name: name }).then(function(d) {
    if (d.ok) location.reload();
    else alert('Error: ' + (d.error || 'unknown'));
  });
}

function deleteProfile(name) {
  if (!confirm('Delete profile "' + name + '"? This cannot be undone.')) return;
  api('DELETE', '/api/profiles/' + name).then(function(d) {
    if (d.ok) location.reload();
    else alert('Error: ' + (d.error || 'unknown'));
  });
}

var _editProfileName = '';
var _editProfileTools = [];
var _editProfileChain = [];
var _editProfileIntents = [];
var _allProviders = {};
var _allChains = {};

// M2d: a profile's intents — what it is for. Free-text chips, because the labels
// are the operator's own words ("code planning", "architecture planning") and the
// router matches a message's intent against them.
function renderPemIntents() {
  var html = '';
  _editProfileIntents.forEach(function(it, i) {
    html += '<span style="display:inline-flex;align-items:center;gap:0.1875rem;padding:0.125rem 0.5rem;background:hsl(var(--secondary));color:hsl(var(--foreground));border:1px solid hsl(var(--card-border));border-radius:9999px;font-size:0.6875rem">' +
      escHtml(it) +
      '<button onclick="removeIntent(' + i + ')" style="background:none;border:none;color:inherit;cursor:pointer;font-size:0.75rem;padding:0;line-height:1">\u2715</button>' +
    '</span>';
  });
  if (!html) html = '<span style="font-size:0.6875rem;color:hsl(var(--muted-foreground))">no intents declared \u2014 the router classifies without them</span>';
  document.getElementById('pemIntentsList').innerHTML = html;
}

function addIntent() {
  var el = document.getElementById('pemNewIntent');
  var v = (el.value || '').trim();
  if (!v) return;
  if (_editProfileIntents.length >= 32) { alert('32 intents is the limit'); return; }
  if (_editProfileIntents.indexOf(v) < 0) _editProfileIntents.push(v);
  el.value = '';
  renderPemIntents();
}

function removeIntent(i) {
  _editProfileIntents.splice(i, 1);
  renderPemIntents();
}

// Dynamic routing needs something to choose between: with a single model in the
// chain the router has no decision to make, so the toggle says so rather than
// pretending the profile is routed dynamically.
function onRoutingToggle() {
  // Three states, not two: absent means "inherit the gateway's switch", which is what
  // a profile that declares nothing gets — and is not the same as choosing static.
  var mode = document.getElementById('pemRoutingMode').value;
  var hint = document.getElementById('pemRoutingHint');
  var steps = _editProfileChain.length;
  if (mode === 'dynamic' && steps < 2) {
    hint.textContent = steps === 1
      ? 'One model in the chain: the router has nothing to choose between yet.'
      : 'No models in the chain yet.';
    hint.style.color = 'hsl(var(--amber-fg))';
  } else if (mode === '') {
    hint.textContent = 'This profile follows the gateway\u2019s own switch.';
    hint.style.color = 'hsl(var(--muted-foreground))';
  } else {
    hint.textContent = '';
  }
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function editProfile(name) {
  _addProfileMode = false;
  _editProfileName = name;
  api('GET', '/api/providers').then(function(d) {
    _allProviders = d.providers || {};
    _allChains = d.profile_chains || {};
    _editProfileChain = JSON.parse(JSON.stringify(_allChains[name] || []));
    api('GET', '/api/profiles').then(function(pd) {
      var prof = (pd.profiles || {})[name] || {};
      _editProfileTools = (prof.forbidden || []).slice();
      _editProfileIntents = (prof.intents || []).slice();
      document.getElementById('pemProfileTitle').textContent = 'Edit Profile: ' + name.toUpperCase();
      document.getElementById('pemNameRow').style.display = 'none';
      document.getElementById('pemDescription').value = prof.description || '';
      document.getElementById('pemName').value = '';
      document.getElementById('pemSaveBtn').textContent = 'Save';
      var authReq = prof.auth_required !== false;
      document.getElementById('pemAuthRequired').checked = authReq;
      document.getElementById('pemAuthLabel').textContent = authReq ? 'API key required' : 'No key required (public)';
      // The declared mapping wins; when there is none the derived proposal is
      // shown, so confirming it is one Save rather than typing a name.
      document.getElementById('pemAgentProfile').value = prof.agent_profile || prof.suggested_agent_profile || '';
      document.getElementById('pemRoutingMode').value = prof.routing || '';
      onRoutingToggle();
      renderPemTools();
      renderPemChain();
      renderPemIntents();
      // Load profile budget
      loadProfileBudget(name);
      openDialog('profileEditModal');
    });
  });
}

function closeProfileEdit() {
  closeDialog('profileEditModal');
}

function renderPemTools() {
  var html = '';
  _editProfileTools.forEach(function(t, i) {
    html += '<span style="display:inline-flex;align-items:center;gap:0.1875rem;padding:0.125rem 0.5rem;background:hsl(var(--red-bg));color:hsl(var(--red-fg));border-radius:9999px;font-size:0.6875rem;font-weight:600">' +
      t +
      '<button onclick="removeBlockedTool(' + i + ')" style="background:none;border:none;color:inherit;cursor:pointer;font-size:0.75rem;padding:0;line-height:1">✕</button>' +
    '</span>';
  });
  if (!html) html = '<span style="font-size:0.6875rem;color:hsl(var(--muted-foreground))">no tools blocked</span>';
  document.getElementById('pemToolsList').innerHTML = html;
}

function addBlockedTool() {
  var t = document.getElementById('pemNewTool').value.trim();
  if (!t) return;
  if (_editProfileTools.indexOf(t) >= 0) return;
  _editProfileTools.push(t);
  document.getElementById('pemNewTool').value = '';
  renderPemTools();
}

function removeBlockedTool(idx) {
  _editProfileTools.splice(idx, 1);
  renderPemTools();
}

function renderPemChain() {
  var provNames = Object.keys(_allProviders);
  var html = '';
  if (_editProfileChain.length === 0) {
    html = '<li class="empty" style="padding:0.5rem;font-size:0.6875rem">No providers in chain</li>';
  } else {
    _editProfileChain.forEach(function(s, i) {
      // Model sync: if the stored model is not offered by the selected
      // provider (e.g. provider was re-pointed at a new upstream), snap to the
      // provider's first offered model. Without this the <select> displays the
      // first option while _editProfileChain[i].model keeps the stale value,
      // and Save persists the stale model.
      var provModels = (_allProviders[s.provider] || {}).models || [];
      if (provModels.length && provModels.indexOf(s.model) === -1) {
        s.model = provModels[0];
      }
      html += '<li class="chain-item" data-idx="' + i + '">';
      html += '<span class="drag-handle">⋮⋮</span>';
      html += '<select onchange="_editProfileChain[' + i + '].provider = this.value; var _pm = ((_allProviders[this.value] || {}).models || []); _editProfileChain[' + i + '].model = (_pm.length ? _pm[0] : _editProfileChain[' + i + '].model); renderPemChain();" style="background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:4px;color:hsl(var(--foreground));padding:0.125rem 0.375rem;font-size:0.6875rem">';
      provNames.forEach(function(pn) {
        var sel = s.provider === pn ? ' selected' : '';
        html += '<option value="' + pn + '"' + sel + '>' + pn + '</option>';
      });
      html += '</select>';
      var models = provModels;
      html += '<select onchange="_editProfileChain[' + i + '].model = this.value" style="background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:4px;color:hsl(var(--foreground));padding:0.125rem 0.375rem;font-size:0.6875rem">';
      models.forEach(function(m) {
        var sel = s.model === m ? ' selected' : '';
        html += '<option value="' + m + '"' + sel + '>' + m + '</option>';
      });
      html += '</select>';
      html += '<button class="btn-sm" style="margin-left:auto" onclick="_editProfileChain.splice(' + i + ',1);renderPemChain();">✕</button>';
      html += '</li>';
    });
  }
  document.getElementById('pemChainList').innerHTML = html;
  if (typeof onRoutingToggle === 'function' && document.getElementById('pemRoutingMode')) onRoutingToggle();
  var listEl = document.getElementById('pemChainList');
  if (listEl && typeof Sortable !== 'undefined') {
    new Sortable(listEl, {
      animation: 150, handle: '.drag-handle',
      onEnd: function() {
        var items = document.querySelectorAll('#pemChainList .chain-item');
        var newChain = [];
        items.forEach(function(item) {
          var idx = parseInt(item.getAttribute('data-idx'));
          newChain.push(_editProfileChain[idx]);
        });
        _editProfileChain = newChain;
        renderPemChain();
      }
    });
  }
}

function addChainStep() {
  var provs = Object.keys(_allProviders);
  if (provs.length === 0) { alert('Add a provider first'); return; }
  var p = provs[0];
  var m = ((_allProviders[p] || {}).models || [])[0] || 'default';
  _editProfileChain.push({provider: p, model: m});
  renderPemChain();
}

function saveProfileEdit() {
  var statusEl = document.getElementById('pemSaveStatus');
  statusEl.textContent = 'Saving...';
  statusEl.style.color = 'hsl(var(--amber-fg))';
  var chain = _editProfileChain.map(function(s) {
    var bu = '';
    var old = _allChains[_editProfileName] || [];
    old.forEach(function(o) {
      if (o.provider === s.provider && o.model === s.model) bu = o.base_url || '';
    });
    return {provider: s.provider, model: s.model, base_url: bu};
  });

  if (_addProfileMode) {
    var name = document.getElementById('pemName').value.trim().toLowerCase();
    if (!name) { statusEl.textContent = 'Enter a profile name'; statusEl.style.color = 'hsl(var(--red-fg))'; return; }
    return api('POST', '/api/profiles', {
      name: name,
      agent_profile: document.getElementById('pemAgentProfile').value,
      routing: document.getElementById('pemRoutingMode').value,
      intents: _editProfileIntents,
      description: document.getElementById('pemDescription').value.trim()
    }).then(function(create) {
      if (!create.ok) { statusEl.textContent = create.error || 'Create failed'; statusEl.style.color = 'hsl(var(--red-fg))'; return; }
      _editProfileName = name;
      return api('PUT', '/api/chains/' + name, {chain: chain}).then(function() {
        return api('PUT', '/api/profiles/' + name, {
          forbidden_tools: _editProfileTools,
          description: document.getElementById('pemDescription').value.trim(),
          auth_required: document.getElementById('pemAuthRequired').checked
        });
      });
    }).then(function() {
      statusEl.textContent = 'Profile created';
      statusEl.style.color = 'hsl(var(--green-fg))';
      setTimeout(function() { location.reload(); }, 800);
    }).catch(function(e) {
      statusEl.textContent = 'Create failed: ' + (e.message || e);
      statusEl.style.color = 'hsl(var(--red-fg))';
    });
  }

  api('PUT', '/api/chains/' + _editProfileName, {chain: chain}).then(function(chainResult) {
    return api('PUT', '/api/profiles/' + _editProfileName, {
      forbidden_tools: _editProfileTools,
      description: document.getElementById('pemDescription').value.trim(),
      auth_required: document.getElementById('pemAuthRequired').checked,
      agent_profile: document.getElementById('pemAgentProfile').value,
      routing: document.getElementById('pemRoutingMode').value,
      intents: _editProfileIntents
    });
  }).then(function(profResult) {
    if (profResult && profResult.error) {
      statusEl.textContent = 'Save failed: ' + profResult.error;
      statusEl.style.color = 'hsl(var(--red-fg))';
      return;
    }
    // Also save budget
    var amt = document.getElementById('pemBudgetAmount').value;
    var budgetPromise;
    if (amt || amt === '0') {
      budgetPromise = api('PUT', '/api/profiles/' + _editProfileName + '/budget', {
        amount: parseFloat(amt) || 0,
        action: document.getElementById('pemBudgetAction').value,
        threshold_pct: document.getElementById('pemBudgetThresholds').value || '80',
        period: 'monthly'
      });
    } else {
      budgetPromise = Promise.resolve();
    }
    return budgetPromise.then(function() {
      if (profResult.ok) {
        statusEl.textContent = 'Saved';
        statusEl.style.color = 'hsl(var(--green-fg))';
        setTimeout(function() { location.reload(); }, 800);
      } else {
        statusEl.textContent = 'Save failed';
        statusEl.style.color = 'hsl(var(--red-fg))';
      }
    });
  }).catch(function(e) {
    statusEl.textContent = 'Save failed: ' + (e.message || e);
    statusEl.style.color = 'hsl(var(--red-fg))';
  });
}

function loadProfileBudget(name) {
  document.getElementById('pemBudgetAmount').value = '';
  document.getElementById('pemBudgetSpend').value = '';
  document.getElementById('pemBudgetAction').value = 'log';
  document.getElementById('pemBudgetThresholds').value = '80';
  api('GET', '/api/profiles/' + name + '/budget').then(function(d) {
    if (d.budget) {
      document.getElementById('pemBudgetAmount').value = d.budget.amount || 0;
      document.getElementById('pemBudgetSpend').value = '$' + (d.budget.current_spend || 0).toFixed(2) + ' (' + d.budget.spend_pct + '%)';
      document.getElementById('pemBudgetAction').value = d.budget.action || 'log';
      document.getElementById('pemBudgetThresholds').value = d.budget.threshold_pct || '80';
    }
  });
}
{% endraw %}
</script>
{% endif %}
