function switchProvTab(tab, btn){
  document.querySelectorAll('.tab-panel').forEach(function(p){if (tab === 'capabilities') loadCaps();p.classList.remove('active')});

  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
  // Persist the active tab so a refresh (or a shared link) returns to it.
  if (window.location.hash !== '#' + tab) {
    try { window.location.hash = tab; } catch (e) { /* noop — hash may be blocked */ }
  }
}

function saveProvider(){var name=document.getElementById('provName').value.trim().replace(/\u00a0/g,' ');if(!name){alert('Provider name is required');return}
  var doSave=function(){var payload={api_base:document.getElementById('provUrl').value.trim(),models:_selectedModels};
    // Declared vendor family. An empty value clears the declaration, leaving the
    // server to infer it from the name — also the way back from a wrong type.
    var tsel=document.getElementById('provType');
    if(tsel)payload.type=(tsel.value||'');
    var kv=document.getElementById('provKeyVal').value.trim();if(kv)payload.api_key=kv;
    if(_editingProvider){
      // Editing an existing provider: update its config in place (PUT).
      api('PUT','/api/providers/'+encodeURIComponent(_editingProvider),payload).then(function(d){
        if(!d.ok){alert('Error: '+(d.error||'unknown'));return}
        var renamed=name!==_editingProvider;
        var after=function(){location.reload()};
        if(renamed){
          // Name changed: move config entry, chain steps and credentials to the
          // new name (rename endpoint), then reload.
          api('POST','/api/providers/'+encodeURIComponent(_editingProvider)+'/rename',{new_name:name}).then(after).catch(after);
        } else { after(); }
      });
    } else {
      // New provider: create.
      payload.name=name;
      api('POST','/api/providers',payload).then(function(d){if(d.ok){location.reload()}else{alert('Error: '+(d.error||'unknown'))}});
    }
  };
  if(_editingProvider && name!==_editingProvider && !confirm('Rename provider "'+_editingProvider+'" to "'+name+'"? Profile chain steps and credentials move with it.'))return;
  doSave();

function resetCooldown(provider, baseUrl, profile){
  if(!confirm('Reset cooldown for '+provider+'/'+profile+'?'))return;
  api('POST','/api/circuit-breaker/reset',{provider:provider,base_url:baseUrl,profile:profile}).then(function(d){
    if(d.ok)loadProviderHealth();
    else alert('Error: '+(d.error||'unknown'));
  });
}

function toggleProviderState(provider, profile, action){
  var labels = {degrade:'Force Degrade', kill:'Force Kill', resume:'Resume'};
  if(!confirm((labels[action]||action)+' for '+provider+'/'+profile+'?'))return;
  api('POST','/api/providers/'+encodeURIComponent(provider)+'/toggle',{profile:profile,action:action}).then(function(d){
    if(d.ok)loadProviderHealth();
    else alert('Error: '+(d.error||'unknown'));
  });

// ── Provider health MATRIX ────────────────────────────────────────────────
// Rows are profiles, columns are providers, and a cell is the (provider,
// profile) pair — exactly the key provider_health uses. The page can then be
// read two ways: down a column ("is commandcode usable anywhere, and where is
// it broken?") or across a row ("what can profile l2 call right now?"). The
// previous layout grouped by profile, which answered only the second of those
// questions, on a page whose subject is providers.
//
// A cell has FOUR states and the two quiet ones are the point:
//   healthy / degraded / dead — a health row exists for this pair
//   "no data"                 — the provider IS in this profile's chain but has
//                               never carried a request for it, so nothing has
//                               ever assessed it. Silence, not health.
//   "·" (dim)                 — the provider is not registered for this profile
//
// The state is passive: it is written only by real traffic
// (request_pipeline -> circuit_breaker.record_success/record_failure). Nothing
// probes a provider that is not being called, which is why a pair can sit here
// at "no data" indefinitely and why a six-week-old last success can still show
// 100% uptime.
var PH = {cells:{}, chains:{}, provs:[], profs:[], index:{}, sel:null, summary:{}, notice:null};

function phEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function phSev(st){ return st === 'dead' ? 2 : st === 'degraded' ? 1 : st === 'healthy' ? 0 : 3; }
function phDot(st){
  var cls = st === 'healthy' ? 'ok' : st === 'degraded' ? 'warn' : st === 'dead' ? 'dead' : 'none';
  return '<span class="ph-dot ph-dot-' + cls + '"></span>';
}
function phId(s){ return String(s).replace(/[^a-zA-Z0-9]/g, '_'); }
function phBase(prof, prov){
  var es = PH.cells[prof + '|' + prov] || [];
  return es.length ? (es[0].h.base_url || '') : '';
}
function phModel(prof, prov){
  var hit = (PH.chains[prof] || []).filter(function(s){ return s.provider === prov; })[0];
  return hit ? (hit.model || '') : '';
}

function loadProviderHealth(){
  // Guarded: the probe bar lives in a later <script> block, and this function is
  // first invoked at the bottom of THIS block — where phLoadProbe does not exist
  // yet. Calling it unguarded threw a ReferenceError that killed the matrix
  // render entirely (proven in-browser: body stuck on "Loading…").
  if (typeof phLoadProbe === 'function') phLoadProbe();
  api('GET','/api/providers').then(function(p){
    api('GET','/api/providers/health').then(function(h){
      PH.chains = (p && p.profile_chains) || {};
      PH.provs  = Object.keys((p && p.providers) || {});
      PH.profs  = Object.keys(PH.chains);
      var hp = (h && h.providers) || {};
      var cells = {};
      Object.keys(hp).forEach(function(k){
        var e = hp[k];
        // Read provider/profile from the entry, not from the dict key: two
        // configs can share a pair with different base URLs, and the key then
        // carries a discriminator that is not part of the profile name.
        var prof = e.profile || k.split('/')[1] || '';
        var prov = e.provider || k.split('/')[0] || '';
        var key = prof + '|' + prov;
        (cells[key] = cells[key] || []).push({prof:prof, prov:prov, h:e});
      });
      PH.cells = cells;
      // A profile or provider appearing only in health data still gets a
      // row/column, so a stray row is visible instead of silently absent.
      Object.keys(cells).forEach(function(k){
        var prof = k.split('|')[0], prov = k.split('|')[1];
        if(prof && PH.profs.indexOf(prof) === -1) PH.profs.push(prof);
        if(prov && PH.provs.indexOf(prov) === -1) PH.provs.push(prov);
      });
      PH.profs = PH.profs.filter(function(x){ return x; }).sort();
      PH.provs = PH.provs.filter(function(x){ return x; }).sort();
      PH.summary = (h && h.summary) || {};
      phRender();
    });
  });
}

function phRender(){
  var head = document.getElementById('phHead');
  var body = document.getElementById('providerHealthBody');
  if(!head || !body) return;

  var hh = '<th scope="col" class="ph-rowhead">Profile</th>';
  PH.provs.forEach(function(pr){
    hh += '<th scope="col" title="' + phEsc(pr) + '">' + phEsc(pr) + '</th>';
  });
  hh += '<th scope="col" title="Providers registered in this profile\'s chain">Chain</th>';
  head.innerHTML = hh;

  PH.index = {};
  var unassessed = 0, rows = '';

  PH.profs.forEach(function(prof){
    var steps = (PH.chains[prof] || []).map(function(s){ return s.provider; });
    rows += '<tr><th scope="row">' + phEsc(prof) + '</th>';

    PH.provs.forEach(function(prov){
      var es = PH.cells[prof + '|' + prov] || [];
      var inChain = steps.indexOf(prov) !== -1;

      if(!es.length){
        if(inChain){
          unassessed++;
          rows += '<td><span class="ph-cell ph-static" title="Registered in '
               + phEsc(prof) + "'s chain but never assessed — no request has carried it"
               + ' yet, so no health row exists. Unassessed, not healthy.">'
               + '<span class="ph-dot ph-dot-none"></span>no data</span></td>';
        } else {
          rows += '<td><span class="ph-cell ph-static" title="Not registered for '
               + phEsc(prof) + '">·</span></td>';
        }
        return;
      }

      var worst = phWorst(es);
      var st = worst.h.status;
      var extra = '';
      if(es.length > 1) extra = ' <span class="ph-tag">' + es.length + ' urls</span>';
      else if(!inChain) extra = ' <span class="ph-tag">retired</span>';
      var sid = 'phc-' + phId(prof) + '-' + phId(prov);
      PH.index[sid] = {prof:prof, prov:prov};
      var pressed = (PH.sel && PH.sel.prof === prof && PH.sel.prov === prov) ? 'true' : 'false';
      rows += '<td><button type="button" class="ph-cell" id="' + sid + '" aria-pressed="' + pressed
           +  '" onclick="phSelect(\'' + sid + '\')" title="'
           +  phEsc(prof + ' / ' + prov + ' — click for actions') + '">'
           +  phDot(st) + phEsc(st) + extra + '</button></td>';
    });

    rows += '<td style="text-align:center"><button type="button" class="ph-cell ph-chainbtn"'
         +  ' onclick="phSelectProfile(\'' + phId(prof) + '\')"'
         +  ' title="Show this profile\'s chain in order, with each step\'s status">'
         +  steps.length + '</button></td></tr>';
  });
  body.innerHTML = rows;

  var sum = PH.summary || {};
  document.getElementById('hcHealthy').textContent  = sum.healthy  != null ? sum.healthy  : '–';
  document.getElementById('hcDegraded').textContent = sum.degraded != null ? sum.degraded : '–';
  document.getElementById('hcDead').textContent     = sum.dead     != null ? sum.dead     : '–';
  document.getElementById('hcTotal').textContent    = sum.total    != null ? sum.total    : '–';
  var ua = document.getElementById('hcUnassessed');
  if(ua) ua.textContent = unassessed;

  var legend = document.getElementById('phLegend');
  if(legend) legend.innerHTML =
      '<span>' + phDot('healthy') + 'healthy</span>'
    + '<span>' + phDot('degraded') + 'degraded</span>'
    + '<span>' + phDot('dead') + 'dead</span>'
    + '<span>' + phDot(null) + 'no data — in the chain, never assessed</span>'
    + '<span>· not registered for that profile</span>'
    + '<span>Click a cell for actions</span>';

  if(PH.sel) phPanel(PH.sel.prof, PH.sel.prov);
}

// ── Profile view: the chain IN ORDER, with each step's status ─────────────
// The matrix answers "which providers work for this profile". This answers the
// question an operator actually asks when a profile is misbehaving: "walk my
// chain top to bottom — what will it try, in what order, and where will it stop?"
// Chain order is not derivable from the matrix (it is a set of pairs), so it has
// to be read from the configured chain.
function phSelectProfile(profId){
  var prof = null;
  PH.profs.forEach(function(p){ if(phId(p) === profId) prof = p; });
  if(prof === null) return;
  if(!PH.sel || PH.sel.prof !== prof || PH.sel.prov) PH.notice = null;
  PH.sel = {prof: prof, prov: null};
  phRender();
  var host = document.getElementById('phCellPanel');
  if(host && host.scrollIntoView) host.scrollIntoView({block:'nearest'});
}

function phProfilePanel(prof, host){
  var steps = PH.chains[prof] || [];
  var h = '<div class="ph-cp-head">profile <b>' + phEsc(prof) + '</b> — chain in order'
        + ' <span class="ph-tag">' + steps.length + ' step' + (steps.length===1?'':'s') + '</span></div>';

  if(!steps.length){
    h += '<p class="ph-cp-msg">This profile has no chain — it cannot call anything.</p>';
    h += '<div class="ph-cp-actions"><button class="btn-sm" onclick="phClose()">Close</button></div>';
    host.innerHTML = h; host.style.display = ''; return;
  }

  h += '<ol class="ph-chain">';
  steps.forEach(function(s, i){
    var prov = s.provider, model = s.model || '';
    var es = PH.cells[prof + '|' + prov] || [];
    var worst = phWorst(es);
    var st = worst ? worst.h.status : null;
    var ls = worst ? worst.h.last_success : null;
    var age = phAge(ls);
    h += '<li><span class="ph-dot ' + (worst ? 'ph-dot-' + st : 'ph-dot-none') + '"></span>'
      +  '<span class="ph-chain-step">' + (i+1) + '. <b>' + phEsc(prov) + '</b>'
      +  (model ? ' <span class="mono">' + phEsc(model) + '</span>' : '')
      +  '</span>'
      +  '<span class="ph-chain-state">'
      +  (worst ? phEsc(st) : 'no data — never assessed')
      +  (age ? ' · last success ' + phEsc(age) : '') + '</span></li>';
  });
  h += '</ol>';
  h += '<p class="ph-cp-msg">Steps are tried top to bottom. A step whose provider is not'
    +  ' available is skipped and the chain advances — so a descending order of status here'
    +  ' is what a fallback actually costs.</p>';
  h += '<div class="ph-cp-actions"><button class="btn-sm" onclick="phClose()">Close</button></div>';
  if(PH.notice){
    h += '<div class="ph-cp-msg" style="color:'
      + (PH.notice.cls === 'ok' ? 'hsl(var(--green-fg))'
       : PH.notice.cls === 'err' ? 'hsl(var(--red-fg))'
       : 'hsl(var(--muted-foreground))') + '">' + phEsc(PH.notice.text) + '</div>';
  }
  host.innerHTML = h;
  host.style.display = '';
}

// Pick the row that BEST represents a (profile, provider) pair.
//
// Worst status governs, because that is the risk. But among EQUAL statuses the
// FRESHEST wins: l2|local-sparks has two healthy rows — the retired
// https://dgx.local.curci.cc/v1 (last success 2026-10-04) and the live
// http://192.168.1.107:18300/v1 (seconds ago). Picking by array order showed
// "healthy · last success 28d ago" for a step that was serving traffic at that
// moment, which reads as a stalled provider when nothing is wrong.
function phWorst(es){
  if(!es || !es.length) return null;
  return es.slice().sort(function(a, b){
    var d = phSev(b.h.status) - phSev(a.h.status);
    if(d) return d;
    var ta = Date.parse(a.h.last_success) || 0, tb = Date.parse(b.h.last_success) || 0;
    return tb - ta;
  })[0];
}

function phAge(iso){
  if(!iso) return '';
  var t = Date.parse(iso);
  if(isNaN(t)) return '';
  var s = Math.round((Date.now() - t)/1000);
  if(s < 90) return s + 's ago';
  if(s < 5400) return Math.round(s/60) + 'm ago';
  if(s < 172800) return Math.round(s/3600) + 'h ago';
  return Math.round(s/86400) + 'd ago';
}

function phSelect(sid){
  var pair = PH.index[sid];
  if(!pair) return;
  // Switching cells clears any previous action result, so a "Done" from one
  // pair can never be read as belonging to another.
  if(!PH.sel || PH.sel.prof !== pair.prof || PH.sel.prov !== pair.prov) PH.notice = null;
  PH.sel = pair;
  phRender();
  var host = document.getElementById('phCellPanel');
  if(host && host.scrollIntoView) host.scrollIntoView({block:'nearest'});
}

function phClose(){
  PH.sel = null;
  PH.notice = null;
  var host = document.getElementById('phCellPanel');
  if(host) host.style.display = 'none';
  phRender();
}

function phPanel(prof, prov){
  var host = document.getElementById('phCellPanel');
  if(!host) return;
  if(!prov){ phProfilePanel(prof, host); return; }
  var es = PH.cells[prof + '|' + prov] || [];
  var model = phModel(prof, prov);
  var inChain = model !== '' || (PH.chains[prof] || []).some(function(s){ return s.provider === prov; });
  // Same rule as the cell: the pair is as healthy as its WORST row. Using
  // entries[0] here made the cell read "dead" and the panel header "degraded"
  // for the same click.
  var worst = phWorst(es);

  var h = '<div class="ph-cp-head"><b>' + phEsc(prof) + '</b> / <b>' + phEsc(prov) + '</b> '
        + (worst ? phDot(worst.h.status) + phEsc(worst.h.status) : '<span class="ph-dot ph-dot-none"></span>no data')
        + (es.length > 1 ? ' <span class="ph-tag">worst of ' + es.length + ' endpoints</span>' : '')
        + (inChain ? '' : ' <span class="ph-tag">not in this profile\'s chain</span>')
        + '</div>';

  if(es.length){
    // One block per endpoint. Two rows for the same provider are two different
    // base URLs, so each block carries its own heading — otherwise the labels
    // repeat and there is no way to tell which values belong together.
    h += '<div class="ph-eps">';
    es.forEach(function(e){
      h += '<div class="ph-ep">';
      if(es.length > 1)
        h += '<div class="ph-ep-head">' + phDot(e.h.status) + ' <span class="mono">' + phEsc(e.h.base_url || '—') + '</span></div>';
      h += '<dl class="ph-facts">';
      h += '<div><dt>Status</dt><dd>' + phEsc(e.h.status) + '</dd></div>';
      h += '<div><dt>Consecutive failures</dt><dd>' + phEsc(e.h.failures) + '</dd></div>';
      h += '<div><dt>Last success</dt><dd>' + phEsc(e.h.last_success || 'never') + '</dd></div>';
      h += '<div><dt>Last failure</dt><dd>' + phEsc(e.h.last_failure || '—') + '</dd></div>';
      h += '<div><dt>Cooldown until</dt><dd>' + phEsc(e.h.tripped_until || '—') + '</dd></div>';
      h += '<div><dt>Manual override</dt><dd>' + phEsc(e.h.manual_override || '—') + '</dd></div>';
      if(e.h.last_failure_reason)
        h += '<div style="grid-column:1/-1"><dt>Reason</dt><dd>' + phEsc(e.h.last_failure_reason) + '</dd></div>';
      h += '</dl></div>';
    });
    h += '</div>';
    if(!inChain)
      h += '<p class="ph-cp-msg" style="color:hsl(var(--amber-fg))">This pair has a health row but the provider is no longer in this profile\'s chain — the row outlived the config.</p>';
  } else {
    h += '<p class="ph-cp-msg">No health row for this pair. The provider is in the chain'
      +  (model ? ' at step model <span class="mono">' + phEsc(model) + '</span>' : '')
      +  ', but it has never carried a request for this profile and nothing probes it.'
      +  ' It is unassessed, not healthy.</p>';
  }

  var base = phBase(prof, prov);
  h += '<div class="ph-cp-actions">';
  if(es.length) h += '<button class="btn-sm" onclick="phAct(\'reset\')" title="Clear this pair\'s breaker state to healthy">Reset breaker</button>';
  h += '<button class="btn-sm" onclick="phAct(\'test\')" title="Send one minimal completion to this provider\'s base URL now">Test connection</button>';
  if(inChain){
    h += '<button class="btn-sm" onclick="phAct(\'degrade\')" title="Force this pair to degraded until reset">Degrade</button>';
    h += '<button class="btn-sm" onclick="phAct(\'kill\')" title="Force this pair to dead until reset">Kill</button>';
    h += '<button class="btn-sm" onclick="phAct(\'resume\')" title="Clear a manual override and return to health tracking">Resume</button>';
  }
  h += '<button class="btn-sm" onclick="phClose()">Close</button></div>';
  // The result of an action lives in PH.notice, not just in the DOM: a reload
  // (which reloadProviderHealth triggers after every action) rebuilds this panel
  // and would otherwise wipe the answer 6 s after showing it. Same class of bug
  // as a save confirmation cleared by the table refresh that follows it.
  if(PH.notice){
    h += '<div class="ph-cp-msg" id="phCpMsg" style="color:'
      + (PH.notice.cls === 'ok' ? 'hsl(var(--green-fg))'
       : PH.notice.cls === 'err' ? 'hsl(var(--red-fg))'
       : 'hsl(var(--muted-foreground))') + '">' + phEsc(PH.notice.text) + '</div>';
  } else {
    h += '<div class="ph-cp-msg" id="phCpMsg">Actions are audited and apply to '
      +  phEsc(prof + ' / ' + prov) + ' only'
      +  (base ? ' (<span class="mono">' + phEsc(base) + '</span>)' : '') + '.</div>';
  }

  host.innerHTML = h;
  host.style.display = '';
}

function phAct(kind){
  var s = PH.sel;
  if(!s) return;
  var base = phBase(s.prof, s.prov);
  var p;
  if(kind === 'reset')
    p = api('POST','/api/circuit-breaker/reset',{provider:s.prov, base_url:base, profile:s.prof});
  else if(kind === 'test')
    p = api('POST','/api/providers/test',{provider:s.prov, api_base:base});
  else
    p = api('POST','/api/providers/' + encodeURIComponent(s.prov) + '/toggle',{profile:s.prof, action:kind});

  phMsg('Working…', '');
  p.then(function(d){
    var ok = !!(d && !d.error && (d.ok || d.status || d.success || d.latency_ms != null));
    var text = (ok ? 'Done' : 'Not applied') + ' — ' + JSON.stringify(d).slice(0, 400);
    phMsg(text, ok ? 'ok' : 'err');
    loadProviderHealth();
  }).catch(function(e){
    phMsg('Request failed: ' + e, 'err');
  });
}

function phMsg(text, cls){
  // Panel state first, DOM second: the panel is rebuilt on every reload.
  PH.notice = {text: text, cls: cls};
  var el = document.getElementById('phCpMsg');
  if(!el) return;
  el.textContent = text;
  el.style.color = cls === 'ok' ? 'hsl(var(--green-fg))'
                 : cls === 'err' ? 'hsl(var(--red-fg))'
                 : 'hsl(var(--muted-foreground))';
}

function uptimeBar(pct){
  var color = pct >= 99 ? 'green' : pct >= 95 ? 'yellow' : 'orange';
  return '<div style="display:flex;align-items:center;gap:0.375rem;min-width:88px">'+
    '<div style="flex:1;height:6px;border-radius:3px;background:hsl(var(--secondary));overflow:hidden">'+
    '<div class="hp-usage-pop-fill '+color+'" style="height:100%;width:'+Math.min(pct,100)+'%"></div></div>'+
    '<span style="font-size:0.6875rem;color:hsl(var(--foreground));font-family:ui-monospace,monospace">'+pct.toFixed(1)+'%</span></div>';
}

function failureBars(buckets){
  var order = [['timeout','Timeout'],['credits','Credits'],['rate_limit','Rate Limit'],['auth','Auth'],['bad_request','Bad Request'],['internal_error','Internal'],['other','Other']];
  var total = 0; order.forEach(function(o){ total += (buckets[o[0]]||0); });
  var html = '<div style="display:flex;flex-direction:column;gap:0.3rem">';
  if(total === 0){ html += '<span style="font-size:0.6875rem;color:hsl(var(--muted-foreground))">No failures in window</span>'; }
  order.forEach(function(o){
    var n = buckets[o[0]]||0;
    if(n === 0) return;
    var pct = (n/total*100);
    var color = o[0]==='timeout'?'yellow':o[0]==='auth'?'red':o[0]==='rate_limit'?'orange':o[0]==='credits'?'red':'green';
    html += '<div style="display:flex;align-items:center;gap:0.375rem">'+
      '<span style="font-size:0.625rem;width:72px;color:hsl(var(--muted-foreground))">'+o[1]+'</span>'+
      '<div style="flex:1;height:6px;border-radius:3px;background:hsl(var(--secondary));overflow:hidden">'+
      '<div class="hp-usage-pop-fill '+color+'" style="height:100%;width:'+pct+'%"></div></div>'+
      '<span style="font-size:0.625rem;width:24px;text-align:right;color:hsl(var(--foreground))">'+n+'</span></div>';
  });
  html += '</div>';
  return html;
}

function loadFailovers(){
  api('GET','/api/providers/failovers?limit=20').then(function(d){
    var rows = d.failovers || [];
    var body = document.getElementById('failoverBody');
    if(!body) return;
    if(rows.length === 0){
      body.innerHTML = '<tr><td colspan="6" class="empty">No failovers recorded yet.</td></tr>';
      return;
    }
    var html = '';
    rows.forEach(function(f){
      var reason = f.reason || '—';
      if(reason.length > 40) reason = reason.slice(0,37)+'…';
      var msg = f.error_message || '—';
      if(msg.length > 80) msg = msg.slice(0,77)+'…';
      html += '<tr>'+
        '<td class="mono" style="font-size:0.6875rem">'+esc(f.timestamp||'—')+'</td>'+
        '<td>'+esc(f.profile||'—')+'</td>'+
        '<td><span class="badge badge-error" style="font-size:0.625rem">'+esc(f.from_provider||'—')+'</span></td>'+
        '<td><span class="badge badge-success" style="font-size:0.625rem">'+esc(f.to_provider||'—')+'</span></td>'+
        '<td class="mono" style="font-size:0.6875rem">'+esc(reason)+'</td>'+
        '<td class="mono" style="font-size:0.6875rem;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(f.error_message||'')+'">'+esc(msg)+'</td>'+
        '</tr>';
    });
    body.innerHTML = html;
  });
}

// ── Routing tab ────────────────────────────────────────────────────────────
const escC = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

var ROUTING = { enabled: false, policy: 'eager', min_score: 0, rules: [], per_task: {}, recent_decisions: [], per_profile: {}, profiles: [] };

function routingScope() {
  const sel = document.getElementById('routingProfile');
  return sel ? sel.value.trim() : '';
}

// Populate the scope dropdown from the global status (called once after the
// first global loadRouting resolves).
function renderRoutingScope() {
  const sel = document.getElementById('routingProfile');
  if (!sel || sel.dataset.built) return;
  const profs = ROUTING.profiles || [];
  const cur = sel.value;
  sel.innerHTML = '<option value="">All profiles (global)</option>' +
    profs.map(function (p) { return '<option value="' + escC(p) + '">' + escC(p) + '</option>'; }).join('');
  if (cur) sel.value = cur;
  sel.dataset.built = '1';
}

function routingScopeChanged() {
  // Reload the editor for the new scope (global or per-profile).
  const sel = document.getElementById('routingProfile');
  const prof = sel ? sel.value.trim() : '';
  const clearBtn = document.getElementById('routingClearOverride');
  if (clearBtn) clearBtn.style.display = prof && ROUTING.per_profile && ROUTING.per_profile[prof] && ROUTING.per_profile[prof].has_override ? '' : 'none';
  loadRouting(prof);
}

async function clearRoutingOverride() {
  const prof = routingScope();
  if (!prof) return;
  if (!confirm('Remove the per-profile routing override for "' + prof + '"? It will fall back to the global settings.')) return;
  const d = await api('POST', '/api/routing/policy', { profile: prof, clear_profile: true });
  if (d.error) { document.getElementById('routingError').textContent = d.error; return; }
  document.getElementById('routingClearOverride').style.display = 'none';
  await loadRouting('');
}

async function disableAllRouting() {
  if (!confirm('Disable dynamic routing globally AND for every profile? This clears all per-profile overrides.')) return;
  const err = document.getElementById('routingError');
  const status = document.getElementById('routingStatus');
  err.textContent = '';
  // 1. Disable the global toggle.
  const g = await api('POST', '/api/routing/policy', { enabled: false });
  if (g.error) { err.textContent = g.error; return; }
  // 2. Clear every profile's override so none stays enabled.
  const profs = ROUTING.profiles || [];
  for (const p of profs) {
    const d = await api('POST', '/api/routing/policy', { profile: p, clear_profile: true });
    if (d.error) { err.textContent = d.error; return; }
  }
  status.textContent = 'Dynamic routing disabled globally and for all profiles.';
  await loadRouting('');
}

async function loadRouting(profile) {
  try {
    const scope = (profile !== undefined) ? profile : routingScope();
    const url = scope ? '/api/routing/status?profile=' + encodeURIComponent(scope) : '/api/routing/status';
    const d = await api('GET', url);
    if (!scope) {
      ROUTING = d;
      renderRoutingScope();
      // Restore the previously selected scope after the global refresh.
      const sel = document.getElementById('routingProfile');
      const cur = sel ? sel.value.trim() : '';
      if (cur && d.per_profile && d.per_profile[cur]) {
        d.enabled = d.per_profile[cur].enabled;
        d.policy = d.per_profile[cur].policy;
        d.min_score = d.per_profile[cur].min_score;
        d.rules = d.per_profile[cur].rules;
        ROUTING = d;
      }
    } else {
      ROUTING = Object.assign({}, ROUTING, d);
    }
    const badge = document.getElementById('routingStatusBadge');
    badge.textContent = d.enabled ? 'enabled' : 'disabled';
    badge.className = 'badge ' + (d.enabled ? 'badge-success' : 'badge-error');
    document.getElementById('routingEnabled').checked = !!d.enabled;
    updateRoutingToggleLabel(d.enabled);
    document.getElementById('routingPolicy').value = d.policy;
    if (d.route_by) document.getElementById('routingRouteBy').value = d.route_by;
    document.getElementById('routingMinScore').value = d.min_score;
    const clearBtn = document.getElementById('routingClearOverride');
    if (clearBtn) {
      const prof = routingScope();
      const hasOv = prof && d.per_profile && d.per_profile[prof] && d.per_profile[prof].has_override;
      clearBtn.style.display = hasOv ? '' : 'none';
    }
    renderRoutingTasks();
    renderRoutingDecisions();
    // The rules table renders canonical (benchmark) names, so the registry
    // must be loaded first — otherwise the first paint falls back to raw
    // provider IDs and one model shows up under three spellings again.
    if (!CANON_NAMES.length) await loadRuleRegistry();
    renderRoutingRules();
  } catch (e) {
    document.getElementById('routingStatus').textContent = 'Failed to load routing: ' + e.message;
  }
}

function updateRoutingToggleLabel(enabled) {
  document.getElementById('routingEnabledLabel').textContent =
    enabled ? 'ON · route by capability' : 'OFF · static chain';
}

async function toggleRouting(el) {
  const err = document.getElementById('routingError');
  const status = document.getElementById('routingStatus');
  err.textContent = '';
  const body = { enabled: el.checked };
  const prof = routingScope();
  if (prof) body.profile = prof;
  const d = await api('POST', '/api/routing/policy', body);
  if (d.error) {
    err.textContent = d.error;
    el.checked = !el.checked;
    updateRoutingToggleLabel(!el.checked);
    loadRouting();
    return;
  }
  updateRoutingToggleLabel(d.enabled);
  status.textContent = d.enabled
    ? 'Dynamic routing enabled — applies to new requests immediately.'
    : 'Dynamic routing disabled — requests use the static chain order.';
  loadRouting();
}

function renderRoutingTasks() {
  const rows = document.getElementById('routingTaskRows');
  const tasks = Object.entries(ROUTING.per_task || {});
  if (!tasks.length) {
    rows.innerHTML = '<tr><td colspan="3" class="empty">No benchmark scores yet — seed the capability matrix to see recommendations.</td></tr>';
    return;
  }
  rows.innerHTML = tasks.map(([task, t]) =>
    '<tr><td class="mono">' + escC(task) + '</td>' +
    '<td class="mono">' + escC(t.model) + '</td>' +
    '<td class="mono">' + (t.score * 100).toFixed(1) + '%</td></tr>'
  ).join('');
}

function renderRoutingDecisions() {
  const rows = document.getElementById('routingDecRows');
  const decs = ROUTING.recent_decisions || [];
  if (!decs.length) {
    rows.innerHTML = '<tr><td colspan="8" class="empty">No decisions yet — routing only logs decisions once requests flow through.</td></tr>';
    return;
  }
  rows.innerHTML = decs.slice().reverse().map(d =>
    '<tr>' +
    '<td class="mono">' + String(d.ts || '').replace('T', ' ').slice(5, 19) + '</td>' +
    '<td class="mono">' + escC(d.profile || '—') + '</td>' +
    '<td class="mono">' + escC(d.task || '—') + '</td>' +
    '<td class="mono">' + escC(d.policy || '—') + '</td>' +
    '<td>' + escC(d.action || '—') + '</td>' +
    '<td class="mono" title="provider-side ID: ' + escC(d.model || '') + '">' + escC((d.provider || '') + '/' + canonFor(d.model || '')) + '</td>' +
    '<td class="mono">' + (d.score != null ? (d.score * 100).toFixed(1) + '%' : '—') + '</td>' +
    '<td class="mono">' + escC((d.rules || []).join(', ') || '—') + '</td>' +
    '</tr>'
  ).join('');
}

// ── Rules ────────────────────────────────────────────────────────────────
var PROV_MODELS = {};  // provider -> [models] for rule dropdowns

async function loadProvModels() {
  try {
    const d = await api('GET', '/api/providers');
    for (const [name, p] of Object.entries(d.providers || {})) {
      PROV_MODELS[name] = (p.models || []).slice();
    }
  } catch (e) { /* dropdowns fall back to '*' */ }
}

// ── Model identity ───────────────────────────────────────────────────────
// The model registry (Models page) is the ONE place a model's identity is
// declared: a logical name, its benchmark key, and the ID each provider
// expects. Rules are written in those canonical terms, so one model offered
// under three provider spellings is ONE option here instead of three.
var RULE_REGISTRY = {};   // logical name -> registry entry
var ALIAS_TO_CANON = {};  // any spelling (lowercased) -> canonical display name
var CANON_NAMES = [];     // canonical display names, sorted
var PROV_CANONS = {};     // provider -> [canonical display names it serves]

function canonFor(model) {
  if (!model) return model;
  return ALIAS_TO_CANON[String(model).trim().toLowerCase()] || model;
}

function registryEntryForCanon(canon) {
  const direct = RULE_REGISTRY[canon];
  if (direct) return direct;
  const key = Object.keys(RULE_REGISTRY).find(function (k) {
    const e = RULE_REGISTRY[k];
    return e.benchmark_key === canon || e.logical_name === canon;
  });
  return key ? RULE_REGISTRY[key] : null;
}

async function loadRuleRegistry() {
  try {
    const d = await api('GET', '/api/models/registry');
    RULE_REGISTRY = {}; ALIAS_TO_CANON = {}; CANON_NAMES = []; PROV_CANONS = {};
    (d.registry || []).forEach(function (e) {
      if (!e.logical_name) return;
      const canon = e.benchmark_key || e.logical_name;
      RULE_REGISTRY[e.logical_name] = e;
      ALIAS_TO_CANON[String(e.logical_name).toLowerCase()] = canon;
      ALIAS_TO_CANON[String(canon).toLowerCase()] = canon;
      if (CANON_NAMES.indexOf(canon) === -1) CANON_NAMES.push(canon);
      const mappings = e.provider_mappings || {};
      Object.keys(mappings).forEach(function (p) {
        if (mappings[p]) ALIAS_TO_CANON[String(mappings[p]).toLowerCase()] = canon;
        if (!PROV_CANONS[p]) PROV_CANONS[p] = [];
        if (PROV_CANONS[p].indexOf(canon) === -1) PROV_CANONS[p].push(canon);
      });
    });
    CANON_NAMES.sort();
    Object.keys(PROV_CANONS).forEach(function (p) { PROV_CANONS[p].sort(); });
  } catch (e) { /* the model dropdown falls back to raw provider lists */ }
}

function ruleModelLabel(canon, provider) {
  // Show the canonical (benchmark) name, with the provider-side ID in
  // parentheses so the operator can see WHICH spelling this maps to. That is
  // the whole point: one entry, several provider names.
  const entry = registryEntryForCanon(canon);
  const mappings = (entry && entry.provider_mappings) || {};
  if (provider && provider !== '*' && mappings[provider] && mappings[provider] !== canon) {
    return canon + ' (' + mappings[provider] + ')';
  }
  const ids = Object.keys(mappings)
    .map(function (p) { return mappings[p]; })
    .filter(function (v, i, a) { return v && v !== canon && a.indexOf(v) === i; });
  return ids.length ? canon + ' (' + ids.join(', ') + ')' : canon;
}

function ruleOptionsHtml(options, cur) {
  return options.map(o =>
    '<option value="' + escC(o.value) + '"' + (String(o.value) === String(cur) ? ' selected' : '') + '>' +
    escC(o.label) + '</option>'
  ).join('');
}

function ruleSelect(name, options, cur, onchange) {
  const oc = onchange ? ' onchange="' + onchange + '"' : '';
  return '<select class="rule-' + name + '"' + oc +
    ' style="padding:0.25rem 0.4rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.72rem;max-width:170px">' +
    ruleOptionsHtml(options, cur) + '</select>';
}

function ruleTaskOptions(cur, taken) {
  // Tasks come from the capability matrix. *taken* (used only for the draft
  // row) hides intents that already have a rule for this profile, because a
  // second rule for one intent is order-dependent and refused by the API.
  const tasks = Object.keys(ROUTING.per_task || {});
  return [{value:'*', label:'*'}, ...tasks.map(t => ({value:t, label:t}))]
    .filter(o => o.value === '*' || !taken || !taken[o.value]);
}

function usedIntents(profile) {
  const taken = {};
  (ROUTING.rules || []).forEach(function (r) {
    if (String(r.profile || '*') !== String(profile || '*')) return;
    if (Array.isArray(r.task)) { r.task.forEach(function (t) { taken[t] = 1; }); }
    else { taken[String(r.task || '*')] = 1; }
  });
  return taken;
}

function syncDraftIntents(sel) {
  const tr = sel.closest('tr');
  const taskSel = tr.querySelector('.rule-task');
  if (!taskSel) return;
  const cur = taskSel.value;
  const taken = usedIntents(sel.value);
  taskSel.innerHTML = ruleOptionsHtml(ruleTaskOptions(cur, taken), cur);
}

function ruleProfileOptions(cur) {
  const profs = ROUTING.profiles || [];
  const opts = [{value:'*', label:'*'}, ...profs.map(p => ({value:p, label:p}))];
  if (cur && cur !== '*' && !profs.includes(cur)) opts.push({value: cur, label: cur});
  return opts;
}

function ruleProviderOptions(cur) {
  const names = Object.keys(PROV_MODELS);
  const opts = [{value:'*', label:'*'}, ...names.map(n => ({value:n, label:n}))];
  if (cur && cur !== '*' && !names.includes(cur)) opts.push({value: cur, label: cur});
  return opts;
}

function ruleModelOptions(provider, cur) {
  // Options are CANONICAL models — the benchmark name shown on the Models
  // page — never raw provider IDs. A model offered as ``deepseek-flash``,
  // ``deepseek-v4.1-flash`` and ``deepseek/deepseek-v4.1-flash`` is therefore
  // ONE option, not three. When a provider is pinned, only the models that
  // provider is mapped to are offered.
  let models = CANON_NAMES.slice();
  if (!models.length) return [];   // registry unavailable → caller falls back
  if (provider && provider !== '*' && PROV_CANONS[provider]) {
    models = PROV_CANONS[provider].slice();
  }
  const opts = [{value:'*', label:'*'},
    ...models.map(m => ({value:m, label:ruleModelLabel(m, provider)}))];
  // Keep an unregistered/legacy value selectable rather than silently
  // resetting the rule to '*'.
  if (cur && cur !== '*' && !models.includes(cur)) {
    opts.push({value: cur, label: ruleModelLabel(cur, provider)});
  }
  return opts;
}

// The picker falls back to the old raw-provider-ID list only when the
// registry could not be read, so the control is never empty.
function ruleModelOptionsCompat(provider, cur) {
  const canon = ruleModelOptions(provider, cur);
  if (canon.length) return canon;
  let models = [];
  if (provider && provider !== '*' && PROV_MODELS[provider]) {
    models = PROV_MODELS[provider].slice();
  } else {
    const seen = {};
    Object.keys(PROV_MODELS).forEach(function (p) {
      (PROV_MODELS[p] || []).forEach(function (m) { if (!seen[m]) { seen[m] = 1; models.push(m); } });
    });
    models.sort();
  }
  const opts = [{value:'*', label:'*'}, ...models.map(m => ({value:m, label:m}))];
  if (cur && cur !== '*' && !models.includes(cur)) opts.push({value: cur, label: cur});
  return opts;
}

function syncRuleModelSelect(sel) {
  // Provider changed → repopulate the same row's model dropdown.
  const tr = sel.closest('tr');
  const modelSel = tr.querySelector('.rule-model');
  if (!modelSel) return;
  const cur = modelSel.value;
  modelSel.innerHTML = ruleOptionsHtml(ruleModelOptionsCompat(sel.value, cur), cur);
}

function renderRoutingRules() {
  const rows = document.getElementById('routingRulesRows');
  // Preserve an in-progress draft row across the 15s auto-refresh re-render.
  // NOTE: outerHTML loses live <select> values (it only keeps the default
  // 'selected' attributes), so we read the current values and rebuild.
  const draft = rows.querySelector('tr.rule-draft');
  const draftRule = draft ? _readRuleRow(draft) : null;
  const rules = ROUTING.rules || [];
  if (!rules.length && !draftRule) {
    rows.innerHTML = '<tr><td colspan="7" class="empty">No rules — routing uses policy + benchmark scores only.</td></tr>';
    return;
  }
  rows.innerHTML = rules.map((r, i) => {
    const model = canonFor(r.model);
    return '<tr>' +
    '<td>' + ruleSelect('task', ruleTaskOptions(r.task), r.task) + '</td>' +
    '<td>' + ruleSelect('profile', ruleProfileOptions(r.profile), r.profile) + '</td>' +
    '<td>' + ruleSelect('action', [{value:'prefer', label:'prefer'}, {value:'block', label:'block'}, {value:'policy', label:'policy'}], r.action) + '</td>' +
    '<td>' + ruleSelect('provider', ruleProviderOptions(r.provider), r.provider, 'syncRuleModelSelect(this)') + '</td>' +
    '<td>' + ruleSelect('model', ruleModelOptionsCompat(r.provider, model), model) + '</td>' +
    '<td><input class="rule-min" type="number" min="0" max="1" step="0.05" value="' + escC(r.min_score != null ? r.min_score : '') + '" placeholder="—" style="width:52px;padding:0.25rem 0.4rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.72rem"></td>' +
    '<td style="white-space:nowrap">' +
      '<button class="btn btn-outline btn-sm" onclick="saveRulesRow(' + i + ')">Save</button> ' +
      '<button class="btn btn-outline btn-sm" onclick="deleteRule(' + i + ')">✕</button>' +
    '</td></tr>';
  }).join('');
  if (draftRule) rows.insertAdjacentHTML('beforeend', ruleDraftHtml(draftRule));
}

function ruleDraftHtml(rule) {
  rule = rule || {};
  const profile = rule.profile || '*';
  const taken = usedIntents(profile);
  const model = canonFor(rule.model || '*');
  return '<tr class="rule-draft">' +
    '<td>' + ruleSelect('task', ruleTaskOptions(rule.task || '*', taken), rule.task || '*') + '</td>' +
    '<td>' + ruleSelect('profile', ruleProfileOptions(profile), profile, 'syncDraftIntents(this)') + '</td>' +
    '<td>' + ruleSelect('action', [{value:'prefer', label:'prefer'}, {value:'block', label:'block'}, {value:'policy', label:'policy'}], rule.action || 'prefer') + '</td>' +
    '<td>' + ruleSelect('provider', ruleProviderOptions(rule.provider || '*'), rule.provider || '*', 'syncRuleModelSelect(this)') + '</td>' +
    '<td>' + ruleSelect('model', ruleModelOptionsCompat(rule.provider || '*', model), model) + '</td>' +
    '<td><input class="rule-min" type="number" min="0" max="1" step="0.05" value="' + escC(rule.min_score != null ? rule.min_score : '') + '" placeholder="—" style="width:52px;padding:0.25rem 0.4rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.72rem"></td>' +
    '<td><button class="btn btn-primary btn-sm" onclick="saveNewRule(this)">Add</button></td>' +
    '</tr>';
}

function addRuleRow() {
  const rows = document.getElementById('routingRulesRows');
  if (rows.querySelector('.empty')) rows.innerHTML = '';
  rows.insertAdjacentHTML('beforeend', ruleDraftHtml({}));
}

function _readRuleRow(tr) {
  const get = (sel) => { const el = tr.querySelector(sel); return el ? el.value.trim() : ''; };
  const min = tr.querySelector('.rule-min') ? tr.querySelector('.rule-min').value : '';
  const rule = {
    task: get('.rule-task'), profile: get('.rule-profile'), action: get('.rule-action'),
    provider: get('.rule-provider'), model: get('.rule-model'),
  };
  if (min !== '') rule.min_score = parseFloat(min);
  return rule;
}

async function saveRulesRow(i) {
  const tr = document.querySelectorAll('#routingRulesRows tr')[i];
  if (!tr) return;
  ROUTING.rules[i] = _readRuleRow(tr);
  await persistRules();
}

async function saveNewRule(btn) {
  const tr = btn.closest('tr');
  const rule = _readRuleRow(tr);
  ROUTING.rules.push(rule);
  tr.remove();
  await persistRules();
}

async function deleteRule(i) {
  ROUTING.rules.splice(i, 1);
  await persistRules();
}

async function persistRules() {
  const err = document.getElementById('routingError');
  const status = document.getElementById('routingStatus');
  err.textContent = '';
  const body = { rules: ROUTING.rules };
  const prof = routingScope();
  if (prof) body.profile = prof;
  const d = await api('POST', '/api/routing/rules', body);
  if (d.error) { err.textContent = d.error; loadRouting(); return; }
  status.textContent = 'Rules saved — apply immediately to new requests.';
  loadRouting();
}

async function saveRouting() {
  const err = document.getElementById('routingError');
  const status = document.getElementById('routingStatus');
  err.textContent = '';
  const body = { policy: document.getElementById('routingPolicy').value };
  body.route_by = document.getElementById('routingRouteBy').value;
  body.enabled = document.getElementById('routingEnabled').checked;
  const prof = routingScope();
  if (prof) body.profile = prof;
  const ms = parseFloat(document.getElementById('routingMinScore').value);
  if (!isNaN(ms)) body.min_score = ms;
  const d = await api('POST', '/api/routing/policy', body);
  if (d.error) { err.textContent = d.error; return; }
  status.textContent = 'Saved — policy applies to new requests immediately.';
  loadRouting();
}

loadRuleRegistry().then(loadRouting);
loadProvModels();
setInterval(function () { loadRouting(); }, 15000);
// Re-read the registry on a slower cadence so an edit made on the Models page
// (a new benchmark key, a new provider mapping) reaches the rule picker
// without a page reload.
setInterval(function () { loadRuleRegistry(); }, 60000);
applyHashTab();
// ── Capabilities / model-limits table (prod feature, kept in the union) ──
var _caps = [];

function capsEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function capsCtx(n) {
  if (n == null) return '—';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return Math.round(n / 1000) + 'k';
  return String(n);
}

async function loadCaps() {
  var rows = document.getElementById('capsRows');
  if (!rows) return;
  try {
    var d = await api('GET', '/api/models/limits');
    _caps = d.models || [];
    renderCaps();
  } catch (e) {
    rows.innerHTML = '<tr><td colspan="6" class="empty">Failed to load: ' + capsEsc(e.message) + '</td></tr>';
  }
}

function renderCaps() {
  var rows = document.getElementById('capsRows');
  if (!rows) return;
  if (!_caps.length) {
    rows.innerHTML = '<tr><td colspan="6" class="empty">No model limits declared.</td></tr>';
    return;
  }
  rows.innerHTML = _caps.map(function (m, i) {
    var used = (m.providers || []).map(function (p) {
      return '<span class="badge">' + capsEsc(p) + '</span>';
    }).join(' ');
    if (m.lanes && m.lanes.length) {
      used += ' <span style="font-size:0.625rem;color:hsl(var(--muted-foreground))">' + capsEsc(m.lanes.join(', ')) + '</span>';
    }
    return '<tr>' +
      '<td class="mono" title="' + capsEsc(m.description || '') + '">' + capsEsc(m.model) + '</td>' +
      '<td><label class="toggle" title="may this step serve an image?">' +
        '<input type="checkbox" ' + (m.supports_vision ? 'checked' : '') + ' onchange="setVision(' + i + ', this.checked)">' +
        '<span class="toggle-track" aria-hidden="true"></span>' +
      '</label></td>' +
      '<td>' + (m.supports_thinking ? '<span class="badge badge-success">yes</span>' : '<span class="badge">no</span>') + '</td>' +
      '<td class="mono">' + capsCtx(m.context_window) + '</td>' +
      '<td>' + (used || '<span style="color:hsl(var(--muted-foreground))">—</span>') + '</td>' +
      '<td><button class="btn-sm" onclick="probeCap(' + i + ')">Probe</button></td>' +
      '</tr>';
  }).join('');
}

function _capsMsg(kind, text) {
  var err = document.getElementById('capsError');
  var st = document.getElementById('capsStatus');
  if (kind === 'error') { if (err) err.textContent = text; if (st) st.textContent = ''; }
  else { if (st) st.textContent = text; if (err) err.textContent = ''; }
}

async function setVision(i, on) {
  var m = _caps[i];
  if (!m) return;
  var d = await api('POST', '/api/models/limits', { model: m.model, supports_vision: on });
  if (d.error) {
    _capsMsg('error', d.error);
    m.supports_vision = !on;   // roll the checkbox back to the truth
    renderCaps();
    return;
  }
  m.supports_vision = on;
  _capsMsg('ok', m.model + ': vision ' + (on ? 'enabled' : 'disabled') + ' — in force for the next request.');
}

async function probeCap(i) {
  var m = _caps[i];
  if (!m) return;
  _capsMsg('ok', 'Probing ' + m.model + '…');
  var d = await api('POST', '/api/models/limits/probe', { model: m.model, apply: true });
  if (d.status === 'vision') {
    _capsMsg('ok', m.model + ' → vision CONFIRMED — read the fixture in ' + (d.duration_ms != null ? d.duration_ms : '?') + 'ms; flag set true.');
  } else if (d.status === 'no_vision') {
    _capsMsg('ok', m.model + ' → did NOT read the fixture; flag set false.');
  } else {
    _capsMsg('error', m.model + ' → probe could not complete: ' + (d.error || d.error || 'unknown'));
    return;
  }
  await loadCaps();
}

async function probeAllCaps() {
  if (!_caps.length) return;
  for (var i = 0; i < _caps.length; i++) {
    var m = _caps[i];
    if (!m.providers || !m.providers.length) continue;   // nothing serves it
    _capsMsg('ok', 'Probing ' + m.model + ' (' + (i + 1) + '/' + _caps.length + ')…');
    var d = await api('POST', '/api/models/limits/probe', { model: m.model, apply: true });
    if (d.status === 'vision' || d.status === 'no_vision') {
      m.supports_vision = (d.status === 'vision');
    }
  }
  _capsMsg('ok', 'Probed every lane model — flags written from the results.');
  await loadCaps();
}

loadCaps();
applyHashTab();
{% endraw %}</script>
<script>
// ── Active assessment control bar ─────────────────────────────────────────
// The matrix says what the state IS. This says how often that is established,
// and lets it be established now — because an operator staring at a stale cell
// should not have to wait out the interval to find out if it is still true.

var PH_PROBE = {loaded: false, saving: false};

function phLoadProbe(){
  api('GET','/api/providers/probe').then(function(d){
    var p = (d && d.prober) || {};
    var st = document.getElementById('phProbeState');
    if(!st) return;
    if(!d || d.ok === false){
      st.innerHTML = '<b>Prober status unavailable</b> — ' + phEsc((d && d.error) || 'unknown');
      return;
    }
    PH_PROBE.loaded = true;
    var iv = p.interval_seconds || 60;
    var sel = document.getElementById('phProbeInterval');
    // Keep the select honest if the stored value is not one of the presets.
    if(sel && !Array.prototype.some.call(sel.options, function(o){ return +o.value === iv; })){
      var o = document.createElement('option');
      o.value = iv; o.textContent = iv + ' s (custom)';
      sel.appendChild(o);
    }
    if(sel) sel.value = String(iv);
    var en = document.getElementById('phProbeEnabled');
    if(en) en.checked = !!p.enabled;

    var last = p.last_cycle_at ? new Date(p.last_cycle_at) : null;
    var age = last ? Math.round((Date.now() - last.getTime())/1000) : null;
    var when = age === null ? 'not yet run'
             : (age < 90 ? age + ' s ago' : Math.round(age/60) + ' min ago');
    st.innerHTML = (p.enabled
        ? '<b>Assessing</b> every <b>' + iv + ' s</b>'
        : '<b>Probing off</b> — health is only written by real traffic')
      + ' · ' + phEsc(p.tracked) + ' pairs tracked'
      + ' · last cycle ' + phEsc(when)
      + (p.running ? '' : ' · <b>thread not running</b>');

    var sk = p.skipped || {};
    var keys = Object.keys(sk);
    var covered = p.covered_by_traffic || 0;
    var msg = document.getElementById('phProbeMsg');
    if(msg){
      var bits = [];
      if(covered) bits.push(covered + ' covered by real traffic (not probed — no cost, no new information)');
      if(keys.length) bits.push(keys.length + ' not probed: '
        + keys.slice(0,2).map(function(k){ return sk[k]; }).join('; ')
        + (keys.length > 2 ? ' (+' + (keys.length-2) + ' more)' : ''));
      msg.textContent = bits.join(' · ');
    }
  }).catch(function(){});
}

function phSaveProbe(){
  if(PH_PROBE.saving) return;
  PH_PROBE.saving = true;
  var iv = +(document.getElementById('phProbeInterval').value || 60);
  var en = document.getElementById('phProbeEnabled').checked;
  var msg = document.getElementById('phProbeMsg');
  api('POST','/api/providers/probe',{action:'config', interval_seconds:iv, enabled:en})
    .then(function(d){
      PH_PROBE.saving = false;
      if(msg) msg.textContent = (d && d.ok)
        ? 'Saved — assesses every ' + ((d.effective && d.effective.interval_seconds) || iv) + ' s from the next cycle'
        : 'Not saved: ' + ((d && d.error) || 'unknown error');
      phLoadProbe();
    }).catch(function(e){
      PH_PROBE.saving = false;
      if(msg) msg.textContent = 'Not saved: ' + e;
    });
}

function phProbeNow(){
  var btn = document.getElementById('phProbeNow');
  var msg = document.getElementById('phProbeMsg');
  if(btn){ btn.disabled = true; btn.textContent = 'Checking…'; }
  api('POST','/api/providers/probe',{action:'check'}).then(function(d){
    if(btn){ btn.disabled = false; btn.textContent = 'Check now'; }
    var rs = (d && d.results) || [];
    var ok = rs.filter(function(r){ return r.ok && !r.skipped; }).length;
    var sk = rs.filter(function(r){ return r.skipped; }).length;
    var fa = rs.length - ok - sk;
    if(msg) msg.textContent = 'Checked ' + rs.length + ': ' + ok + ' reachable, '
      + fa + ' failing, ' + sk + ' skipped';
    loadProviderHealth();
  }).catch(function(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Check now'; }
    if(msg) msg.textContent = 'Check failed: ' + e;
  });
}

(function wireProbeBar(){
  var sel = document.getElementById('phProbeInterval');
  var en = document.getElementById('phProbeEnabled');
  var now = document.getElementById('phProbeNow');
  if(sel) sel.addEventListener('change', phSaveProbe);
  if(en) en.addEventListener('change', phSaveProbe);
  if(now) now.addEventListener('click', phProbeNow);
})();
</script>
