{% if tab == 'providers' %}
<script>{% raw %}
var _selectedModels=[];
var _editingProvider=null; // original provider name when editing (rename source)
var _discoverPlan=null; // {id, status, error} from /api/providers/discover for commandcode

function switchProvTab(tab, btn){
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
  // Persist the active tab so a refresh (or a shared link) returns to it.
  if (window.location.hash !== '#' + tab) {
    try { window.location.hash = tab; } catch (e) { /* noop — hash may be blocked */ }
  }
}

// Deep-link support: /providers#routing reopens that tab after a refresh.
function applyHashTab(){
  var tab = (window.location.hash || '').replace(/^#/, '');
  if (['health', 'config', 'routing'].indexOf(tab) === -1) return;
  var btn = document.querySelector('.tab-btn[data-tab="' + tab + '"]');
  if (btn) switchProvTab(tab, btn);
}
window.addEventListener('hashchange', applyHashTab);

function loadPresets(){api('GET','/api/providers/presets').then(function(d){var s=document.getElementById('provPreset');Object.keys(d.presets||{}).forEach(function(k){s.innerHTML+='<option value="'+k+'">'+k+'</option>'})})}

function loadPreset(){var k=document.getElementById('provPreset').value;if(!k)return;showAddProvForm();api('GET','/api/providers/presets').then(function(d){var p=(d.presets||{})[k];if(!p)return;document.getElementById('provName').value=k;document.getElementById('provUrl').value=p.api_base||'';_selectedModels=[];renderSelected();refreshTestModelOptions();document.getElementById('provSaveBtn').disabled=false})}

function showAddProvForm(){document.getElementById('provForm').style.display='block';document.getElementById('provName').value='';document.getElementById('provUrl').value='';document.getElementById('provKeyVal').value='';_selectedModels=[];_allDiscovered=[];_discFilter='';_discoverPage=0;_discoverPlan=null;_focusSearch=false;_editingProvider=null;renderSelected();refreshTestModelOptions();document.getElementById('testResult').style.display='none';document.getElementById('discoveryResult').style.display='none';document.getElementById('provSaveBtn').disabled=true}

function hideAddProvForm(){document.getElementById('provForm').style.display='none'}

function renderSelected(){var c=document.getElementById('selectedModels');if(_selectedModels.length===0){c.innerHTML='<span style="font-size:0.6875rem;color:hsl(var(--muted-foreground))">none selected — use Discover Models</span>';return}var h='';_selectedModels.forEach(function(m,i){h+='<span style="display:inline-flex;align-items:center;gap:0.1875rem;padding:0.125rem 0.5rem;background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-radius:9999px;font-size:0.6875rem;font-weight:600">'+m+'<button onclick="removeModel('+i+')" style="background:none;border:none;color:inherit;cursor:pointer;font-size:0.75rem;padding:0;line-height:1">✕</button></span>'});c.innerHTML=h}

function removeModel(i){_selectedModels.splice(i,1);renderSelected();updatePillStyles()}

function toggleModel(id){var i=_selectedModels.indexOf(id);if(i>=0)_selectedModels.splice(i,1);else _selectedModels.push(id);renderSelected();updatePillStyles()}

function updatePillStyles(){var ps=document.querySelectorAll('#modelPillList > div');ps.forEach(function(s){var id=s.getAttribute('data-id');if(!id)return;var sel=_selectedModels.indexOf(id)>=0;s.style.background=sel?'hsl(var(--primary))':'hsl(var(--secondary)/0.2)';s.style.color=sel?'hsl(var(--primary-foreground))':'hsl(var(--muted-foreground))';s.style.borderColor=sel?'hsl(var(--primary))':'hsl(var(--card-border))'})}

var _allDiscovered = [];
var _discoverPage = 0;
var _PAGE = 20;
var _discFilter = '';
var _focusSearch = false; // set when re-render was caused by typing in the filter

function discoverModels(){
  var base=document.getElementById('provUrl').value.trim();
  var name=document.getElementById('provName').value.trim();
  if(!base){alert('Enter API Base URL first');return}
  var el=document.getElementById('discoveryResult');
  el.style.display='block';el.innerHTML='<div style="font-size:0.75rem;color:hsl(var(--amber-fg))">Discovering models...</div>';
  api('POST','/api/providers/discover',{api_base:base,provider:name}).then(function(d){
    if(!d.ok){el.innerHTML='<div style="font-size:0.75rem;color:hsl(var(--red-fg))">Failed: '+(d.error||'HTTP '+d.status)+'</div>';return}
    _allDiscovered = d.models || [];
    _discoverPlan = {id:d.plan_id||null, status:d.plan_status||null, error:d.plan_error||null};
    _discoverPage = 0; _discFilter = ''; _focusSearch = false;
    renderDiscoverResults();
    refreshTestModelOptions();
  })}

// Populate the "Test with model" dropdown from the SELECTED models only.
function refreshTestModelOptions(){
  var sel=document.getElementById('provTestModel');
  if(!sel) return;
  var prev=sel.value;
  var seen={};var opts=[];
  function add(id){if(!id||seen[id])return;seen[id]=1;opts.push(id)}
  _selectedModels.forEach(add);
  var html=opts.length? '':'<option value="">—</option>';
  opts.forEach(function(m){html+='<option value="'+m.replace(/"/g,'&quot;')+'">'+esc(m)+'</option>'});
  sel.innerHTML=html;
  if(prev&&seen[prev])sel.value=prev;
  else if(opts.length)sel.value=opts[0];
}

function renderDiscoverResults(){
  var el = document.getElementById('discoveryResult');
  if (!el) return;
  var filtered = _allDiscovered;
  if (_discFilter) { var q = _discFilter.toLowerCase(); filtered = _allDiscovered.filter(function(m){ return m.id.toLowerCase().includes(q) }); }
  var total = filtered.length;
  var pages = Math.ceil(total / _PAGE);
  if (_discoverPage >= pages) _discoverPage = Math.max(0, pages - 1);
  var start = _discoverPage * _PAGE;
  var pageModels = filtered.slice(start, start + _PAGE);

  var planHtml='';
  if(_discoverPlan && _discoverPlan.id){
    planHtml = '<div style="font-size:0.6875rem;color:hsl(var(--muted-foreground));margin-bottom:0.375rem">Your plan: <b style="color:hsl(var(--foreground))">'+esc(String(_discoverPlan.id))+'</b>'+( _discoverPlan.status?' &middot; '+esc(String(_discoverPlan.status)):'')+'<span style="margin-left:0.5rem;opacity:0.8">some models need a higher plan or the Anthropic /messages endpoint</span></div>';
  } else if(_discoverPlan && _discoverPlan.error){
    planHtml = '<div style="font-size:0.6875rem;color:hsl(var(--amber-fg));margin-bottom:0.375rem">Plan unknown &mdash; '+esc(String(_discoverPlan.error))+'</div>';
  }

  el.innerHTML = '<input type="text" id="modelSearch" placeholder="Filter '+total+' of '+_allDiscovered.length+' models..." oninput="filterDiscovered()" style="width:100%;padding:0.375rem 0.5rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.75rem;margin-bottom:0.5rem">' + planHtml;

  if (total === 0) { el.innerHTML+='<div class="empty" style="padding:0.75rem;font-size:0.75rem">No models match filter</div>'; return; }

  var inner = '<div style="font-size:0.6875rem;color:hsl(var(--muted-foreground));margin-bottom:0.375rem;display:flex;justify-content:space-between;align-items:center"><span>'+total+' model'+(total!==1?'s':'')+'</span>';
  if (pages > 1) {
    inner += '<span style="display:flex;align-items:center;gap:0.375rem">';
    inner += '<button '+(start===0?'disabled':'')+' onclick="changePage(-1)" style="font-size:0.625rem;padding:0.125rem 0.375rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:3px;color:hsl(var(--foreground));cursor:pointer;line-height:1">Prev</button>';
    inner += '<span style="font-size:0.625rem;color:hsl(var(--muted-foreground));white-space:nowrap">' + (_discoverPage+1) + '/' + pages + '</span>';
    inner += '<button '+(start+_PAGE>=total?'disabled':'')+' onclick="changePage(1)" style="font-size:0.625rem;padding:0.125rem 0.375rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:3px;color:hsl(var(--foreground));cursor:pointer;line-height:1">Next</button>';
    inner += '<span style="font-size:0.625rem;color:hsl(var(--muted-foreground));margin:0 0.125rem">·</span>';
    inner += '<select onchange="changePageSize(this.value)" style="font-size:0.625rem;padding:0.125rem 0.25rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:3px;color:hsl(var(--foreground));line-height:1;margin-bottom:0">' + [10,20,50,100,999].map(function(n){ return '<option value="'+n+'"'+(n===_PAGE?' selected':'')+'>'+ (n===999?'All':n) +'</option>' }).join('') + '</select>';
    inner += '</span>';
  }
  inner += '</div>';

  inner += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:3px" id="modelPillList">';
  pageModels.forEach(function(m){
    var sel = _selectedModels.indexOf(m.id) >= 0;
    inner += '<div data-id="'+esc(m.id)+'" onclick="toggleModel(\''+m.id.replace(/'/g,"\\'")+'\')" style="padding:0.3rem 0.5rem;font-size:0.6875rem;cursor:pointer;border:1px solid '+(sel?'hsl(var(--primary))':'hsl(var(--card-border))')+';background:'+(sel?'hsl(var(--primary))':'hsl(var(--secondary)/0.2)')+';color:'+(sel?'hsl(var(--primary-foreground))':'hsl(var(--muted-foreground))')+';transition:all 0.15s;user-select:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px;margin-bottom:1px">'+esc(m.id)+'</div>';
  });
  inner += '</div>';
  el.innerHTML += inner;
  var fi = document.getElementById('modelSearch');
  if (fi) {
    fi.value = _discFilter;
    // Re-focus the search box when the re-render was caused by typing, so
    // the user can keep typing without clicking back into the field.
    if (_focusSearch) {
      fi.focus();
      try { fi.setSelectionRange(fi.value.length, fi.value.length); } catch (e) {}
    }
  }
  _focusSearch = false;
}

function changePage(delta){ _discoverPage += delta; renderDiscoverResults() }
function changePageSize(n){ _PAGE = parseInt(n); _discoverPage = 0; renderDiscoverResults() }
function filterDiscovered(){ _discFilter = (document.getElementById('modelSearch')||{}).value||''; _discoverPage = 0; _focusSearch = true; renderDiscoverResults() }

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function testProvider(){var r=document.getElementById('testResult');r.style.display='block';r.textContent='Testing...';r.style.color='hsl(var(--amber-fg))';var name=document.getElementById('provName').value.trim();var msel=document.getElementById('provTestModel');var model=msel&&msel.value?msel.value:(_selectedModels[0]||'default');api('POST','/api/providers/test',{api_base:document.getElementById('provUrl').value,provider:name,model:model}).then(function(d){if(d.ok){r.textContent='Connected — model: '+d.model;r.style.color='hsl(var(--green-fg))';document.getElementById('provSaveBtn').disabled=false}else{var msg=d.error||('HTTP '+(d.status||'?')+' failed');var hint='';if(d.code==='MODEL_NOT_IN_PLAN'||d.code==='permission_error'){hint='<div style="margin-top:0.25rem;font-size:0.6875rem;color:hsl(var(--muted-foreground))">This model isn\u2019t covered by your current plan \u2014 pick another model, upgrade, or use extra on-demand usage.</div>'}else if(d.code==='unsupported_model'){hint='<div style="margin-top:0.25rem;font-size:0.6875rem;color:hsl(var(--muted-foreground))">This model uses the Anthropic /provider/v1/messages shape \u2014 it can\u2019t be reached via /chat/completions.</div>'}r.innerHTML=msg+hint;r.style.color='hsl(var(--red-fg))'}})}

function editProvider(name){_editingProvider=name;api('GET','/api/providers').then(function(d){var p=(d.providers||{})[name];if(!p)return;showAddProvFormForEdit();document.getElementById('provName').value=name;document.getElementById('provUrl').value=p.api_base||'';document.getElementById('provKeyVal').value='';_selectedModels=(p.models||[]).slice();_allDiscovered=[];_discFilter='';_discoverPage=0;_discoverPlan=null;renderSelected();refreshTestModelOptions();document.getElementById('provSaveBtn').disabled=false})}

// Like showAddProvForm() but keeps the editing state (original name).
function showAddProvFormForEdit(){document.getElementById('provForm').style.display='block';document.getElementById('provKeyVal').value='';document.getElementById('testResult').style.display='none';document.getElementById('discoveryResult').style.display='none'}

function saveProvider(){var name=document.getElementById('provName').value.trim().replace(/\u00a0/g,' ');if(!name){alert('Provider name is required');return}
  var doSave=function(){var payload={api_base:document.getElementById('provUrl').value.trim(),models:_selectedModels};var kv=document.getElementById('provKeyVal').value.trim();if(kv)payload.api_key=kv;
    if(_editingProvider){
      // Editing an existing provider: update its config in place (PUT).
      api('PUT','/api/providers/'+encodeURIComponent(_editingProvider),payload).then(function(d){
        if(!d.ok){alert('Error: '+(d.error||'unknown'));return}
        var renamed=name!==_editingProvider;
        var after=function(){location.reload()};
        if(renamed){
          // Name changed: move config entry, chain steps and credentials to the
          // new name (rename endpoint), then reload.
          api('POST','/api/providers/'+encodeURIComponent(_editingProvider)+'/rename',{new_name:name}).then(after).catch(after);
        } else { after(); }
      });
    } else {
      // New provider: create.
      payload.name=name;
      api('POST','/api/providers',payload).then(function(d){if(d.ok){location.reload()}else{alert('Error: '+(d.error||'unknown'))}});
    }
  };
  if(_editingProvider && name!==_editingProvider && !confirm('Rename provider "'+_editingProvider+'" to "'+name+'"? Profile chain steps and credentials move with it.'))return;
  doSave();
}

function deleteProvider(name){if(!confirm('Delete provider "'+name+'"? This removes it from all profile chains.'))return;api('DELETE','/api/providers/'+encodeURIComponent(name)).then(function(d){if(d.ok)location.reload();else alert('Error: '+(d.error||'unknown'))})}

function resetCooldown(provider, baseUrl, profile){
  if(!confirm('Reset cooldown for '+provider+'/'+profile+'?'))return;
  api('POST','/api/circuit-breaker/reset',{provider:provider,base_url:baseUrl,profile:profile}).then(function(d){
    if(d.ok)loadProviderHealth();
    else alert('Error: '+(d.error||'unknown'));
  });
}

function toggleProviderState(provider, profile, action){
  var labels = {degrade:'Force Degrade', kill:'Force Kill', resume:'Resume'};
  if(!confirm((labels[action]||action)+' for '+provider+'/'+profile+'?'))return;
  api('POST','/api/providers/'+encodeURIComponent(provider)+'/toggle',{profile:profile,action:action}).then(function(d){
    if(d.ok)loadProviderHealth();
    else alert('Error: '+(d.error||'unknown'));
  });
}

// Profile-grouped health stacks. Expanded groups + open detail rows survive
// the 10s auto-refresh re-render via these maps.
var _provOpen = {};   // profile-stack sid -> true when expanded
var _hdetOpen = {};   // provider-detail sid -> true when open

function toggleProvProfile(sid){
  toggleStack(sid);
  var el = document.getElementById(sid);
  _provOpen[sid] = !!(el && el.classList.contains('expanded'));
}

function toggleHealthDetail(id){
  var tr = document.getElementById('hdet-'+id);
  var chev = document.getElementById('hchev-'+id);
  if(!tr) return;
  var show = tr.style.display !== 'table-row';
  tr.style.display = show ? 'table-row' : 'none';
  if(chev) chev.textContent = show ? '▴' : '▾';
  _hdetOpen[id] = show;
}

function uptimeBar(pct){
  var color = pct >= 99 ? 'green' : pct >= 95 ? 'yellow' : 'orange';
  return '<div style="display:flex;align-items:center;gap:0.375rem;min-width:88px">'+
    '<div style="flex:1;height:6px;border-radius:3px;background:hsl(var(--secondary));overflow:hidden">'+
    '<div class="hp-usage-pop-fill '+color+'" style="height:100%;width:'+Math.min(pct,100)+'%"></div></div>'+
    '<span style="font-size:0.6875rem;color:hsl(var(--foreground));font-family:ui-monospace,monospace">'+pct.toFixed(1)+'%</span></div>';
}

function failureBars(buckets){
  var order = [['timeout','Timeout'],['credits','Credits'],['rate_limit','Rate Limit'],['auth','Auth'],['bad_request','Bad Request'],['internal_error','Internal'],['other','Other']];
  var total = 0; order.forEach(function(o){ total += (buckets[o[0]]||0); });
  var html = '<div style="display:flex;flex-direction:column;gap:0.3rem">';
  if(total === 0){ html += '<span style="font-size:0.6875rem;color:hsl(var(--muted-foreground))">No failures in window</span>'; }
  order.forEach(function(o){
    var n = buckets[o[0]]||0;
    if(n === 0) return;
    var pct = (n/total*100);
    var color = o[0]==='timeout'?'yellow':o[0]==='auth'?'red':o[0]==='rate_limit'?'orange':o[0]==='credits'?'red':'green';
    html += '<div style="display:flex;align-items:center;gap:0.375rem">'+
      '<span style="font-size:0.625rem;width:72px;color:hsl(var(--muted-foreground))">'+o[1]+'</span>'+
      '<div style="flex:1;height:6px;border-radius:3px;background:hsl(var(--secondary));overflow:hidden">'+
      '<div class="hp-usage-pop-fill '+color+'" style="height:100%;width:'+pct+'%"></div></div>'+
      '<span style="font-size:0.625rem;width:24px;text-align:right;color:hsl(var(--foreground))">'+n+'</span></div>';
  });
  html += '</div>';
  return html;
}

function loadFailovers(){
  api('GET','/api/providers/failovers?limit=20').then(function(d){
    var rows = d.failovers || [];
    var body = document.getElementById('failoverBody');
    if(!body) return;
    if(rows.length === 0){
      body.innerHTML = '<tr><td colspan="6" class="empty">No failovers recorded yet.</td></tr>';
      return;
    }
    var html = '';
    rows.forEach(function(f){
      var reason = f.reason || '—';
      if(reason.length > 40) reason = reason.slice(0,37)+'…';
      var msg = f.error_message || '—';
      if(msg.length > 80) msg = msg.slice(0,77)+'…';
      html += '<tr>'+
        '<td class="mono" style="font-size:0.6875rem">'+esc(f.timestamp||'—')+'</td>'+
        '<td>'+esc(f.profile||'—')+'</td>'+
        '<td><span class="badge badge-error" style="font-size:0.625rem">'+esc(f.from_provider||'—')+'</span></td>'+
        '<td><span class="badge badge-success" style="font-size:0.625rem">'+esc(f.to_provider||'—')+'</span></td>'+
        '<td class="mono" style="font-size:0.6875rem">'+esc(reason)+'</td>'+
        '<td class="mono" style="font-size:0.6875rem;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(f.error_message||'')+'">'+esc(msg)+'</td>'+
        '</tr>';
    });
    body.innerHTML = html;
  });
}

// ── Profile-grouped provider health (lcp-stack pattern, like Keys page) ────
var PROV_COLS = '<colgroup><col style="width:16%"><col style="width:10%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:7%"><col style="width:17%"><col style="width:14%"></colgroup>';
var PROV_HDR = '<tr class="lcp-stack-header"><th>Provider</th><th>Status</th><th>Uptime 24h</th><th>Uptime 7d</th><th>Uptime 30d</th><th style="text-align:center">Failures</th><th>Last Error</th><th></th></tr>';

function provBadge(st){
  var cls = st === 'healthy' ? 'badge-success' : st === 'degraded' ? 'badge-warning' : 'badge-error';
  return '<span class="badge '+cls+'">'+esc(st)+'</span>';
}

function provSelect(prov, prof, st){
  var p = prov.replace(/'/g,"\\'"), f = prof.replace(/'/g,"\\'");
  var html = '<select class="btn-sm prov-override" onclick="event.stopPropagation()" onchange="if(this.value){toggleProviderState(\''+p+'\',\''+f+'\',this.value);this.value=\'\'}" style="width:100%;max-width:118px;min-width:0;padding:0.2rem 0.25rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.6875rem;cursor:pointer;text-overflow:ellipsis" title="Circuit breaker override">';
  html += '<option value="">Override…</option>';
  html += '<option value="degrade">Degrade</option>';
  html += '<option value="kill">Kill</option>';
  if(st !== 'healthy'){ html += '<option value="resume">Resume</option>'; }
  html += '</select>';
  return html;
}

function provMidCells(h){
  var reason = h.last_failure_reason || '—';
  if(reason.length > 70) reason = reason.slice(0,67)+'…';
  return '<td>'+provBadge(h.status)+'</td>'+
    '<td>'+uptimeBar(h.uptime_24h)+'</td>'+
    '<td>'+uptimeBar(h.uptime_7d)+'</td>'+
    '<td>'+uptimeBar(h.uptime_30d)+'</td>'+
    '<td style="text-align:center">'+h.failures+'</td>'+
    '<td class="mono" style="font-size:0.6875rem;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(h.last_failure_reason||'')+'">'+esc(reason)+'</td>';
}

function provDetailRow(h, dsid, show){
  var html = '<tr class="hdet" id="hdet-'+dsid+'" data-id="'+dsid+'" style="display:'+(show?'table-row':'none')+'"><td colspan="8" style="padding:0">';
  html += '<div style="background:hsl(var(--secondary)/0.15);border-top:1px solid hsl(var(--card-border));border-bottom:1px solid hsl(var(--card-border));padding:0.75rem 1rem;font-size:0.75rem">';
  html += '<div style="font-weight:600;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em;color:hsl(var(--muted-foreground));margin-bottom:0.25rem">Last Error</div>';
  html += '<pre style="white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.6875rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);padding:0.5rem;margin:0 0 0.75rem;max-height:120px;overflow:auto">'+esc(h.last_failure_reason||'—')+'</pre>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.75rem">';
  html += '<div><div style="font-size:0.6rem;color:hsl(var(--muted-foreground));text-transform:uppercase;margin-bottom:0.25rem">Failure Breakdown (24h)</div>'+failureBars(h.failures_24h||{})+'</div>';
  html += '<div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem">';
  html += '<div><div style="font-size:0.6rem;color:hsl(var(--muted-foreground));text-transform:uppercase;margin-bottom:0.125rem">Status</div><div>'+esc(h.status)+'</div></div>';
  html += '<div><div style="font-size:0.6rem;color:hsl(var(--muted-foreground));text-transform:uppercase;margin-bottom:0.125rem">Failures</div><div>'+h.failures+'</div></div>';
  html += '<div><div style="font-size:0.6rem;color:hsl(var(--muted-foreground));text-transform:uppercase;margin-bottom:0.125rem">Last Failure</div><div class="mono" style="font-size:0.625rem">'+esc(h.last_failure||'—')+'</div></div>';
  html += '<div><div style="font-size:0.6rem;color:hsl(var(--muted-foreground));text-transform:uppercase;margin-bottom:0.125rem">Last Success</div><div class="mono" style="font-size:0.625rem">'+esc(h.last_success||'—')+'</div></div>';
  html += '<div><div style="font-size:0.6rem;color:hsl(var(--muted-foreground));text-transform:uppercase;margin-bottom:0.125rem">Base URL</div><div class="mono" style="word-break:break-all;font-size:0.625rem">'+esc(h.base_url||'—')+'</div></div>';
  html += '<div><div style="font-size:0.6rem;color:hsl(var(--muted-foreground));text-transform:uppercase;margin-bottom:0.125rem">Cooldown Until</div><div class="mono" style="font-size:0.625rem">'+esc(h.tripped_until||'—')+'</div></div>';
  html += '</div></div>';
  html += '</div>';
  html += '</div></td></tr>';
  return html;
}

// Latest active provider for a profile's collapsed row: healthiest first,
// then most-recently-active as the tiebreaker.
function pickActiveProv(entries){
  var rank = {healthy:0, degraded:1, dead:2};
  return entries.slice().sort(function(a,b){
    var ra = rank[a.h.status]!=null?rank[a.h.status]:3, rb = rank[b.h.status]!=null?rank[b.h.status]:3;
    if(ra !== rb) return ra - rb;
    var ta = a.h.last_success || a.h.last_failure || '';
    var tb = b.h.last_success || b.h.last_failure || '';
    return tb > ta ? 1 : -1;
  })[0];
}

function loadProviderHealth(){
  api('GET','/api/providers/health').then(function(d){
    var ps = d.providers || {};
    var sum = d.summary || {};
    var keys = Object.keys(ps).sort();
    var html = '';
    if (keys.length === 0) {
      html = '<div class="empty">No provider health data yet — send a request to populate.</div>';
    } else {
      // Group by profile.
      var groups = {};
      keys.forEach(function(k){
        var parts = k.split('/');
        var prov = parts[0], prof = parts.slice(1).join('/') || prov;
        if(!groups[prof]) groups[prof] = [];
        groups[prof].push({prov:prov, prof:prof, h:ps[k]});
      });
      Object.keys(groups).sort().forEach(function(prof){
        var entries = groups[prof];
        var act = pickActiveProv(entries);
        var sid = 'ph-' + prof.replace(/[^a-zA-Z0-9]/g, '_');
        var open = !!_provOpen[sid];
        var ah = act.h;

        html += '<table class="lcp-stack">'+PROV_COLS+'<thead>'+PROV_HDR+'</thead>';
        html += '<tbody class="key-stack'+(open?' expanded':'')+'" id="'+sid+'" aria-expanded="'+open+'">';

        // Collapsed trigger row = the profile's latest active provider.
        html += '<tr class="lcp-stack-trigger" onclick="toggleProvProfile(\''+sid+'\')" title="Click to '+(open?'collapse':'expand')+' '+esc(prof)+' providers">';
        html += '<td><b>'+esc(prof)+'</b> <span style="font-size:0.625rem;color:hsl(var(--muted-foreground))">'+esc(act.prov)+'</span> <span class="lcp-stack-count">'+entries.length+'</span> <span class="lcp-stack-chevron">▾</span></td>';
        html += provMidCells(ah);
        html += '<td></td>';
        html += '</tr>';

        // Expanded body: one row (+ optional detail) per provider.
        entries.forEach(function(e){
          var h = e.h;
          var dsid = ('h' + e.prov + '-' + e.prof).replace(/[^a-zA-Z0-9]/g, '_');
          var detOpen = open && !!_hdetOpen[dsid];
          var manual = h.manual_override ? ' <span style="font-size:0.5625rem;color:hsl(var(--amber-fg));text-transform:uppercase">manual</span>' : '';
          html += '<tr class="lcp-stack-body health-trigger" style="cursor:pointer" onclick="toggleHealthDetail(\''+dsid+'\')" title="Click to expand details">';
          html += '<td><b>'+esc(e.prov)+'</b>'+manual+' <span class="lcp-stack-chevron" id="hchev-'+dsid+'">'+(detOpen?'▴':'▾')+'</span></td>';
          html += provMidCells(h);
          html += '<td style="white-space:nowrap">'+provSelect(e.prov, e.prof, h.status)+'</td>';
          html += '</tr>';
          html += provDetailRow(h, dsid, detOpen);
        });

        html += '</tbody></table>';
      });
    }
    document.getElementById('providerHealthBody').innerHTML = html;
    if(document.getElementById('healthSummary')) document.getElementById('healthSummary').textContent = '';
    document.getElementById('hcHealthy').textContent = sum.healthy != null ? sum.healthy : 0;
    document.getElementById('hcDegraded').textContent = sum.degraded != null ? sum.degraded : 0;
    document.getElementById('hcDead').textContent = sum.dead != null ? sum.dead : 0;
    document.getElementById('hcTotal').textContent = sum.total != null ? sum.total : keys.length;
  });
}

loadPresets();
loadProviderHealth();
loadFailovers();
setInterval(loadProviderHealth, 10000);
setInterval(loadFailovers, 15000);

// ── Routing tab ────────────────────────────────────────────────────────────
const escC = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

var ROUTING = { enabled: false, policy: 'eager', min_score: 0, rules: [], per_task: {}, recent_decisions: [], per_profile: {}, profiles: [] };

function routingScope() {
  const sel = document.getElementById('routingProfile');
  return sel ? sel.value.trim() : '';
}

// Populate the scope dropdown from the global status (called once after the
// first global loadRouting resolves).
function renderRoutingScope() {
  const sel = document.getElementById('routingProfile');
  if (!sel || sel.dataset.built) return;
  const profs = ROUTING.profiles || [];
  const cur = sel.value;
  sel.innerHTML = '<option value="">All profiles (global)</option>' +
    profs.map(function (p) { return '<option value="' + escC(p) + '">' + escC(p) + '</option>'; }).join('');
  if (cur) sel.value = cur;
  sel.dataset.built = '1';
}

function routingScopeChanged() {
  // Reload the editor for the new scope (global or per-profile).
  const sel = document.getElementById('routingProfile');
  const prof = sel ? sel.value.trim() : '';
  const clearBtn = document.getElementById('routingClearOverride');
  if (clearBtn) clearBtn.style.display = prof && ROUTING.per_profile && ROUTING.per_profile[prof] && ROUTING.per_profile[prof].has_override ? '' : 'none';
  loadRouting(prof);
}

async function clearRoutingOverride() {
  const prof = routingScope();
  if (!prof) return;
  if (!confirm('Remove the per-profile routing override for "' + prof + '"? It will fall back to the global settings.')) return;
  const d = await api('POST', '/api/routing/policy', { profile: prof, clear_profile: true });
  if (d.error) { document.getElementById('routingError').textContent = d.error; return; }
  document.getElementById('routingClearOverride').style.display = 'none';
  await loadRouting('');
}

async function disableAllRouting() {
  if (!confirm('Disable dynamic routing globally AND for every profile? This clears all per-profile overrides.')) return;
  const err = document.getElementById('routingError');
  const status = document.getElementById('routingStatus');
  err.textContent = '';
  // 1. Disable the global toggle.
  const g = await api('POST', '/api/routing/policy', { enabled: false });
  if (g.error) { err.textContent = g.error; return; }
  // 2. Clear every profile's override so none stays enabled.
  const profs = ROUTING.profiles || [];
  for (const p of profs) {
    const d = await api('POST', '/api/routing/policy', { profile: p, clear_profile: true });
    if (d.error) { err.textContent = d.error; return; }
  }
  status.textContent = 'Dynamic routing disabled globally and for all profiles.';
  await loadRouting('');
}

async function loadRouting(profile) {
  try {
    const scope = (profile !== undefined) ? profile : routingScope();
    const url = scope ? '/api/routing/status?profile=' + encodeURIComponent(scope) : '/api/routing/status';
    const d = await api('GET', url);
    if (!scope) {
      ROUTING = d;
      renderRoutingScope();
      // Restore the previously selected scope after the global refresh.
      const sel = document.getElementById('routingProfile');
      const cur = sel ? sel.value.trim() : '';
      if (cur && d.per_profile && d.per_profile[cur]) {
        d.enabled = d.per_profile[cur].enabled;
        d.policy = d.per_profile[cur].policy;
        d.min_score = d.per_profile[cur].min_score;
        d.rules = d.per_profile[cur].rules;
        ROUTING = d;
      }
    } else {
      ROUTING = Object.assign({}, ROUTING, d);
    }
    const badge = document.getElementById('routingStatusBadge');
    badge.textContent = d.enabled ? 'enabled' : 'disabled';
    badge.className = 'badge ' + (d.enabled ? 'badge-success' : 'badge-error');
    document.getElementById('routingEnabled').checked = !!d.enabled;
    updateRoutingToggleLabel(d.enabled);
    document.getElementById('routingPolicy').value = d.policy;
    document.getElementById('routingMinScore').value = d.min_score;
    const clearBtn = document.getElementById('routingClearOverride');
    if (clearBtn) {
      const prof = routingScope();
      const hasOv = prof && d.per_profile && d.per_profile[prof] && d.per_profile[prof].has_override;
      clearBtn.style.display = hasOv ? '' : 'none';
    }
    renderRoutingTasks();
    renderRoutingDecisions();
    renderRoutingRules();
  } catch (e) {
    document.getElementById('routingStatus').textContent = 'Failed to load routing: ' + e.message;
  }
}

function updateRoutingToggleLabel(enabled) {
  document.getElementById('routingEnabledLabel').textContent =
    enabled ? 'ON · route by capability' : 'OFF · static chain';
}

async function toggleRouting(el) {
  const err = document.getElementById('routingError');
  const status = document.getElementById('routingStatus');
  err.textContent = '';
  const body = { enabled: el.checked };
  const prof = routingScope();
  if (prof) body.profile = prof;
  const d = await api('POST', '/api/routing/policy', body);
  if (d.error) {
    err.textContent = d.error;
    el.checked = !el.checked;
    updateRoutingToggleLabel(!el.checked);
    loadRouting();
    return;
  }
  updateRoutingToggleLabel(d.enabled);
  status.textContent = d.enabled
    ? 'Dynamic routing enabled — applies to new requests immediately.'
    : 'Dynamic routing disabled — requests use the static chain order.';
  loadRouting();
}

function renderRoutingTasks() {
  const rows = document.getElementById('routingTaskRows');
  const tasks = Object.entries(ROUTING.per_task || {});
  if (!tasks.length) {
    rows.innerHTML = '<tr><td colspan="3" class="empty">No benchmark scores yet — seed the capability matrix to see recommendations.</td></tr>';
    return;
  }
  rows.innerHTML = tasks.map(([task, t]) =>
    '<tr><td class="mono">' + escC(task) + '</td>' +
    '<td class="mono">' + escC(t.model) + '</td>' +
    '<td class="mono">' + (t.score * 100).toFixed(1) + '%</td></tr>'
  ).join('');
}

function renderRoutingDecisions() {
  const rows = document.getElementById('routingDecRows');
  const decs = ROUTING.recent_decisions || [];
  if (!decs.length) {
    rows.innerHTML = '<tr><td colspan="8" class="empty">No decisions yet — routing only logs decisions once requests flow through.</td></tr>';
    return;
  }
  rows.innerHTML = decs.slice().reverse().map(d =>
    '<tr>' +
    '<td class="mono">' + String(d.ts || '').replace('T', ' ').slice(5, 19) + '</td>' +
    '<td class="mono">' + escC(d.profile || '—') + '</td>' +
    '<td class="mono">' + escC(d.task || '—') + '</td>' +
    '<td class="mono">' + escC(d.policy || '—') + '</td>' +
    '<td>' + escC(d.action || '—') + '</td>' +
    '<td class="mono">' + escC((d.provider || '') + '/' + (d.model || '')) + '</td>' +
    '<td class="mono">' + (d.score != null ? (d.score * 100).toFixed(1) + '%' : '—') + '</td>' +
    '<td class="mono">' + escC((d.rules || []).join(', ') || '—') + '</td>' +
    '</tr>'
  ).join('');
}

// ── Rules ────────────────────────────────────────────────────────────────
var PROV_MODELS = {};  // provider -> [models] for rule dropdowns

async function loadProvModels() {
  try {
    const d = await api('GET', '/api/providers');
    for (const [name, p] of Object.entries(d.providers || {})) {
      PROV_MODELS[name] = (p.models || []).slice();
    }
  } catch (e) { /* dropdowns fall back to '*' */ }
}

function ruleOptionsHtml(options, cur) {
  return options.map(o =>
    '<option value="' + escC(o.value) + '"' + (String(o.value) === String(cur) ? ' selected' : '') + '>' +
    escC(o.label) + '</option>'
  ).join('');
}

function ruleSelect(name, options, cur, onchange) {
  const oc = onchange ? ' onchange="' + onchange + '"' : '';
  return '<select class="rule-' + name + '"' + oc +
    ' style="padding:0.25rem 0.4rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.72rem;max-width:170px">' +
    ruleOptionsHtml(options, cur) + '</select>';
}

function ruleTaskOptions(cur) {
  const tasks = Object.keys(ROUTING.per_task || {});
  return [{value:'*', label:'*'}, ...tasks.map(t => ({value:t, label:t}))];
}

function ruleProfileOptions(cur) {
  const profs = ROUTING.profiles || [];
  const opts = [{value:'*', label:'*'}, ...profs.map(p => ({value:p, label:p}))];
  if (cur && cur !== '*' && !profs.includes(cur)) opts.push({value: cur, label: cur});
  return opts;
}

function ruleProviderOptions(cur) {
  const names = Object.keys(PROV_MODELS);
  const opts = [{value:'*', label:'*'}, ...names.map(n => ({value:n, label:n}))];
  if (cur && cur !== '*' && !names.includes(cur)) opts.push({value: cur, label: cur});
  return opts;
}

function ruleModelOptions(provider, cur) {
  // When a specific provider is selected, list only its models. When provider
  // is '*' (or empty), list ALL models across providers (deduped) so a rule can
  // target a model regardless of which provider serves it.
  let models = [];
  if (provider && provider !== '*' && PROV_MODELS[provider]) {
    models = PROV_MODELS[provider].slice();
  } else {
    const seen = {};
    Object.keys(PROV_MODELS).forEach(function(p) {
      (PROV_MODELS[p] || []).forEach(function(m) { if (!seen[m]) { seen[m] = 1; models.push(m); } });
    });
    models.sort();
  }
  const opts = [{value:'*', label:'*'}, ...models.map(m => ({value:m, label:m}))];
  if (cur && cur !== '*' && !models.includes(cur)) opts.push({value: cur, label: cur});
  return opts;
}

function syncRuleModelSelect(sel) {
  // Provider changed → repopulate the same row's model dropdown.
  const tr = sel.closest('tr');
  const modelSel = tr.querySelector('.rule-model');
  if (!modelSel) return;
  const cur = modelSel.value;
  modelSel.innerHTML = ruleOptionsHtml(ruleModelOptions(sel.value, cur), cur);
}

function renderRoutingRules() {
  const rows = document.getElementById('routingRulesRows');
  // Preserve an in-progress draft row across the 15s auto-refresh re-render.
  // NOTE: outerHTML loses live <select> values (it only keeps the default
  // 'selected' attributes), so we read the current values and rebuild.
  const draft = rows.querySelector('tr.rule-draft');
  const draftRule = draft ? _readRuleRow(draft) : null;
  const rules = ROUTING.rules || [];
  if (!rules.length && !draftRule) {
    rows.innerHTML = '<tr><td colspan="7" class="empty">No rules — routing uses policy + benchmark scores only.</td></tr>';
    return;
  }
  rows.innerHTML = rules.map((r, i) =>
    '<tr>' +
    '<td>' + ruleSelect('task', ruleTaskOptions(r.task), r.task) + '</td>' +
    '<td>' + ruleSelect('profile', ruleProfileOptions(r.profile), r.profile) + '</td>' +
    '<td>' + ruleSelect('action', [{value:'prefer', label:'prefer'}, {value:'block', label:'block'}, {value:'policy', label:'policy'}], r.action) + '</td>' +
    '<td>' + ruleSelect('provider', ruleProviderOptions(r.provider), r.provider, 'syncRuleModelSelect(this)') + '</td>' +
    '<td>' + ruleSelect('model', ruleModelOptions(r.provider, r.model), r.model) + '</td>' +
    '<td><input class="rule-min" type="number" min="0" max="1" step="0.05" value="' + escC(r.min_score != null ? r.min_score : '') + '" placeholder="—" style="width:52px;padding:0.25rem 0.4rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.72rem"></td>' +
    '<td style="white-space:nowrap">' +
      '<button class="btn btn-outline btn-sm" onclick="saveRulesRow(' + i + ')">Save</button> ' +
      '<button class="btn btn-outline btn-sm" onclick="deleteRule(' + i + ')">✕</button>' +
    '</td></tr>'
  ).join('');
  if (draftRule) rows.insertAdjacentHTML('beforeend', ruleDraftHtml(draftRule));
}

function ruleDraftHtml(rule) {
  rule = rule || {};
  return '<tr class="rule-draft">' +
    '<td>' + ruleSelect('task', ruleTaskOptions(rule.task || '*'), rule.task || '*') + '</td>' +
    '<td>' + ruleSelect('profile', ruleProfileOptions(rule.profile || '*'), rule.profile || '*') + '</td>' +
    '<td>' + ruleSelect('action', [{value:'prefer', label:'prefer'}, {value:'block', label:'block'}, {value:'policy', label:'policy'}], rule.action || 'prefer') + '</td>' +
    '<td>' + ruleSelect('provider', ruleProviderOptions(rule.provider || '*'), rule.provider || '*', 'syncRuleModelSelect(this)') + '</td>' +
    '<td>' + ruleSelect('model', ruleModelOptions(rule.provider || '*', rule.model || '*'), rule.model || '*') + '</td>' +
    '<td><input class="rule-min" type="number" min="0" max="1" step="0.05" value="' + escC(rule.min_score != null ? rule.min_score : '') + '" placeholder="—" style="width:52px;padding:0.25rem 0.4rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.72rem"></td>' +
    '<td><button class="btn btn-primary btn-sm" onclick="saveNewRule(this)">Add</button></td>' +
    '</tr>';
}

function addRuleRow() {
  const rows = document.getElementById('routingRulesRows');
  if (rows.querySelector('.empty')) rows.innerHTML = '';
  rows.insertAdjacentHTML('beforeend', ruleDraftHtml({}));
}

function _readRuleRow(tr) {
  const get = (sel) => { const el = tr.querySelector(sel); return el ? el.value.trim() : ''; };
  const min = tr.querySelector('.rule-min') ? tr.querySelector('.rule-min').value : '';
  const rule = {
    task: get('.rule-task'), profile: get('.rule-profile'), action: get('.rule-action'),
    provider: get('.rule-provider'), model: get('.rule-model'),
  };
  if (min !== '') rule.min_score = parseFloat(min);
  return rule;
}

async function saveRulesRow(i) {
  const tr = document.querySelectorAll('#routingRulesRows tr')[i];
  if (!tr) return;
  ROUTING.rules[i] = _readRuleRow(tr);
  await persistRules();
}

async function saveNewRule(btn) {
  const tr = btn.closest('tr');
  const rule = _readRuleRow(tr);
  ROUTING.rules.push(rule);
  tr.remove();
  await persistRules();
}

async function deleteRule(i) {
  ROUTING.rules.splice(i, 1);
  await persistRules();
}

async function persistRules() {
  const err = document.getElementById('routingError');
  const status = document.getElementById('routingStatus');
  err.textContent = '';
  const body = { rules: ROUTING.rules };
  const prof = routingScope();
  if (prof) body.profile = prof;
  const d = await api('POST', '/api/routing/rules', body);
  if (d.error) { err.textContent = d.error; loadRouting(); return; }
  status.textContent = 'Rules saved — apply immediately to new requests.';
  loadRouting();
}

async function saveRouting() {
  const err = document.getElementById('routingError');
  const status = document.getElementById('routingStatus');
  err.textContent = '';
  const body = { policy: document.getElementById('routingPolicy').value };
  body.enabled = document.getElementById('routingEnabled').checked;
  const prof = routingScope();
  if (prof) body.profile = prof;
  const ms = parseFloat(document.getElementById('routingMinScore').value);
  if (!isNaN(ms)) body.min_score = ms;
  const d = await api('POST', '/api/routing/policy', body);
  if (d.error) { err.textContent = d.error; return; }
  status.textContent = 'Saved — policy applies to new requests immediately.';
  loadRouting();
}

loadRouting();
loadProvModels();
setInterval(function () { loadRouting(); }, 15000);
applyHashTab();
