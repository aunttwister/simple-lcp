{% if view.sources %}
<script>
(function () {
  const form = document.getElementById('sources-form');
  const hint = document.getElementById('sources-hint');
  const F = (id) => document.getElementById(id);

  function collectSources() {
    const payload = {
      version: 1,
      hermes_profiles_dir: F('sf-profiles-dir').value.trim(),
      tasks_root: F('sf-tasks-root').value.trim(),
      ops_dir: F('sf-ops-dir').value.trim(),
      profiles: {}
    };
    form.querySelectorAll('.sf-input').forEach((inp) => {
      const p = inp.dataset.profile;
      if (!payload.profiles[p]) payload.profiles[p] = {};
      const v = inp.value.trim();
      if (v) payload.profiles[p][inp.dataset.field] = v;
    });
    form.querySelectorAll('.sf-check').forEach((cb) => {
      const p = cb.dataset.profile;
      if (!payload.profiles[p]) payload.profiles[p] = {};
      payload.profiles[p][cb.dataset.field] = cb.checked;
    });
    return payload;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    fetch('/api/work/sources', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(collectSources())
    }).then((r) => r.json().then((d) => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        hint.textContent = ok ? 'Saved — collector/executor pick it up on their next tick.'
                              : 'Rejected: ' + (d.error || 'unknown');
        hint.className = ok ? 'work-chip work-chip-ok' : 'work-warn';
      })
      .catch(() => { hint.textContent = 'Network error'; hint.className = 'work-warn'; });
  });

  F('sources-reset').addEventListener('click', () => {
    fetch('/api/work/sources')
      .then((r) => r.json())
      .then((d) => {
        if (!d || d.error) { hint.textContent = 'No configured file to reset from'; return; }
        F('sf-profiles-dir').value = d.hermes_profiles_dir;
        F('sf-tasks-root').value = d.tasks_root;
        F('sf-ops-dir').value = d.ops_dir;
      });
  });
})();
</script>
{% endif %}
{% endif %}
