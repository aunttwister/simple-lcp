{#- generated by the M2 merge — section: sec_cron_script
    Do not edit the block boundaries: this partial is included by a merged page
    (profiles) inside a tab guard for the tab 'cron'. -#}

{% if tab == 'cron' %}
{% if view.available %}
<script>
(function () {
  const modal = document.getElementById('cron-modal');
  const hint = document.getElementById('cron-op-hint');
  const note = document.getElementById('cf-note');
  const form = document.getElementById('cron-form');
  const F = (id) => document.getElementById(id);

  function setHint(msg, cls) {
    hint.textContent = msg;
    hint.className = cls || 'muted';
  }

  function openModal(title, noteText) {
    F('cron-modal-title').textContent = title;
    note.textContent = noteText || '';
    modal.hidden = false;
    F('cf-prompt').focus && F('cf-prompt').focus();
  }
  function closeModal() { modal.hidden = true; }

  F('cron-new-btn').addEventListener('click', () => {
    form.reset();
    F('cf-action').value = 'create';
    F('cf-job-id').value = '';
    F('cf-deliver').value = 'origin';
    openModal('New job', 'New jobs take effect immediately after the executor applies them (within ~1 min).');
  });
  F('cron-modal-close').addEventListener('click', closeModal);
  F('cron-form-cancel').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  let editNoAgentBase = false;
  document.querySelectorAll('.cron-act').forEach((btn) => {
    btn.addEventListener('click', () => {
      const tr = btn.closest('tr');
      const profile = tr.closest('table').dataset.profile;
      const jobId = tr.dataset.jobId;
      const act = btn.dataset.act;
      if (act === 'edit') {
        const cells = tr.querySelectorAll('td');
        form.reset();
        F('cf-action').value = 'edit';
        F('cf-job-id').value = jobId;
        F('cf-profile').value = profile;
        F('cf-name').value = tr.querySelector('.work-job-name').textContent.trim();
        F('cf-schedule').value = tr.querySelectorAll('td')[2].textContent.trim().split(' ')[0];
        const detail = tr.querySelectorAll('td')[7];
        const wasNoAgent = detail.textContent.includes('no-agent');
        F('cf-no-agent').checked = wasNoAgent;
        editNoAgentBase = wasNoAgent;
        openModal('Edit ' + jobId, 'Blank fields are left unchanged. Prompt/script are not shown back (snapshot does not store them).');
        return;
      }
      if (act === 'remove' && !window.confirm('Delete job ' + jobId + ' from ' + profile + '?')) return;
      if (act === 'run' && !window.confirm('Queue "run now" for ' + jobId + '?')) return;
      queue({action: act, profile: profile, job_id: jobId});
    });
  });

  function queue(payload) {
    fetch('/api/work/cron/ops', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    }).then((r) => r.json().then((d) => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        if (ok) setHint('Queued op ' + d.id + ' (' + d.action + ') — executor applies within ~1 min. Refresh to see the change.');
        else setHint('Rejected: ' + (d.error || 'unknown'), 'work-warn');
      })
      .catch(() => setHint('Network error queueing op', 'work-warn'));
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const action = F('cf-action').value;
    const payload = {action: action, profile: F('cf-profile').value};
    if (action === 'create') {
      payload.name = F('cf-name').value.trim();
      payload.schedule = F('cf-schedule').value.trim();
      payload.prompt = F('cf-prompt').value.trim();
      payload.script = F('cf-script').value.trim();
      payload.deliver = F('cf-deliver').value;
      if (F('cf-repeat').value) payload.repeat = parseInt(F('cf-repeat').value, 10);
      if (F('cf-skill').value.trim()) payload.skill = F('cf-skill').value.trim();
      if (F('cf-workdir').value.trim()) payload.workdir = F('cf-workdir').value.trim();
      payload.no_agent = F('cf-no-agent').checked;
    } else if (action === 'edit') {
      payload.job_id = F('cf-job-id').value;
      const fields = {};
      if (F('cf-name').value.trim()) fields.name = F('cf-name').value.trim();
      if (F('cf-schedule').value.trim()) fields.schedule = F('cf-schedule').value.trim();
      if (F('cf-prompt').value.trim()) fields.prompt = F('cf-prompt').value.trim();
      if (F('cf-script').value.trim()) fields.script = F('cf-script').value.trim();
      if (F('cf-deliver').value) fields.deliver = F('cf-deliver').value;
      if (F('cf-no-agent').checked !== editNoAgentBase) fields.no_agent = F('cf-no-agent').checked;
      payload.fields = fields;
      if (Object.keys(fields).length === 0) { setHint('Edit needs at least one field', 'work-warn'); return; }
    }
    queue(payload);
    closeModal();
  });

  // ── Work sources form moved to /work/config (Work Configuration page) ──
})();
</script>
{% endif %}
{% endif %}
