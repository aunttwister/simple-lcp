{#- generated by the M2 merge — section: sec_keys_script
    Do not edit the block boundaries: this partial is included by a merged page
    (profiles) inside a tab guard for the tab 'keys'. -#}

{% if tab == 'keys' %}
<script>
{% raw %}
var COLS = '<colgroup><col style="width:11%"><col style="width:19%"><col style="width:8%"><col style="width:11%"><col style="width:8%"><col style="width:9%"><col style="width:11%"><col style="width:23%"></colgroup>';
var HDR = '<tr class="lcp-stack-header"><th>Name</th><th>Prefix</th><th>Profiles</th><th style="text-align:center">Budget</th><th style="text-align:right">Limit</th><th>Status</th><th>Date</th><th>Actions</th></tr>';

function loadKeys(){api('GET','/api/keys').then(function(d){
var keys=d.keys||[],groups={};
keys.forEach(function(k){var nm=k.name||'unnamed';if(!groups[nm])groups[nm]={active:null,revoked:[]};if(k.status==='active')groups[nm].active=k;else groups[nm].revoked.push(k)});
Object.values(groups).forEach(function(g){g.revoked.sort(function(a,b){return (b.revoked_at||'')>(a.revoked_at||'')?1:-1})});
var html='<table class="lcp-stack" id="keyTable">'+COLS+'<thead>'+HDR+'</thead>';
Object.keys(groups).sort().forEach(function(name){
var g=groups[name],count=g.revoked.length,sid='sk-'+name.replace(/[^a-zA-Z0-9]/g,'_');
html+='<tbody class="key-stack" id="'+sid+'" aria-expanded="false" data-search="'+esc(name)+'">';
html+='<tr class="lcp-stack-trigger" onclick="toggleStack(\''+sid+'\')">';
html+='<td><b>'+esc(name)+'</b> <span class="lcp-stack-count">'+count+'</span> <span class="lcp-stack-chevron">▾</span></td>';
if(g.active){
html+='<td class="mono" style="font-size:0.75rem">'+esc(g.active.key_prefix)+'</td>';
html+='<td style="font-size:0.75rem">'+(g.active.allowed_profiles||'all')+'</td>';
html+='<td class="mono lcp-col-center" style="font-size:0.75rem">$'+(g.active.total_spend||0).toFixed(4)+'</td>';
html+='<td class="cost mono" style="font-size:0.75rem">'+(g.active.spend_limit>0?'$'+g.active.spend_limit.toFixed(2):'∞')+'</td>';
html+='<td><span class="badge badge-success">active</span></td>';
html+='<td class="mono" style="font-size:0.6875rem">'+(g.active.created_at||'').slice(0,10)+'</td>';
html+='<td style="white-space:nowrap">';
html+='<button class="btn-sm" onclick="event.stopPropagation();rotateKey('+g.active.id+')" title="Rotate">↻</button>';
html+='<button class="btn-sm btn-danger" style="margin-left:0.125rem" onclick="event.stopPropagation();revokeKey('+g.active.id+')" title="Revoke">✕</button>';
html+='</td>';
}else{
html+='<td colspan="4"></td><td><span class="badge badge-error">all revoked</span></td><td></td><td></td>';
}
html+='</tr>';
if(count>0){
g.revoked.forEach(function(rk){
html+='<tr class="lcp-stack-body">';
html+='<td></td>';
html+='<td class="mono" style="font-size:0.75rem">'+esc(rk.key_prefix)+'</td>';
html+='<td style="font-size:0.75rem">'+(rk.allowed_profiles||'all')+'</td>';
html+='<td class="mono lcp-col-center">$'+(rk.total_spend||0).toFixed(4)+'</td>';
html+='<td class="cost mono">'+(rk.spend_limit>0?'$'+rk.spend_limit.toFixed(2):'∞')+'</td>';
html+='<td><span class="badge badge-error">revoked</span></td>';
html+='<td class="mono" style="font-size:0.6875rem">'+(rk.revoked_at||'').slice(0,10)+'</td>';
html+='<td></td>';
html+='</tr>';
});
}
html+='</tbody>';
});
html+='</table>';
document.getElementById('keyStacks').innerHTML=html||'<div class="empty">No keys yet.</div>';
})}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function showCreateKeyModal(){openDialog('createKeyModal');_selectedProfiles=[];loadProfilesForKeys()}
function closeCreateKeyModal(){closeDialog('createKeyModal');_selectedProfiles=[]}
function closeShowKeyModal(){closeDialog('showKeyModal')}
function loadProfilesForKeys(){api('GET','/api/profiles').then(function(d){var profiles=Object.keys(d.profiles||{}),html='';profiles.forEach(function(p){html+='<span class="profile-pill" data-profile="'+p+'" onclick="toggleProfilePill(this)" style="padding:0.25rem 0.625rem;border-radius:9999px;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid hsl(var(--card-border));background:hsl(var(--secondary)/0.3);color:hsl(var(--muted-foreground));transition:all 0.15s;user-select:none">'+p.toUpperCase()+'</span>'});if(!html)html='<span style="font-size:0.6875rem;color:hsl(var(--muted-foreground))">No profiles configured</span>';document.getElementById('newKeyProfilesPills').innerHTML=html})}
var _selectedProfiles=[];
function toggleProfilePill(el){var p=el.getAttribute('data-profile'),idx=_selectedProfiles.indexOf(p);if(idx>=0){_selectedProfiles.splice(idx,1);el.style.background='hsl(var(--secondary)/0.3)';el.style.color='hsl(var(--muted-foreground))';el.style.borderColor='hsl(var(--card-border))'}else{_selectedProfiles.push(p);el.style.background='hsl(var(--primary))';el.style.color='hsl(var(--primary-foreground))';el.style.borderColor='hsl(var(--primary))'}}
function createKey(){var name=document.getElementById('newKeyName').value.trim(),limit=parseFloat(document.getElementById('newKeyLimit').value)||0,expires=document.getElementById('newKeyExpires').value;api('POST','/api/keys',{name:name||'API Key',allowed_profiles:_selectedProfiles.join(','),spend_limit:limit,expires_at:expires?expires+'T00:00:00':''}).then(function(d){if(d.key){document.getElementById('shownKey').textContent=d.key;document.getElementById('shownKeyInfo').innerHTML='Name: <b>'+d.name+'</b> · ID: '+d.id+'<br>Profiles: '+(d.allowed_profiles||'all')+' · Limit: $'+(d.spend_limit||0);closeCreateKeyModal();openDialog('showKeyModal')}else{alert('Error: '+(d.error||'unknown'))}})}
function copyShownKey(){var btn=event.target;navigator.clipboard.writeText(document.getElementById('shownKey').textContent).then(function(){var o=btn.textContent;btn.textContent='Copied!';setTimeout(function(){btn.textContent=o},1500)})}
function rotateKey(id){if(!confirm('Rotate this key?'))return;api('POST','/api/keys/'+id+'/rotate').then(function(d){if(d.key){document.getElementById('shownKey').textContent=d.key;document.getElementById('shownKeyInfo').innerHTML='Rotated from ID: '+d.old_id+' → <b>'+d.id+'</b><br>Name: <b>'+d.name+'</b>';openDialog('showKeyModal')}else{alert('Error: '+(d.error||'unknown'))}})}
function revokeKey(id){if(!confirm('Revoke this key?'))return;api('DELETE','/api/keys/'+id).then(function(d){if(d.ok)loadKeys();else alert('Error: '+(d.error||'unknown'))})}
function filterKeys(){var q=document.getElementById('keySearch').value.toLowerCase();document.querySelectorAll('#keyStacks tbody.key-stack').forEach(function(s){s.style.display=(s.getAttribute('data-search')||'').toLowerCase().includes(q)?'':'none'})}
loadKeys();
{% endraw %}
</script>
{% endif %}
