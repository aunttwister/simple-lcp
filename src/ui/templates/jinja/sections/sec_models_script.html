{% if tab == 'matrix' %}
<script>
const API = {
  async matrix() {
    const r = await fetch('/api/models/capability');
    return r.json();
  },
  async providers() {
    const r = await fetch('/api/providers');
    return r.json();
  },
  async registry() {
    const r = await fetch('/api/models/registry');
    return r.json();
  },
  async upsertRegistry(entry) {
    const r = await fetch('/api/models/registry', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(entry)
    });
    return r.json();
  },
  async deleteRegistry(logical) {
    const r = await fetch('/api/models/registry/' + encodeURIComponent(logical), {method: 'DELETE'});
    return r.json();
  },
  async manualScores(model, scores, release) {
    const r = await fetch('/api/models/capability/manual', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model, scores, release})
    });
    return r.json();
  }
};

// ── State ──────────────────────────────────────────────────────────────────
let STATE = { registry: {}, providers: {}, matrix: {}, selected: null, filter: '', activeModels: new Set(), configuredOnly: false };

// model → list of providers that expose it (from gateway.yaml providers.models)
function providerModels() {
  const map = {};
  for (const [name, cfg] of Object.entries(STATE.providers || {})) {
    for (const m of (cfg.models || [])) {
      const canonical = canonicalName(m);
      (map[canonical] = map[canonical] || []).push(name);
    }
  }
  return map;
}

// Map any spelling (provider-side model ID) to the registry's logical name,
// so deepseek/deepseek-v4-pro and deepseek-v4-pro collapse to ONE entry.
// Unknown names are normalized (strip /models/ + .gguf) like the backend.
function canonicalName(model) {
  if (!model) return model;
  const aliasMap = STATE.aliasMap || {};
  const key = String(model).toLowerCase();
  const mapped = aliasMap[key];
  if (mapped) return mapped;
  return normalizeModelId(key);
}

// Strip /models/ prefix, .gguf extension, and collapse to a clean name.
function normalizeModelId(name) {
  let n = String(name || '').trim();
  if (n.startsWith('/models/')) n = n.slice('/models/'.length);
  else if (n.startsWith('/')) n = n.slice(1);
  if (n.includes('/')) n = n.split('/').pop();
  if (n.toLowerCase().endsWith('.gguf')) n = n.slice(0, -5);
  return n.toLowerCase();
}

function buildAliasMap() {
  const map = {};
  for (const [logical, entry] of Object.entries(STATE.registry || {})) {
    map[logical.toLowerCase()] = logical;
    if (entry.benchmark_key) map[String(entry.benchmark_key).toLowerCase()] = logical;
    for (const m of Object.values(entry.provider_mappings || {})) {
      map[String(m).toLowerCase()] = logical;
      map[normalizeModelId(m)] = logical;
    }
    // Also map the normalized logical name back to itself.
    map[normalizeModelId(logical)] = logical;
  }
  return map;
}

// models registered with at least one provider (from providers.models) —
// the "top/selected" set that gets an enhanced border and sorts first.
function activeModels() {
  return STATE.activeModels;
}

function allModels() {
  const names = new Set(Object.keys(STATE.registry));
  for (const m of Object.keys(providerModels())) names.add(m);
  for (const models of Object.values(STATE.matrix.tasks || {})) {
    for (const m of Object.keys(models)) names.add(canonicalName(m));
  }
  return [...names].sort();
}

async function loadAll() {
  const [matrix, providers, reg] = await Promise.all([
    API.matrix(), API.providers(), API.registry()
  ]);
  STATE.matrix = matrix;
  STATE.providers = providers.providers || {};

  const registryMap = {};
  for (const e of (reg.registry || [])) registryMap[e.logical_name] = e;
  STATE.registry = registryMap;
  STATE.aliasMap = buildAliasMap();

  // Highlighted set = any model registered in a provider's `models` list
  // (includes llama.cpp / providers not wired into a profile chain), plus
  // anything referenced by a profile chain as a safety net. All names are
  // canonicalized through the registry alias map.
  const active = new Set(Object.keys(providerModels()));
  for (const chain of Object.values(providers.profile_chains || {})) {
    for (const step of (chain || [])) {
      if (step && step.model) active.add(canonicalName(step.model));
    }
  }
  STATE.activeModels = active;

  renderModelList();
  if (STATE.selected && allModels().includes(STATE.selected)) {
    renderDetail(STATE.selected);
  } else if (allModels().length) {
    selectModel(allModels()[0]);
  }
}

function bestScore(model) {
  let best = null;
  const canonical = canonicalName(model);
  const reg = STATE.registry[canonical] || {};
  const bkey = reg.benchmark_key || canonical;
  for (const [task, models] of Object.entries(STATE.matrix.tasks || {})) {
    const s = models[bkey] !== undefined ? models[bkey] : models[canonical];
    if (s !== undefined && (best === null || s > best.score)) best = {task, score: s};
  }
  return best ? `${(best.score * 100).toFixed(0)}% ${best.task.replace(/_/g, ' ')}` : null;
}

function renderModelList() {
  const container = document.getElementById('modelList');
  const pmap = providerModels();
  let models = allModels().filter(m => m.toLowerCase().includes(STATE.filter.toLowerCase()));
  const configuredOnly = STATE.configuredOnly;
  if (configuredOnly) {
    models = models.filter(m => activeModels().has(m));
  }
  // Highlighted models first, then alphabetical within each group.
  models = models.sort((a, b) => {
    const ac = activeModels().has(a) ? 0 : 1;
    const bc = activeModels().has(b) ? 0 : 1;
    return ac - bc || a.localeCompare(b);
  });
  if (!models.length) {
    container.innerHTML = '<div class="empty">' + (configuredOnly ? 'No configured models match.' : 'No provider models found.') + '</div>';
    return;
  }
  container.innerHTML = models.map(m => {
    const active = m === STATE.selected ? 'active' : '';
    const configured = activeModels().has(m) ? 'configured' : '';
    const best = bestScore(m);
    const provs = pmap[m] || [];
    return `<div class="model-list-item ${active} ${configured}" data-model="${m}">
      <div class="mli-name" title="${m}">${m}</div>
      <div class="mli-meta">${best ? '<span class="mli-best">' + best + '</span>' : ''}${provs.length ? '<span class="mli-prov">' + provs.join(', ') + '</span>' : ''}</div>
    </div>`;
  }).join('');
  container.querySelectorAll('.model-list-item').forEach(el => {
    el.addEventListener('click', () => selectModel(el.dataset.model));
  });
}

function toggleConfiguredOnly() {
  STATE.configuredOnly = !STATE.configuredOnly;
  const btn = document.getElementById('configuredOnlyBtn');
  if (btn) btn.classList.toggle('active', STATE.configuredOnly);
  renderModelList();
}

function selectModel(model) {
  STATE.selected = model;
  renderModelList();
  renderDetail(model);
}

// LiveBench category → LCP task type (reverse of seed_capabilities.LB_TO_LCP).
// A single LCP task can aggregate several LiveBench categories (reasoning and
// math both feed reasoning_chain), so each expanded group keeps its LiveBench
// category labelled separately, exactly as stated on livebench.ai.
const LCP_TO_LB = {
  reasoning_chain: ['reasoning', 'math'],
  code_generation: ['coding'],
  agentic_multi_step: ['agentic_coding'],
  research_deep: ['data_analysis'],
  casual_chat: ['language'],
  planning: ['instruction_following'],
  debugging: [],
};

function groupLabel(lb) { return lb === '_all' ? 'tasks' : lb.replace(/_/g, ' '); }

// Seeded subtasks are normalized 0–1; locally-run all_tasks.csv rows are 0–100.
function subtaskPct(sc) { return sc > 1 ? sc : sc * 100; }

function subtaskPanelHtml(groups) {
  return `<div class="subtask-expand">
    ${groups.map(g => `
      <div class="subtask-group">
        <div class="subtask-group-head">${groupLabel(g.lb)}</div>
        ${Object.entries(g.tasks).map(([task, sc]) => {
          const pct = subtaskPct(sc);
          return `
          <div class="subtask-row">
            <span class="subtask-name" title="${task.replace(/_/g, ' ')}">${task.replace(/_/g, ' ')}</span>
            <div class="score-track"><div class="score-fill ${pct >= 80 ? 'hi' : pct >= 60 ? 'mid' : 'lo'}" style="width:${Math.min(pct, 100).toFixed(0)}%"></div></div>
            <span class="score-pct">${pct.toFixed(1)}%</span>
          </div>`;
        }).join('')}
      </div>`).join('')}
  </div>`;
}

// LiveBench categories whose subtasks belong to this LCP task type.
function expandGroupsFor(task, breakdown) {
  if (!breakdown) return [];
  const groups = [];
  for (const lb of (LCP_TO_LB[task] || [])) {
    const tasks = breakdown[lb];
    if (tasks && Object.keys(tasks).length) groups.push({lb, tasks});
  }
  const all = breakdown._all;
  if (all && Object.keys(all).length) groups.push({lb: '_all', tasks: all});
  return groups;
}

// Subtask categories not reachable from any score row (e.g. unknown tasks).
function leftoverSubtaskGroups(breakdown, scoreTasks) {
  if (!breakdown) return [];
  const used = new Set();
  for (const t of scoreTasks) for (const g of expandGroupsFor(t, breakdown)) used.add(g.lb);
  const groups = [];
  for (const [lb, tasks] of Object.entries(breakdown)) {
    if (used.has(lb)) continue;
    if (tasks && Object.keys(tasks).length) groups.push({lb, tasks});
  }
  return groups;
}

function renderDetail(model) {
  const detail = document.getElementById('modelDetail');
  const canonical = canonicalName(model);
  const reg = STATE.registry[canonical] || STATE.registry[model];
  const benchmarkKey = reg ? reg.benchmark_key : model;
  const pinnedRelease = reg ? (reg.active_release || '') : '';
  const benchmarkRelease = reg ? (reg.benchmark_release || '') : '';
  const quantization = reg ? (reg.quantization || '') : '';
  // Version actually in effect (resolved server-side: pin → newest).
  // active_releases is keyed by capability model key (= benchmark_key).
  const effectiveRelease = (STATE.matrix.active_releases || {})[benchmarkKey]
    || (STATE.matrix.active_releases || {})[canonical]
    || pinnedRelease || 'latest';
  const providerMappings = reg ? (reg.provider_mappings || {}) : {};
  const providerNames = reg ? (reg.providers || Object.keys(providerMappings)) : [];
  const updatedAt = reg ? (reg.updated_at || '').replace('T', ' ').slice(0, 19) : null;
  const provs = providerModels()[canonical] || [];

  const displayName = quantization && !canonical.toUpperCase().includes(quantization.toUpperCase())
    ? `${canonical}-${quantization.toLowerCase()}`
    : canonical;

  const scores = [];
  for (const [task, models] of Object.entries(STATE.matrix.tasks || {})) {
    // Scores are keyed by benchmark_key in the matrix; fall back to logical.
    const score = models[benchmarkKey] !== undefined ? models[benchmarkKey] : models[canonical];
    if (score !== undefined) {
      scores.push({
        task,
        score,
        source: (STATE.matrix.sources || {})[task]?.[benchmarkKey] || (STATE.matrix.sources || {})[task]?.[canonical] || '—',
        category: (STATE.matrix.benchmark_categories || {})[task]?.[benchmarkKey] || (STATE.matrix.benchmark_categories || {})[task]?.[canonical] || '—',
        release: (STATE.matrix.releases || {})[task]?.[benchmarkKey] || (STATE.matrix.releases || {})[task]?.[canonical] || null,
      });
    }
  }
  scores.sort((a, b) => b.score - a.score);

  // Subtask breakdown, keyed by benchmark_key (which may differ from the logical
  // name, e.g. qwen-3.8-max vs qwen3.8-max). Empty unless declared scores carry one.
  const subtaskApi = (STATE.matrix.subtasks || {});
  const taskBreakdown = subtaskApi[benchmarkKey] || subtaskApi[canonical] || null;

  const scoreTaskKeys = scores.map(s => s.task);
  const leftoverGroups = leftoverSubtaskGroups(taskBreakdown, scoreTaskKeys);

  detail.innerHTML = `
    <div class="model-detail-head">
      <h3 class="mono">${displayName}</h3>
      <div class="model-detail-actions">
        <button class="btn btn-outline" id="addScoreBtn">+ Add score</button>
        <button class="btn btn-outline" id="editModelBtn">Edit</button>
        ${reg ? '<button class="btn btn-outline btn-danger" id="deleteModelBtn">Delete</button>' : ''}
      </div>
    </div>

    <div class="model-section">
      <h4>Identity</h4>
      <dl class="model-kv">
        <dt>Benchmark key</dt><dd class="mono">${benchmarkKey}</dd>
        <dt>Provider version</dt>
        <dd class="mono">${effectiveRelease}${pinnedRelease && effectiveRelease === pinnedRelease ? ' <span class="muted">(active)</span>' : ' <span class="muted">(latest)</span>'}</dd>
        ${benchmarkRelease ? `<dt>Benchmark date</dt><dd class="mono">${benchmarkRelease}</dd>` : ''}
        ${quantization ? `<dt>Quantization</dt><dd><span class="badge badge-cache">${quantization}</span></dd>` : ''}
        <dt>Providers</dt>
        <dd class="provider-mapping-row">${providerNames.length ? providerNames.map(p => `<span class="provider-pill">${p}</span>`).join('') : '<span class="muted">none — unregistered</span>'}</dd>
        ${updatedAt ? `<dt>Updated</dt><dd>${updatedAt}</dd>` : ''}
      </dl>
    </div>

    <div class="model-section">
      <h4>Capability scores</h4>
      ${scores.length ? `
      <div class="score-list">
        ${scores.map(s => {
          const groups = expandGroupsFor(s.task, taskBreakdown);
          const clickable = groups.length ? ' clickable' : '';
          const chev = groups.length ? '<span class="score-chev">▸</span>' : '';
          return `
          <div class="score-item">
            <div class="score-row${clickable}" data-task="${s.task}" tabindex="0">
              <span class="score-task" title="${s.task}">${s.task.replace(/_/g, ' ')}</span>
              <div class="score-track"><div class="score-fill ${s.score >= 0.8 ? 'hi' : s.score >= 0.6 ? 'mid' : 'lo'}" style="width:${(s.score * 100).toFixed(0)}%"></div></div>
              <span class="score-pct">${(s.score * 100).toFixed(1)}%</span>
              ${chev}
            </div>
            ${groups.length ? subtaskPanelHtml(groups) : ''}
          </div>`;
        }).join('')}
      </div>` : '<p class="empty">No scores yet — run a benchmark below or add scores manually.</p>'}
    </div>

    ${leftoverGroups.length ? `
    <div class="model-section">
      <h4>Other subtasks</h4>
      <div class="score-list">
        ${leftoverGroups.map(g => `
          <div class="score-item">
            <div class="score-row clickable" data-task="${groupLabel(g.lb)}" tabindex="0">
              <span class="score-task" title="${groupLabel(g.lb)}">${groupLabel(g.lb)}</span>
              <div class="score-track"></div>
              <span class="score-pct"></span>
              <span class="score-chev">▸</span>
            </div>
            ${subtaskPanelHtml([g])}
          </div>`).join('')}
      </div>
    </div>` : ''}

    </div>`;

  document.getElementById('editModelBtn')?.addEventListener('click', () => editRegistry(model, benchmarkKey, providerMappings, pinnedRelease, benchmarkRelease, quantization));
  document.getElementById('deleteModelBtn')?.addEventListener('click', () => deleteRegistry(model));
  document.getElementById('addScoreBtn')?.addEventListener('click', () => openManualScore(model));
  detail.querySelectorAll('.score-row.clickable').forEach(row => {
    const toggle = () => row.classList.toggle('open');
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });
}

// ── Registry actions ────────────────────────────────────────────────────────

let EDIT_TARGET = null;   // logical name of the model being edited

function editRegistry(logical, benchmark, providerMappings, activeRelease, benchmarkRelease, quantization) {
  EDIT_TARGET = logical;
  document.getElementById('editLogicalName').value = logical;
  document.getElementById('editBenchmarkKey').value = benchmark || logical;
  document.getElementById('editActiveRelease').value = activeRelease || '';
  document.getElementById('editBenchmarkRelease').value = benchmarkRelease || '';
  document.getElementById('editQuantization').value = quantization || '';
  document.getElementById('editModelError').textContent = '';
  renderMappingRows(providerMappings || {});
  openDialog('editModelModal');
}

function renderMappingRows(mappings) {
  const wrap = document.getElementById('mappingRows');
  const entries = Object.entries(mappings || {});
  wrap.innerHTML = entries.map(([p, m], i) => `
    <div class="mapping-editor-row" data-index="${i}">
      <input class="form-input" data-role="provider" placeholder="provider" value="${esc(p)}">
      <input class="form-input" data-role="model" placeholder="model id" value="${esc(m)}">
      <button class="mapping-remove" type="button" data-remove="${i}" title="Remove">✕</button>
    </div>`).join('');
  if (!entries.length) {
    wrap.innerHTML = '<div class="form-help">No providers mapped yet.</div>';
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function readMappingRows() {
  const out = {};
  document.querySelectorAll('#mappingRows .mapping-editor-row').forEach(row => {
    const p = row.querySelector('[data-role="provider"]').value.trim();
    const m = row.querySelector('[data-role="model"]').value.trim();
    if (p && m) out[p] = m;
  });
  return out;
}

function saveEditModel() {
  const err = document.getElementById('editModelError');
  const benchmark = document.getElementById('editBenchmarkKey').value.trim();
  if (!benchmark) { err.textContent = 'Benchmark key is required.'; return; }
  const payload = {
    logical_name: EDIT_TARGET,
    benchmark_key: benchmark,
    provider_mappings: readMappingRows(),
    active_release: document.getElementById('editActiveRelease').value.trim() || null,
    quantization: document.getElementById('editQuantization').value.trim() || null,
    benchmark_release: document.getElementById('editBenchmarkRelease').value.trim() || null,
  };
  API.upsertRegistry(payload).then(r => {
    if (r.error) { err.textContent = 'Error: ' + r.error; return; }
    closeEditModel();
    loadAll();
  });
}

function closeEditModel() {
  EDIT_TARGET = null;
  closeDialog('editModelModal');
}

// ── Manual score entry (modal) ─────────────────────────────────────────────

const SCORE_TASKS = [
  'code_generation', 'reasoning_chain', 'debugging', 'agentic_multi_step',
  'planning', 'research_deep', 'casual_chat',
];

let SCORE_TARGET = null;

function openManualScore(model) {
  SCORE_TARGET = canonicalName(model);
  const reg = STATE.registry[SCORE_TARGET] || {};
  const bkey = reg.benchmark_key || SCORE_TARGET;
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('scoreModalTitle').textContent = 'Add score — ' + SCORE_TARGET;
  document.getElementById('scoreRelease').value = reg.active_release || today;
  document.getElementById('scoreError').textContent = '';

  const grid = document.getElementById('scoreGrid');
  grid.innerHTML = SCORE_TASKS.map(t => {
    const byTask = (STATE.matrix.tasks || {})[t] || {};
    const existing = byTask[bkey] !== undefined ? byTask[bkey] : byTask[SCORE_TARGET];
    const val = existing !== undefined ? (existing * 100).toFixed(1) : '';
    return `<div class="score-field">
      <label class="form-label" for="score-${t}">${t.replace(/_/g, ' ')}
        <input class="form-input" id="score-${t}" type="number" min="0" max="100" step="0.1" placeholder="—" value="${val}">
      </label>
    </div>`;
  }).join('');
  openDialog('scoreModal');
}

function saveScore() {
  const err = document.getElementById('scoreError');
  const release = document.getElementById('scoreRelease').value.trim();
  const scores = {};
  for (const t of SCORE_TASKS) {
    const input = document.getElementById('score-' + t);
    const v = input.value.trim();
    if (v === '') continue;
    const n = Number(v);
    if (isNaN(n) || n < 0 || n > 100) { err.textContent = 'Scores must be between 0 and 100.'; return; }
    scores[t] = n;
  }
  if (!Object.keys(scores).length) { err.textContent = 'Enter at least one score.'; return; }
  API.manualScores(SCORE_TARGET, scores, release).then(r => {
    if (r.error) { err.textContent = 'Error: ' + r.error; return; }
    closeScoreModal();
    loadAll();
  });
}

function closeScoreModal() {
  SCORE_TARGET = null;
  closeDialog('scoreModal');
}

// ── Add / delete registry ──────────────────────────────────────────────────

function addRegistry() {
  document.getElementById('regLogicalName').value = '';
  document.getElementById('regBenchmarkKey').value = '';
  document.getElementById('regModelError').textContent = '';
  renderRegMappingRows({});
  updateRegExistingNote();
  openDialog('registerModelModal');
}

function renderRegMappingRows(mappings) {
  const wrap = document.getElementById('regMappingRows');
  const entries = Object.entries(mappings || {});
  const selected = new Set(entries.map(([p]) => p).filter(Boolean));
  wrap.innerHTML = entries.map(([p, m]) => {
    const used = new Set(selected);
    used.delete(p);  // don't disable this row's own selection
    return regMappingRowHtml(p, m, used);
  }).join('');
  if (!entries.length) {
    wrap.innerHTML = '<div class="form-help">No providers mapped yet.</div>';
  }
}

function availableProviders() {
  return Object.keys(STATE.providers || {}).sort();
}

// ── Register-modal provider uniqueness ─────────────────────────────────────

// Resolve a raw key to a registry entry: exact logical name first, then
// through the alias map (benchmark keys and provider-side model IDs).
function regLookup(k) {
  if (!k) return null;
  if (STATE.registry[k]) return STATE.registry[k];
  const logical = (STATE.aliasMap || {})[k];
  return logical ? (STATE.registry[logical] || null) : null;
}

// The register modal UPDATES an existing model only when the typed logical
// name resolves to a registry entry. A benchmark key that matches a different
// model is a conflict (caught at save time), not a target to pre-fill.
function regTargetEntry() {
  const logical = (document.getElementById('regLogicalName').value || '').trim().toLowerCase();
  const benchmark = (document.getElementById('regBenchmarkKey').value || '').trim().toLowerCase();
  return regLookup(logical) || null;
}

function regExistingMappings() {
  const entry = regTargetEntry();
  return (entry && entry.provider_mappings) || {};
}

// Providers already mapped to the target model in the registry. These are
// grayed out so a (provider, model) pair can never be registered twice.
function regAlreadyMappedProviders() {
  return new Set(Object.keys(regExistingMappings()));
}

function updateRegExistingNote() {
  const note = document.getElementById('regExistingNote');
  const entry = regTargetEntry();
  if (entry) {
    const providers = Object.keys(entry.provider_mappings || {});
    note.textContent = providers.length
      ? `Already registered as "${entry.logical_name}" with: ${providers.join(', ')}. Those providers are grayed out — only unmapped providers can be added.`
      : `Already registered as "${entry.logical_name}" — no providers mapped yet.`;
  } else {
    note.textContent = '';
  }
  refreshRegProviderSelects();
}

// Reject duplicate registrations before they reach the API: a benchmark key
// may not belong to two models, and a (provider, model) pair may not be
// claimed by two models.
function regConflicts(providerMappings) {
  const logical = (document.getElementById('regLogicalName').value || '').trim().toLowerCase();
  const benchmark = (document.getElementById('regBenchmarkKey').value || '').trim().toLowerCase();
  const target = regTargetEntry();
  const targetName = target ? target.logical_name : null;
  const holder = regLookup(benchmark);
  if (holder && holder.logical_name !== targetName && holder.logical_name !== logical) {
    return `Benchmark key "${benchmark}" is already registered to "${holder.logical_name}".`;
  }
  for (const [provider, model] of Object.entries(providerMappings || {})) {
    const norm = normalizeModelId(model);
    for (const [otherName, other] of Object.entries(STATE.registry)) {
      if (otherName === targetName) continue;
      const otherMid = (other.provider_mappings || {})[provider];
      if (otherMid && normalizeModelId(otherMid) === norm) {
        return `Provider "${provider}" already maps "${otherMid}" to "${otherName}".`;
      }
    }
  }
  return '';
}

function nextRegProvider() {
  // First provider not already taken by an existing row or already mapped to
  // the target model, so new rows never start out as a duplicate.
  const used = new Set([...document.querySelectorAll('#regMappingRows select[data-role="provider"]')]
    .map(s => s.value).filter(Boolean));
  regAlreadyMappedProviders().forEach(p => used.add(p));
  return availableProviders().find(n => !used.has(n)) || '';
}

function regProviderOptionsHtml(selected, disabledNames) {
  const names = availableProviders();
  const disabled = disabledNames || new Set();
  let opts = names.map(n => {
    const isDisabled = disabled.has(n) && n !== selected ? ' disabled' : '';
    const isSelected = n === selected ? ' selected' : '';
    return `<option value="${esc(n)}"${isSelected}${isDisabled}>${esc(n)}</option>`;
  }).join('');
  if (selected && !names.includes(selected)) {
    opts = `<option value="${esc(selected)}" selected>${esc(selected)}</option>` + opts;
  }
  return opts;
}

function regModelFieldHtml(provider, current) {
  const models = ((STATE.providers || {})[provider] || {}).models || [];
  if (models.length) {
    let opts = models.map(m => `<option value="${esc(m)}"${m === current ? ' selected' : ''}>${esc(m)}</option>`).join('');
    if (current && !models.includes(current)) {
      opts = `<option value="${esc(current)}" selected>${esc(current)}</option>` + opts;
    }
    return `<select class="form-input" data-role="model">${opts}</select>`;
  }
  return `<input class="form-input" data-role="model" placeholder="model id" value="${esc(current)}">`;
}

function regMappingRowHtml(p, m, disabledNames) {
  return `<div class="mapping-editor-row">
    <select class="form-input" data-role="provider">${regProviderOptionsHtml(p, disabledNames)}</select>
    ${regModelFieldHtml(p || availableProviders()[0] || '', m)}
    <button class="mapping-remove" type="button" title="Remove">✕</button>
  </div>`;
}

function refreshRegProviderSelects() {
  // Recompute which providers are already taken — by another row OR already
  // mapped to the target model in the registry — and gray them out everywhere
  // except their own row, keeping selections intact.
  const selects = [...document.querySelectorAll('#regMappingRows select[data-role="provider"]')];
  const used = new Set(selects.map(s => s.value).filter(Boolean));
  regAlreadyMappedProviders().forEach(p => used.add(p));
  selects.forEach(sel => {
    const cur = sel.value;
    const disabledNames = new Set(used);
    disabledNames.delete(cur);
    sel.innerHTML = regProviderOptionsHtml(cur, disabledNames);
  });
}

function readRegMappingRows() {
  const out = {};
  document.querySelectorAll('#regMappingRows .mapping-editor-row').forEach(row => {
    const pSel = row.querySelector('[data-role="provider"]');
    const mSel = row.querySelector('[data-role="model"]');
    if (!pSel || !mSel) return;  // skip empty/ghost rows
    const p = pSel.value.trim();
    const m = mSel.value.trim();
    if (p && m) out[p] = m;
  });
  return out;
}

function saveRegisterModel() {
  const err = document.getElementById('regModelError');
  const logical = document.getElementById('regLogicalName').value.trim().toLowerCase();
  const benchmark = document.getElementById('regBenchmarkKey').value.trim().toLowerCase();
  if (!logical) { err.textContent = 'Logical name is required.'; return; }
  if (!benchmark) { err.textContent = 'Benchmark key is required.'; return; }
  const newRows = readRegMappingRows();
  // Preserve mappings that already exist for this model, so re-registering an
  // existing model never wipes its current provider mappings.
  const merged = {...regExistingMappings(), ...newRows};
  const conflict = regConflicts(merged);
  if (conflict) { err.textContent = 'Error: ' + conflict; return; }
  API.upsertRegistry({
    logical_name: logical,
    benchmark_key: benchmark,
    provider_mappings: merged,
  }).then(r => {
    if (r.error) { err.textContent = 'Error: ' + r.error; return; }
    closeRegisterModel();
    STATE.selected = logical;
    loadAll();
  });
}

function closeRegisterModel() {
  closeDialog('registerModelModal');
}

let DELETE_TARGET = null;

function deleteRegistry(logical) {
  DELETE_TARGET = logical;
  document.getElementById('deleteModelText').textContent =
    'Delete "' + logical + '" from the model registry? This does not remove its declared scores.';
  document.getElementById('deleteModelError').textContent = '';
  openDialog('deleteModelModal');
}

function confirmDeleteModel() {
  const err = document.getElementById('deleteModelError');
  API.deleteRegistry(DELETE_TARGET).then(r => {
    if (r.error) { err.textContent = 'Error: ' + r.error; return; }
    closeDeleteModel();
    if (STATE.selected === DELETE_TARGET) STATE.selected = null;
    loadAll();
  });
}

function closeDeleteModel() {
  DELETE_TARGET = null;
  closeDialog('deleteModelModal');
}


// ── Wiring ──────────────────────────────────────────────────────────────────


document.getElementById('modelFilter').addEventListener('input', function() {
  STATE.filter = this.value;
  renderModelList();
});
document.getElementById('addRegistryBtn').addEventListener('click', addRegistry);
document.getElementById('addMappingRowBtn').addEventListener('click', function () {
  const wrap = document.getElementById('mappingRows');
  // Replace the "no providers yet" help with a row.
  if (!wrap.querySelector('.mapping-editor-row')) wrap.innerHTML = '';
  const idx = wrap.querySelectorAll('.mapping-editor-row').length;
  const row = document.createElement('div');
  row.className = 'mapping-editor-row';
  row.dataset.index = idx;
  row.innerHTML = `
    <input class="form-input" data-role="provider" placeholder="provider">
    <input class="form-input" data-role="model" placeholder="model id">
    <button class="mapping-remove" type="button" title="Remove">✕</button>`;
  wrap.appendChild(row);
  row.querySelector('[data-role="provider"]').focus();
});
document.getElementById('mappingRows').addEventListener('click', function (e) {
  const btn = e.target.closest('.mapping-remove');
  if (!btn) return;
  const row = btn.closest('.mapping-editor-row');
  if (row) row.remove();
  if (!document.querySelector('#mappingRows .mapping-editor-row')) {
    document.getElementById('mappingRows').innerHTML = '<div class="form-help">No providers mapped yet.</div>';
  }
});
document.getElementById('saveModelBtn').addEventListener('click', saveEditModel);
document.getElementById('saveScoreBtn').addEventListener('click', saveScore);
document.getElementById('confirmDeleteModelBtn').addEventListener('click', confirmDeleteModel);
document.getElementById('saveRegisterBtn').addEventListener('click', saveRegisterModel);
document.getElementById('regAddMappingRowBtn').addEventListener('click', function () {
  const wrap = document.getElementById('regMappingRows');
  // Replace the "no providers yet" help with a row.
  if (!wrap.querySelector('.mapping-editor-row')) wrap.innerHTML = '';
  const provider = nextRegProvider();
  if (!provider) {
    // Every provider is already mapped to the target model (or none exist).
    const note = document.getElementById('regExistingNote');
    const entry = regTargetEntry();
    note.textContent = entry
      ? `All available providers are already mapped to "${entry.logical_name}". Remove a row to change a mapping.`
      : 'No providers are available to map.';
    return;
  }
  // regMappingRowHtml already returns a full .mapping-editor-row div, so parse
  // it and append that element directly rather than nesting it in another row.
  const tmp = document.createElement('div');
  tmp.innerHTML = regMappingRowHtml(provider, '');
  const row = tmp.firstElementChild;
  wrap.appendChild(row);
  // Gray out providers that are already taken in other rows or already mapped.
  refreshRegProviderSelects();
  row.querySelector('[data-role="provider"]').focus();
});
document.getElementById('regMappingRows').addEventListener('click', function (e) {
  const btn = e.target.closest('.mapping-remove');
  if (!btn) return;
  const row = btn.closest('.mapping-editor-row');
  if (row) row.remove();
  if (!document.querySelector('#regMappingRows .mapping-editor-row')) {
    document.getElementById('regMappingRows').innerHTML = '<div class="form-help">No providers mapped yet.</div>';
  } else {
    // Re-enable any providers that are now free again.
    refreshRegProviderSelects();
  }
});
document.getElementById('regMappingRows').addEventListener('change', function (e) {
  const sel = e.target;
  if (!sel.matches || !sel.matches('select[data-role="provider"]')) return;
  const row = sel.closest('.mapping-editor-row');
  const modelField = row.querySelector('[data-role="model"]');
  const provider = sel.value;
  const models = ((STATE.providers || {})[provider] || {}).models || [];
  // Rebuild the model field as a dropdown of that provider's models (or a
  // free-text input when the provider has no registered models).
  const container = modelField.parentNode;
  const tmp = document.createElement('div');
  tmp.innerHTML = regModelFieldHtml(provider, '');
  container.replaceChild(tmp.firstChild, modelField);
  // The provider just picked is now taken — gray it out in every other row.
  refreshRegProviderSelects();
});

// As the user types a logical name / benchmark key, surface existing
// registrations and gray out providers that are already mapped to them.
['regLogicalName', 'regBenchmarkKey'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateRegExistingNote);
});

// Dynamic-routing status note (enabled / policy).
(async function () {
  const note = document.getElementById('routingNote');
  if (!note) return;
  try {
    const r = await fetch('/api/routing/status');
    const d = await r.json();
    note.textContent = d.enabled
      ? '· dynamic routing on (' + d.policy + (d.min_score ? ', min ' + d.min_score : '') + ')'
      : '· dynamic routing off';
  } catch (e) {
    note.textContent = '';
  }
})();

loadAll();
</script>
