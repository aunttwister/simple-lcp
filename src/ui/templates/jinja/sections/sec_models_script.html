    Do not edit the block boundaries: this partial is included by a merged page
    (models) inside a tab guard for the tab 'leaderboard'. -#}

{% if tab == 'leaderboard' %}
<script>
// ── Leaderboard page ────────────────────────────────────────────────────────
// Operator, 2026-11-15: "we are pushing for leaderboard and percentile only".
// The capability matrix, the model list, the filter, Register model and the
// Model detail tab are GONE. What remains is the taxonomy tab strip, the board
// itself, and the shared detail panel carrying the two controls.
const API = {
  async board(tax) {
    const r = await fetch('/api/model-ratings/leaderboard' +
      (tax ? '?taxonomy=' + encodeURIComponent(tax) : ''));
    return r.json();
  },
  async boardStaged() {
    const r = await fetch('/api/model-ratings/staged');
    return r.json();
  },
  async boardPoll() {
    const r = await fetch('/api/model-ratings/poll', {method: 'POST'});
    return r.json();
  },
  async boardUpdate(keys) {
    const r = await fetch('/api/model-ratings/update', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({keys: keys})
    });
    return r.json();
  },
  async boardClear() {
    const r = await fetch('/api/model-ratings/clear', {method: 'POST'});
    return r.json();
  },
  async catalogue() {
    const r = await fetch('/api/model-ratings/catalogue');
    return r.json();
  },
  async map(body) {
    const r = await fetch('/api/model-ratings/map', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    return r.json();
  },
  async unmap(taxonomy, board) {
    const r = await fetch('/api/model-ratings/map?taxonomy=' + encodeURIComponent(taxonomy) +
      '&board=' + encodeURIComponent(board), {method: 'DELETE'});
    return r.json();
  },
  async taxonomy(body) {
    const r = await fetch('/api/model-ratings/taxonomy', body ? {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    } : {});
    return r.json();
  }
};

let STATE = {tax: null, tabs: [], lb: {rows: [], eligible: []},
             pollRows: [], polledAt: null, pollChecks: {}, catalogue: null};

// ── polled data lives in the BROWSER, not on the server ────────────────────
// Operator, 2026-11-15: "once we poll it we should keep it on frontend in
// memory in local or session storage ... only by user's Poll again the
// repolling will happen". So a page load READS what this tab polled and shows
// it with the time it was taken; nothing re-polls behind his back, and a reload
// does not throw away which rows he had ticked.
//
// session storage, not local: the polled set is a review in progress, and a new
// tab should not inherit a stale one from yesterday. Within this tab it survives
// a reload, which is the case that was destroying his selections.
const POLL_KEY = 'lcp.lb.poll.v1';

// The row's identity, as a string. One definition, used as the React-style key
// for both the DOM and the stored tick map, so a tick can never land on the
// wrong row after a reload.
function pollKeyOf(r) {
  return JSON.stringify([r.model_slug, r.taxonomy, r.unit, r.board, r.effort]);
}

function savePoll(rows, polledAt) {
  STATE.pollRows = rows || [];
  STATE.polledAt = polledAt || null;
  try {
    if (STATE.pollRows.length) {
      sessionStorage.setItem(POLL_KEY, JSON.stringify({
        v: 1, at: STATE.polledAt, rows: STATE.pollRows, checks: STATE.pollChecks || {}
      }));
    } else {
      sessionStorage.removeItem(POLL_KEY);
      STATE.pollChecks = {};
    }
  } catch (e) { /* private mode: the panel still works for this page view */ }
}

function loadPoll() {
  try {
    const raw = sessionStorage.getItem(POLL_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1 || !Array.isArray(d.rows)) return false;
    STATE.pollRows = d.rows;
    STATE.polledAt = d.at || null;
    STATE.pollChecks = d.checks || {};
    return STATE.pollRows.length > 0;
  } catch (e) { return false; }
}

// Persist the ticks as they are made, so a reload resumes the SAME review rather
// than resetting every row to its default. Writing on change (not on unload) means
// a crash or a killed tab keeps the last deliberate click.
function saveChecks() {
  if (!STATE.pollRows || !STATE.pollRows.length) return;
  try {
    sessionStorage.setItem(POLL_KEY, JSON.stringify({
      v: 1, at: STATE.polledAt, rows: STATE.pollRows, checks: STATE.pollChecks || {}
    }));
  } catch (e) { /* private mode */ }
}

function checkStateFor(r) {
  const k = pollKeyOf(r);
  const stored = (STATE.pollChecks || {})[k];
  return typeof stored === 'boolean' ? stored : !!r.changed;
}

// A poll reads the ARENA boards. A `custom:` board is a rating the operator
// entered and has no upstream, so it must never appear in the polled set even if
// a stored blob or a hand-made row carries one.
function isArena(tax) { return String(tax || '').indexOf('custom:') !== 0; }
function arenaRows(rows) { return (rows || []).filter(r => isArena(r.taxonomy)); }

// ── formatting ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function unitLabel(unit) {
  return unit === 'elo' ? 'Elo' : (unit === 'net_improvement' ? 'net improvement' : unit);
}

function fmtValue(value, unit) {
  if (value === null || value === undefined) return '—';
  return unit === 'elo' ? Number(value).toFixed(1) : Number(value).toFixed(4);
}

function fmtWhen(s) {
  // Trails span months, so the date is shown whole; the year is never dropped.
  return s ? String(s).slice(0, 10) : '—';
}

// ── the tab strip: 3 tabs + "…" on desktop, 1 tab + "…" on mobile ───────────
// The LEADING tabs never move; the last visible slot carries the active tab when
// the active one would otherwise be overflowed, so "where am I" is always on
// screen without reordering the strip under the operator's finger.
const STRIP_DESKTOP = 4;
const STRIP_MOBILE = 1;
const STRIP_MQ = window.matchMedia('(min-width: 768px)');

function stripLimit() { return STRIP_MQ.matches ? STRIP_DESKTOP : STRIP_MOBILE; }

function visibleTabs() {
  const all = STATE.tabs || [];
  const n = Math.max(1, stripLimit());
  if (all.length <= n) return all.slice();
  const active = all.find(t => t.taxonomy === STATE.tax);
  const head = all.slice(0, n - 1);
  const hiddenHasActive = active && head.indexOf(active) === -1;
  const tail = hiddenHasActive ? [active] : all.slice(n - 1, n);
  return head.concat(tail);
}

function tabLabel(t) {
  // The tab carries the label and the row count only. The arena/custom origin
  // rides in the "…" dropdown, where there is room to read it.
  return esc(t.label || t.taxonomy) +
    (t.rows ? `<span class="ml-tab-count">${t.rows}</span>` : '');
}

function renderTabs() {
  const wrap = document.getElementById('mlTabs');
  if (!wrap) return;
  const all = STATE.tabs || [];
  const vis = visibleTabs();
  const hidden = all.filter(t => vis.indexOf(t) === -1);

  let html = vis.map(t => {
    const active = STATE.tax === t.taxonomy ? ' active' : '';
    const sel = STATE.tax === t.taxonomy ? 'true' : 'false';
    return `<button class="ml-tab${active}" role="tab" aria-selected="${sel}"
      data-tax="${esc(t.taxonomy)}">${tabLabel(t)}</button>`;
  }).join('');

  if (hidden.length) {
    html += `<button class="ml-tab ml-more" id="mlMoreBtn" aria-haspopup="true"
      aria-expanded="false" title="${hidden.length} more leaderboard${hidden.length === 1 ? '' : 's'}"
      >&hellip;</button>`;
  }
  wrap.innerHTML = html;

  wrap.querySelectorAll('.ml-tab[data-tax]').forEach(btn => {
    btn.addEventListener('click', () => selectTab(btn.dataset.tax));
  });
  const more = document.getElementById('mlMoreBtn');
  if (more) more.addEventListener('click', ev => { ev.stopPropagation(); toggleMore(more); });
}

function closeMore() {
  const m = document.getElementById('mlMoreMenu');
  if (m) m.remove();
  const btn = document.getElementById('mlMoreBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  document.removeEventListener('click', closeMore);
  document.removeEventListener('keydown', onMoreKey);
}

function onMoreKey(ev) {
  if (ev.key === 'Escape') { closeMore(); document.getElementById('mlMoreBtn')?.focus(); return; }
  const menu = document.getElementById('mlMoreMenu');
  if (!menu) return;
  const items = [...menu.querySelectorAll('.ml-more-item')];
  if (!items.length) return;
  const i = items.indexOf(document.activeElement);
  if (ev.key === 'ArrowDown') { ev.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); items[Math.max(i - 1, 0)].focus(); }
}

function toggleMore(btn) {
  if (document.getElementById('mlMoreMenu')) { closeMore(); return; }
  const all = STATE.tabs || [];
  const vis = visibleTabs();
  const hidden = all.filter(t => vis.indexOf(t) === -1);
  if (!hidden.length) return;

  const menu = document.createElement('div');
  menu.className = 'ml-more-menu';
  menu.id = 'mlMoreMenu';
  menu.setAttribute('role', 'menu');
  menu.innerHTML = hidden.map(t => {
    const on = STATE.tax === t.taxonomy;
    const kind = t.kind === 'custom' ? 'yours' : 'arena';
    return `<button class="ml-more-item${on ? ' active' : ''}" role="menuitem"
      data-tax="${esc(t.taxonomy)}">
      <span class="ml-more-label">${esc(t.label || t.taxonomy)}</span>
      <span class="ml-more-kind">${kind}</span>
      <span class="ml-tab-count">${t.rows}</span>
    </button>`;
  }).join('');
  btn.parentNode.insertBefore(menu, btn.nextSibling);
  btn.setAttribute('aria-expanded', 'true');

  menu.querySelectorAll('.ml-more-item').forEach(item => {
    item.addEventListener('click', ev => {
      ev.stopPropagation();
      closeMore();
      selectTab(item.dataset.tax);
    });
  });
  // Defer so the click that opened the menu does not immediately close it.
  setTimeout(() => {
    document.addEventListener('click', closeMore);
    document.addEventListener('keydown', onMoreKey);
  }, 0);
  const first = menu.querySelector('.ml-more-item');
  if (first) first.focus();
}

STRIP_MQ.addEventListener('change', renderTabs);

// ── the board ───────────────────────────────────────────────────────────────
function selectTab(tax) {
  STATE.tax = tax;
  renderTabs();
  renderTaxList();
  loadBoard(tax);
}

async function loadBoard(tax) {
  const data = await API.board(tax);
  STATE.lb = {rows: data.rows || [], eligible: data.eligible || []};
  if (data.tabs) { STATE.tabs = data.tabs; renderTabs(); }
  renderBoard(data);
  renderTaxList();
  renderPollEligible();
}

function renderPollEligible() {
  const elig = document.getElementById('pollEligible');
  if (!elig) return;
  const n = (STATE.lb.eligible || []).length;
  elig.textContent = n
    ? `${n} registered models can appear on a board right now.`
    : 'No model is registered right now, so no board can list one.';
}

function renderBoard(data) {
  const table = document.getElementById('lbTable');
  const note = document.getElementById('lbNote');
  if (!table) return;
  const rows = data.rows || [];
  const eligible = data.eligible || [];
  const units = [...new Set(rows.map(r => r.unit))];
  if (note) {
    if (rows.length) {
      // Per unit, because the two families are different measurements and a
      // single total would imply one ranking.
      const per = units.map(u =>
        `${rows.filter(r => r.unit === u).length} on ${unitLabel(u)}`).join(' · ');
      note.innerHTML = `${per}. Only the ${eligible.length} models a provider serves ` +
        'here can appear.';
    } else {
      note.innerHTML = `Nothing ranked on <strong>${esc(data.taxonomy)}</strong> yet — ` +
        `${eligible.length} models are eligible. Poll latest data, or rate models ` +
        'yourself in Manage taxonomy.';
    }
  }
  if (!rows.length) {
    table.innerHTML = '<div class="empty">Nothing ranked on this taxonomy yet. ' +
      'Poll latest data, or rate models yourself in Manage taxonomy.</div>';
    return;
  }
  const html = [];
  units.forEach(unit => {
    const group = rows.filter(r => r.unit === unit);
    if (!group.length) return;
    html.push(`<div class="lb-unit-head">${esc(unitLabel(unit))}
      <span class="muted">${group.length} models</span></div>`);
    html.push('<table class="data-table lb-table"><caption class="sr-only">' +
      esc(data.taxonomy) + ' — ' + esc(unitLabel(unit)) + '</caption><thead><tr>' +
      '<th scope="col" class="num">#</th><th scope="col">Model</th>' +
      '<th scope="col">Lab</th>' +
      `<th scope="col" class="num">${esc(unitLabel(unit))}</th>` +
      '<th scope="col" class="num">Percentile</th>' +
      '<th scope="col">Date</th>' +
      '</tr></thead><tbody>');
    group.forEach((r, i) => {
      // The board a number came from is the Value cell's title, not a column:
      // rank / model / lab / value / percentile / date is the enumeration.
      const boards = (r.boards || [r.board]).filter(Boolean).join(', ') || '—';
      const title = `${esc(r.source === 'custom' ? 'your rating' : (r.basis || 'board'))} — ${esc(boards)}`;
      // Position in THIS board as the row number; the arena's own rank (out of
      // its whole field) rides in the percentile's title so the two scales are
      // never confused for one another.
      const rankNote = r.rank ? `arena rank ${r.rank}${r.n ? ' of ' + r.n : ''}` : '';
      // data-label drives the ≤640px stacked layout: at 390px six columns in
      // one row squeezed the date into "2026-" / "11-11", which reads as corrupt
      // data. On a phone each row becomes labelled blocks instead.
      html.push('<tr>' +
        `<td class="num" data-label="#">${i + 1}</td>` +
        `<td class="mono" data-label="Model">${esc(r.model_slug)}` +
        (r.effort ? `<span class="lb-effort">${esc(r.effort)}</span>` : '') + '</td>' +
        `<td data-label="Lab">${esc(r.lab || '—')}</td>` +
        `<td class="num" data-label="${esc(unitLabel(unit))}" title="${title}">${fmtValue(r.value, r.unit)}</td>` +
        `<td class="num" data-label="Percentile"${rankNote ? ` title="${rankNote}"` : ''}>${r.percentile === null || r.percentile === undefined ? '—' : Number(r.percentile).toFixed(1)}</td>` +
        `<td class="lb-when" data-label="Date">${esc(fmtWhen(r.published))}</td>` +
        '</tr>');
    });
    html.push('</tbody></table>');
  });
  table.innerHTML = html.join('');
}

// ── the shared detail panel: poll | manage taxonomy ─────────────────────────
const MP_DESKTOP = window.matchMedia('(min-width: 1100px)');

function mpPanel() { return document.getElementById('modelsPanel'); }

function mpShow(pane) {
  const panel = mpPanel();
  if (!panel) return;
  document.getElementById('pollPane').hidden = pane !== 'poll';
  document.getElementById('taxPane').hidden = pane !== 'tax';
  const title = document.getElementById('mpTitle');
  if (title) title.textContent = pane === 'tax' ? 'Manage taxonomy' : 'Poll latest data';
  panel.dataset.pane = pane;
  panel.classList.add('open');
  const back = document.getElementById('mpBackdrop');
  // Backdrop only where the panel overlays (< 1100px). On the desktop lane
  // there is no modal layer at all.
  if (back) back.classList.toggle('open', !MP_DESKTOP.matches);
}

function mpHide() {
  const panel = mpPanel();
  if (!panel) return;
  panel.classList.remove('open');
  const back = document.getElementById('mpBackdrop');
  if (back) back.classList.remove('open');
}

function mpClose() {
  // ✕ CLOSES the lane on both breakpoints. It used to call mpShow('tax') on
  // desktop — a no-op whenever taxonomy was already the open pane, which is the
  // state this page now loads in, so the button read as broken. Closing is the
  // honest meaning for a control shaped like a close button; the two buttons in
  // column 2 bring the lane back, and a closed lane releases its reserved width
  // (see the #modelsPanel rule in dashboard.css) so nothing is wasted.
  mpHide();
}

// ── drag handle (file-explorer splitter), the shared lane mechanics ────────
// The dragged width rides --dp-width on <body>; --detail-width stays the shared
// default owned by the overview block.
(function mpResizer() {
  const handle = document.getElementById('mpResizer');
  if (!handle) return;
  const MIN_W = 280, MAX_W = 760;
  let dragging = false;

  function setWidth(px, persist) {
    px = Math.max(MIN_W, Math.min(px, Math.min(window.innerWidth * 0.6, MAX_W)));
    document.body.style.setProperty('--dp-width', px + 'px');
    if (persist) {
      try { localStorage.setItem('models-panel-width', String(px)); } catch (e) { /* private mode */ }
    }
  }
  try {
    const saved = parseInt(localStorage.getItem('models-panel-width') || '', 10);
    if (saved) setWidth(saved, false);
  } catch (e) { /* private mode */ }

  handle.addEventListener('pointerdown', ev => {
    dragging = true;
    handle.classList.add('dragging');
    handle.setPointerCapture(ev.pointerId);
    document.body.classList.add('dp-resizing');
  });
  handle.addEventListener('pointermove', ev => {
    if (dragging) setWidth(window.innerWidth - ev.clientX, false);
  });
  handle.addEventListener('pointerup', ev => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    handle.releasePointerCapture(ev.pointerId);
    document.body.classList.remove('dp-resizing');
    setWidth(window.innerWidth - ev.clientX, true);
  });
  handle.addEventListener('dblclick', () => {
    document.body.style.removeProperty('--dp-width');
    try { localStorage.removeItem('models-panel-width'); } catch (e) { /* private mode */ }
  });
})();

// ── poll: staged diff, then accept or discard ───────────────────────────────
function fmtStamp(iso) {
  // Trail stamps carry the year and are UTC-labelled: they span months.
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 16).replace('T', ' ');
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ` +
    `${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
}

function renderPollPanel() {
  const intro = document.getElementById('pollIntro');
  const results = document.getElementById('pollResults');
  const rows = arenaRows(STATE.pollRows);
  if (!intro || !results) return;
  const showResults = rows.length > 0;
  intro.hidden = showResults;
  results.hidden = !showResults;
  renderPollEligible();
  if (!showResults) return;
  const moved = rows.filter(r => r.changed);
  document.getElementById('pollCount').textContent = String(rows.length);
  const at = document.getElementById('pollAt');
  if (at) {
    at.textContent = STATE.polledAt
      ? `Data polled at ${fmtStamp(STATE.polledAt)} — kept in this tab, not re-polled.`
      : '';
  }
  document.getElementById('pollMoved').textContent =
    `${moved.length} moved, ${rows.length - moved.length} unchanged`;
  const wrap = document.getElementById('pollRows');
  let lastTax = null;
  wrap.innerHTML = rows.map(r => {
    // Changed rows read as a move (old struck -> new, both dates). An unchanged
    // row shows its value once, plainly: striking it through with no successor
    // reads as a missing value rather than as "nothing moved".
    const isMoved = r.changed;
    const val = isMoved
      ? `${r.old_value === null || r.old_value === undefined ? '<span class="muted">new</span>' : '<s>' + fmtValue(r.old_value, r.unit) + '</s>'} → ${fmtValue(r.value, r.unit)}`
      : fmtValue(r.value, r.unit);
    const when = isMoved
      ? `${esc(fmtWhen(r.old_date))} → ${esc(fmtWhen(r.new_date))}`
      : esc(fmtWhen(r.new_date || r.old_date));
    const key = esc(pollKeyOf(r));
    const head = r.taxonomy !== lastTax
      ? `<div class="mp-group">${esc(r.taxonomy)}</div>` : '';
    lastTax = r.taxonomy;
    return `${head}<label class="mp-row">
      <input type="checkbox" class="mp-check" data-key="${key}" ${checkStateFor(r) ? 'checked' : ''}>
      <span class="mp-row-main">
        <span class="mp-row-model mono">${esc(r.model_slug)}</span>
        <span class="mp-row-tax">${esc(r.taxonomy)}${r.effort ? ' · ' + esc(r.effort) : ''}</span>
        <span class="mp-row-val">${val} <span class="muted">${esc(unitLabel(r.unit))}</span></span>
        <span class="mp-row-dates">${when}</span>
      </span>
    </label>`;
  }).join('');
  // Every tick is remembered immediately (see saveChecks): a reload must resume
  // the review in the state he left it, not reset to the defaults.
  wrap.querySelectorAll('.mp-check').forEach(box => {
    box.addEventListener('change', () => {
      const k = box.dataset.key;
      STATE.pollChecks = STATE.pollChecks || {};
      // The stored key is the ESCAPED json; re-parse it so it matches pollKeyOf.
      let raw = k;
      try { raw = JSON.stringify(JSON.parse(k)); } catch (e) { /* keep k */ }
      STATE.pollChecks[raw] = box.checked;
      saveChecks();
    });
  });
}

function pollKeys() {
  return [...document.querySelectorAll('#pollRows .mp-check')]
    .filter(c => c.checked)
    .map(c => {
      const [model_slug, taxonomy, unit, board, effort] = JSON.parse(c.dataset.key);
      return {model_slug, taxonomy, unit, board, effort};
    });
}

function pollMsg(text, tone) {
  ['pollMsg', 'pollMsg2'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || '';
    el.dataset.tone = tone || '';
  });
}

async function runPoll() {
  // One trigger aborts a poll: the pane's own button. The header button only
  // shows the pane, so it must not be disabled by this — it stays usable.
  const btn = document.getElementById('pollRunBtn2');
  if (btn) btn.disabled = true;
  pollMsg('Polling the LMArena boards…');
  let r;
  try {
    r = await API.boardPoll();
  } catch (e) {
    if (btn) btn.disabled = false;
    pollMsg('Poll request failed: ' + e + ' — nothing was changed.', 'bad');
    return;
  }
  if (btn) btn.disabled = false;
  if (r.error) {
    pollMsg('Poll failed upstream: ' + r.error + ' — nothing was changed. Try again.', 'bad');
    return;
  }
  // Only the arena half is kept, and it is kept in the BROWSER: a reload shows
  // the same reviewable set with its poll time instead of starting over.
  STATE.pollChecks = {};   // a NEW poll starts from its own defaults
  savePoll(arenaRows(r.rows), r.polled_at || new Date().toISOString());
  if (r.taxonomies) STATE.tabs = r.taxonomies;
  if (!STATE.tax && STATE.tabs.length) STATE.tax = STATE.tabs[0].taxonomy;
  renderPollPanel();
  renderTabs();
  renderTaxList();
  loadCatalogue();      // the poll just stored every board — the map is decidable now
  pollMsg('');
  if (STATE.tax) loadBoard(STATE.tax);
}

async function updatePoll() {
  const keys = pollKeys();
  if (!keys.length) { pollMsg('Tick at least one row to publish.', 'warn'); return; }
  pollMsg('Publishing ' + keys.length + ' rows…');
  const r = await API.boardUpdate(keys);
  if (r.error) { pollMsg('Update failed: ' + r.error, 'bad'); return; }
  pollMsg(`Published ${r.written} rows. The board beside this panel has been re-rendered.`, 'ok');
  savePoll([], null);
  if (r.taxonomies) STATE.tabs = r.taxonomies;
  renderTabs();
  renderPollPanel();
  renderTaxList();
  if (STATE.tax) loadBoard(STATE.tax);
}

async function clearPoll() {
  const r = await API.boardClear();
  if (r.error) { pollMsg('Clear failed: ' + r.error, 'bad'); return; }
  STATE.pollRows = [];
  pollMsg(`Discarded ${r.cleared} polled rows. The published leaderboard was not changed.`, 'ok');
  savePoll([], null);
  renderPollPanel();
}

// ── manage taxonomy ────────────────────────────────────────────────────────
function renderTaxList() {
  const wrap = document.getElementById('taxList');
  if (!wrap) return;
  const tabs = STATE.tabs || [];
  wrap.innerHTML = tabs.length
    ? tabs.map(t => `<div class="mp-tax-row${STATE.tax === t.taxonomy ? ' active' : ''}"
        data-tax="${esc(t.taxonomy)}">
        <span class="mp-tax-name">${esc(t.label || t.taxonomy)}</span>
        <span class="mp-tax-kind">${t.kind === 'custom' ? 'yours' : 'arena'}</span>
        <span class="mp-tax-rows">${t.rows} rows</span>
      </div>`).join('')
    : '<div class="muted">No taxonomies yet.</div>';
  wrap.querySelectorAll('.mp-tax-row').forEach(el => {
    el.addEventListener('click', () => selectTab(el.dataset.tax));
  });
}

// ── the mapping, TAXONOMY-FIRST ────────────────────────────────────────────
// Measured complaint (2026-11-16): the board-first list rendered 36 rows with 36
// dropdowns and 36 buttons — 88 targets across 5 screen-heights of scroll — to
// answer a question that is always about ONE taxonomy. The list is now 8 rows, and
// each row is the whole answer for that taxonomy: its boards as removable chips,
// plus one multi-select to add more.
//
// The user's unit of thought is "what measures reasoning_chain", not "where does
// `math` go". 22 of the 36 boards are 10 language slices, 8 industry slices and 4
// overall/meta cuts — not competing measurements — so they live in a collapsed
// disclosure instead of in the way.
function famLabel(fam) { return fam === 'agent' ? 'agent' : 'text'; }

// Group the flat mapping rows into one entry per taxonomy.
function taxGroups() {
  const cat = STATE.catalogue || {};
  const rows = cat.mapping || [];
  const byTax = {};
  rows.forEach(r => {
    const g = byTax[r.taxonomy] || (byTax[r.taxonomy] = {taxonomy: r.taxonomy, boards: []});
    g.boards.push(r);
  });
  // Order by the tab strip, so this list and the board tabs never disagree.
  const order = (STATE.tabs || []).map(t => t.taxonomy);
  return Object.values(byTax).sort((a, b) => {
    const ia = order.indexOf(a.taxonomy), ib = order.indexOf(b.taxonomy);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.taxonomy.localeCompare(b.taxonomy);
  });
}

function boardOptions() {
  const cat = STATE.catalogue || {};
  const all = [].concat(cat.mapped || [], cat.unmapped || []);
  // A board may feed several taxonomies, so it must be offered even when already
  // mapped elsewhere — the chips show which, and adding one is not a replacement.
  return all.slice().sort((a, b) =>
    (a.family === b.family ? 0 : a.family === 'agent' ? -1 : 1) ||
    a.board.localeCompare(b.board));
}

function renderTaxMap() {
  const wrap = document.getElementById('taxMap');
  if (!wrap) return;
  const cat = STATE.catalogue;
  if (!cat || (!cat.mapping && !(cat.mapped || []).length)) {
    wrap.innerHTML = '<div class="muted">No board catalogue yet — poll once and every ' +
      'LMArena board is stored here for mapping.</div>';
    renderUnused();
    return;
  }
  const groups = taxGroups();
  const opts = boardOptions();

  wrap.innerHTML = groups.map(g => {
    const chips = g.boards.map(b => `
      <span class="mm-chip" title="${esc(famLabel(b.family))} · ${b.stored_rows || 0} stored">
        ${esc(b.board)}
        <button class="mm-chip-x" data-tax="${esc(g.taxonomy)}" data-board="${esc(b.board)}"
          title="Stop ${esc(b.board)} measuring ${esc(g.taxonomy)}"
          aria-label="Unmap ${esc(b.board)} from ${esc(g.taxonomy)}">×</button>
      </span>`).join('');
    // ONE control per taxonomy instead of one per board, and it takes several at
    // once: `reasoning_chain` is fed by math + expert + hard_prompts_english, and
    // mapping those one dropdown at a time is the repetitiveness he named.
    const avail = opts.filter(o => !g.boards.some(b => b.board === o.board));
    const selOpts = avail.map(o =>
      `<option value="${esc(o.board)}">${esc(o.board)} · ${famLabel(o.family)} · ${o.models_matched} ours</option>`).join('');
    return `<div class="mm-tax">
      <div class="mm-tax-head">
        <span class="mm-tax-name mono">${esc(g.taxonomy)}</span>
        <span class="mm-tax-count">${g.boards.length} board${g.boards.length === 1 ? '' : 's'}</span>
      </div>
      <div class="mm-map">${chips || '<span class="muted">nothing measures this yet</span>'}</div>
      <div class="mm-add">
        <select class="form-input mm-sel" multiple size="3" data-tax="${esc(g.taxonomy)}"
          aria-label="Boards to add to ${esc(g.taxonomy)}">${selOpts}</select>
        <button class="btn btn-outline btn-sm mm-go" data-tax="${esc(g.taxonomy)}">Add</button>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.mm-go').forEach(btn => {
    btn.addEventListener('click', () => {
      const sel = wrap.querySelector(`.mm-sel[data-tax="${CSS.escape(btn.dataset.tax)}"]`);
      const boards = sel ? [...sel.selectedOptions].map(o => o.value) : [];
      mapBoards(btn.dataset.tax, boards);
    });
  });
  wrap.querySelectorAll('.mm-chip-x').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      unmapBoard(btn.dataset.tax, btn.dataset.board);
    });
  });
  renderUnused();
}

function renderUnused() {
  const host = document.getElementById('unusedBoards');
  const sum = document.getElementById('unusedSummary');
  if (!host) return;
  const cat = STATE.catalogue || {};
  const unused = cat.unmapped || [];
  if (sum) sum.textContent = `Unused LMArena boards (${unused.length})`;
  host.innerHTML = unused.slice().sort((a, b) => a.board.localeCompare(b.board)).map(b => `
    <div class="mm-unused-row">
      <span class="mono">${esc(b.board)}</span>
      <span class="muted">${famLabel(b.family)} · ${b.models_matched} ours · ${b.stored_rows || 0} stored</span>
    </div>`).join('');
}

// Add several boards to one taxonomy in ONE request each, then refresh once.
// Mapping is commutative and independent per pair, so a loop is honest here: if the
// third fails the first two stay mapped and the message says which failed.
async function mapBoards(tax, boards) {
  if (!boards.length) { mapMsg('Pick at least one board for ' + tax + '.', 'warn'); return; }
  mapMsg(`Mapping ${boards.length} board${boards.length === 1 ? '' : 's'} → ${tax}…`);
  const failed = [];
  let written = 0;
  for (const board of boards) {
    const r = await API.map({taxonomy: tax, board: board});
    if (r.error) { failed.push(board + ': ' + r.error); continue; }
    written += (r.published && r.published.written) || 0;
    if (r.tabs) STATE.tabs = r.tabs;
  }
  if (failed.length) {
    mapMsg(`Mapped, but ${failed.length} failed — ${failed.join('; ')}`, 'bad');
  } else {
    mapMsg(`${boards.length} board${boards.length === 1 ? '' : 's'} now measure ${tax}` +
      (written ? ` — ${written} rows published.` : ' — no stored rows yet.'), 'ok');
  }
  await refreshAfterMap(STATE.tabs);
}

async function unmapBoard(tax, board) {
  mapMsg('Unmapping ' + board + ' from ' + tax + '…');
  const r = await API.unmap(tax, board);
  if (r.error) { mapMsg('Unmap failed: ' + r.error, 'bad'); return; }
  mapMsg(`${board} no longer measures ${tax}` +
    (r.removed ? ` — ${r.removed} rows removed.` : '.'), 'ok');
  await refreshAfterMap(r.tabs);
}

async function refreshAfterMap(tabs) {
  if (tabs) STATE.tabs = tabs;
  await loadCatalogue();
  renderTabs();
  renderTaxList();
  if (STATE.tax) loadBoard(STATE.tax);
}

async function loadCatalogue() {
  try {
    STATE.catalogue = await API.catalogue();
  } catch (e) {
    STATE.catalogue = null;
  }
  renderTaxMap();
}

function mapMsg(text, tone) {
  const el = document.getElementById('mapMsg');
  if (!el) return;
  el.textContent = text || '';
  el.dataset.tone = tone || '';
}

function taxMsg(text, tone) {
  const el = document.getElementById('taxMsg');
  if (!el) return;
  el.textContent = text || '';
  el.dataset.tone = tone || '';
}

async function defineTaxonomy() {
  const name = (document.getElementById('taxName').value || '').trim();
  if (!name) { taxMsg('Name the taxonomy first.'); return; }
  const r = await API.taxonomy({action: 'define', name});
  if (r.error) { taxMsg('Error: ' + r.error); return; }
  document.getElementById('taxName').value = '';
  const tabs = await API.taxonomy();
  STATE.tabs = tabs.tabs || [];
  renderTabs();
  renderTaxList();
  taxMsg('Defined ' + r.taxonomy + '. Open its tab to add ratings.');
}

// ── CSV import: a real file chooser, not a paste box ───────────────────────
// Operator, 2026-11-15: "import csv should be a file import, the necessary
// columns should be shown below". The template carries the columns beside the
// chooser; this only reads the file and posts its text.
function readFileText(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ''));
    fr.onerror = () => reject(fr.error || new Error('could not read the file'));
    fr.readAsText(file);
  });
}

async function importTaxonomyCsv() {
  const input = document.getElementById('taxFile');
  const file = input && input.files && input.files[0];
  if (!file) { taxMsg('Choose a CSV file first.'); return; }
  let csv;
  try {
    csv = await readFileText(file);
  } catch (e) {
    taxMsg('Could not read ' + file.name + ': ' + e);
    return;
  }
  if (!csv.trim()) { taxMsg(file.name + ' is empty.'); return; }

  const btn = document.getElementById('taxImportBtn');
  if (btn) btn.disabled = true;
  taxMsg('Importing ' + file.name + '…');

  // The board selected in the tab strip is sent as the fallback taxonomy, so a
  // file whose rows carry no `taxonomy` column lands where the operator is
  // looking — but only when that board is one of his own.
  const fallback = (STATE.tax && String(STATE.tax).indexOf('custom:') === 0)
    ? STATE.tax.split(':', 2)[1] : null;
  const r = await API.taxonomy({action: 'import', csv: csv, taxonomy: fallback});
  if (btn) btn.disabled = false;
  if (r.error) { taxMsg('Import failed: ' + r.error); return; }

  const tabs = await API.taxonomy();
  STATE.tabs = tabs.tabs || [];
  renderTabs();
  renderTaxList();
  let msg = `Imported ${r.written} ratings from ${file.name}.`;
  if (r.skipped_unregistered) msg += ` Skipped ${r.skipped_unregistered} row(s) — that model is not served here.`;
  if (r.errors && r.errors.length) {
    msg += ` ${r.errors.length} line(s) rejected: ` +
      r.errors.slice(0, 3).map(e => 'line ' + e.line + ' ' + e.error).join('; ');
  }
  taxMsg(msg, r.written ? 'ok' : 'warn');
  if (r.written && r.taxonomy) {
    // Show what was just written rather than leaving him on a stale board.
    const want = r.taxonomy;
    if ((STATE.tabs || []).some(t => t.taxonomy === want)) selectTab(want);
  }
}

// The chosen file's name, so the control reports what it will import.
(function taxFileLabel() {
  const input = document.getElementById('taxFile');
  const label = document.getElementById('taxFileName');
  if (!input || !label) return;
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    // The native control already prints "No file chosen", so the helper line only
    // appears once there is a file — and then it carries the size too.
    if (!f) { label.hidden = true; label.textContent = ''; return; }
    const kb = f.size ? ` (${Math.max(1, Math.round(f.size / 1024))} KB)` : '';
    label.textContent = 'Selected: ' + f.name + kb;
    label.hidden = false;
  });
})();

// A template with the exact header, so nobody has to remember the column names.
document.getElementById('taxTemplateBtn').addEventListener('click', () => {
  const csv = 'model_slug,value,taxonomy,lab\n' +
    'glm-5.3-flash,1520,local-served,zai\n' +
    'kimi-k3,1508,local-served,moonshot\n';
  const blob = new Blob([csv], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'taxonomy-template.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
});

// ── wiring ─────────────────────────────────────────────────────────────────
// Top button SHOWS the pane; it does not poll. Operator: "only by user's 'Poll
// again' the repolling will happen" — so a stored set is displayed as-is and a
// fresh fetch needs the pane's own button.
document.getElementById('pollRunBtn').addEventListener('click', () => mpShow('poll'));
document.getElementById('taxOpenBtn').addEventListener('click', () => mpShow('tax'));
document.getElementById('mpClose').addEventListener('click', mpClose);
document.getElementById('mpBackdrop').addEventListener('click', mpHide);
document.getElementById('pollRunBtn2').addEventListener('click', runPoll);
document.getElementById('pollAgainBtn').addEventListener('click', runPoll);
document.getElementById('pollUpdateBtn').addEventListener('click', updatePoll);
document.getElementById('pollClearBtn').addEventListener('click', clearPoll);
document.getElementById('taxDefineBtn').addEventListener('click', defineTaxonomy);
document.getElementById('taxImportBtn').addEventListener('click', importTaxonomyCsv);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !MP_DESKTOP.matches) mpHide();
});

// Viewport flip: the lane re-appears on desktop, the sheet closes on mobile.
function mpSyncViewport(mq) {
  const panel = mpPanel();
  if (!panel) return;
  // Growing to desktop must not force the lane open over an operator who closed
  // it; it restores the lane only if the pane was already chosen.
  if (mq.matches && panel.dataset.pane) mpShow(panel.dataset.pane);
  else mpHide();
}
MP_DESKTOP.addEventListener('change', mpSyncViewport);
// A .open class can survive into a mobile document via a back/forward-cache
// restore; a fresh mobile load must show the BOARD, not a sheet over it.
if (!MP_DESKTOP.matches) mpHide();

// ── first paint ────────────────────────────────────────────────────────────
(async function initLeaderboard() {
  try {
    const t = await API.taxonomy();
    STATE.tabs = t.tabs || [];
    if (STATE.tabs.length) STATE.tax = STATE.tabs[0].taxonomy;
    renderTabs();
    renderTaxList();
    // The polled set is what THIS tab polled — read it from sessionStorage.
    // The server's staging table is not consulted on load: an operator who
    // reloaded the page must see the same review he was in the middle of, and a
    // server-side set nobody asked for would re-poll behind his back.
    loadPoll();
    renderPollPanel();
    await loadCatalogue();
    if (STATE.tax) await loadBoard(STATE.tax);
    else renderBoard({taxonomy: '', rows: [], eligible: t.eligible || []});
  } catch (e) {
    const note = document.getElementById('lbNote');
    if (note) note.textContent = 'Leaderboard unavailable: ' + e;
  }
  // Desktop default pane: MANAGE TAXONOMY (operator, 2026-11-15). The poll pane
  // is where you go when you intend to poll; the taxonomy manager is the part you
  // read and curate, so it is what the lane opens on. Mobile waits for a tap —
  // covering the board on load is the modal behaviour overview/conversations
  // both rejected.
  if (MP_DESKTOP.matches) mpShow('tax');
})();
</script>
