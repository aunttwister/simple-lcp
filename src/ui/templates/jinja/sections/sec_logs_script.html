{#- generated by the M2 merge — section: sec_logs_script
    Do not edit the block boundaries: this partial is included by a merged page
    (activity) inside a tab guard for the tab 'logs'. -#}

{% if tab == 'logs' %}
<script src="/static/js/logtable.js?v={{ cache_buster }}"></script>
<script>
/* ── The four log mounts ────────────────────────────────────────────────────
   Same module, four column specs. Ordering/pagination live on the server
   (sort= keys are an allow-list there), so every tab behaves identically. */
(function () {
  var esc = LCPTable.esc, num = LCPTable.num, ts = LCPTable.ts, latency = LCPTable.latency;
  var tab = {{ view.tab | tojson }};

  function chip(kind, label) {
    return '<span class="work-chip work-chip-' + kind + '">' + esc(label) + '</span>';
  }
  function cost(v) { return '$' + Number(v || 0).toFixed(4); }

  if (tab === 'requests') {
    LCPTable.mount({
      ids: {head: 'lg-head', body: 'lg-rows', pager: 'lg-pager', count: 'lg-count',
            controls: 'lg-controls', term: 'lg-term'},
      endpoint: '/api/work/requests',
      rowsKey: 'rows',
      noun: 'requests',
      termPrefix: 'requests',
      params: {{ {'view': 'requests'} | tojson }},
      empty: 'No requests match.',
      emptyHint: 'Requests appear here as calls complete. Clear the profile filter, or widen the sort.',
      // The requests view can enumerate the profiles that actually appear in
      // the log (filter.profiles), so the filter offers only real values.
      filters: [{param: 'profile', label: 'All profiles', chipLabel: 'Profile',
                 optionsKey: 'profiles'}],
      columns: [
        {key: 'timestamp', label: 'When', cell: function (r) {
          return '<span class="mono muted">' + esc(ts(r.timestamp)) + '</span>';
        }},
        {key: 'profile', label: 'Profile', cell: function (r) {
          return '<span class="work-actor">' + esc(r.profile) + '</span>';
        }},
        {key: 'model', label: 'Model', cell: function (r) {
          return '<span class="mono">' + esc(r.model) + '</span>';
        }},
        {key: 'provider', label: 'Provider', cell: function (r) { return esc(r.provider); }},
        {key: 'tokens', label: 'Tokens', num: true, sort: 'tokens', cell: function (r) {
          return num((r.prompt_tokens || 0) + (r.completion_tokens || 0));
        }},
        {key: 'cost', label: 'Cost', num: true, sort: 'cost', cell: function (r) { return cost(r.cost); }},
        {key: 'latency_ms', label: 'Latency', num: true, sort: 'latency', cell: function (r) {
          return latency(r.latency_ms);
        }},
        {key: 'success', label: 'Status', cell: function (r) {
          return r.success ? chip('ok', 'ok') : chip('error', r.error_type || 'error');
        }},
        {key: 'conversation_id', label: 'Conversation', cell: function (r) {
          if (!r.conversation_id) return '—';
          return '<a class="mono muted" href="/activity?tab=logs&amp;view=conversations&amp;qid=' +
            encodeURIComponent(r.conversation_id) + '">' +
            esc(String(r.conversation_id).slice(0, 10)) + '…</a>';
        }}
      ]
    });
  }

  if (tab === 'providers') {
    LCPTable.mount({
      ids: {head: 'lg-head', body: 'lg-rows', pager: 'lg-pager', count: 'lg-count',
            controls: 'lg-controls', term: 'lg-term'},
      endpoint: '/api/work/provider-decisions',
      rowsKey: 'rows',
      noun: 'provider routing decisions',
      termPrefix: 'provider decisions',
      params: {{ {'view': 'providers'} | tojson }},
      empty: 'No provider decisions match.',
      emptyHint: 'A decision is recorded every time the router picks a provider for a task.',
      columns: [
        {key: 'ts', label: 'When', cell: function (r) {
          return '<span class="mono muted">' + esc(ts(r.ts)) + '</span>';
        }},
        {key: 'profile', label: 'Profile', cell: function (r) {
          return '<span class="work-actor">' + esc(r.profile) + '</span>';
        }},
        {key: 'task', label: 'Task', cell: function (r) {
          return '<span class="task-chip">' + esc(r.task) + '</span>';
        }},
        {key: 'policy', label: 'Policy', cell: function (r) {
          return '<span class="mono">' + esc(r.policy) + '</span>';
        }},
        {key: 'action', label: 'Action', cell: function (r) {
          return '<span class="mono">' + esc(r.action) + '</span>';
        }},
        {key: 'provider', label: 'Provider', cell: function (r) { return esc(r.provider || '—'); }},
        {key: 'model', label: 'Model', cell: function (r) {
          return '<span class="mono">' + esc(r.model || '—') + '</span>';
        }},
        {key: 'score', label: 'Score', num: true, cell: function (r) {
          return r.score != null ? Number(r.score).toFixed(3) : '—';
        }},
        {key: 'note', label: 'Note', cell: function (r) {
          return '<span class="muted">' + esc(String(r.note || '').slice(0, 80)) + '</span>';
        }},
        {key: 'conversation_id', label: 'Conversation', cell: function (r) {
          if (!r.conversation_id) return '—';
          return '<span class="mono muted">' + esc(String(r.conversation_id).slice(0, 10)) + '…</span>';
        }}
      ]
    });
  }

})();
</script>
{% endif %}
