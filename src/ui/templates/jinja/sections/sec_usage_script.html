{% if tab == 'usage' %}
<script>
{% raw %}
// ── Cache controls (refresh on the Usage page) ───────────────────────────
function usageCacheStatus(msg) {
  var el = document.getElementById('usageCacheStatus');
  if (el) el.textContent = msg || '';
}
function usageCacheRefresh() {
  usageCacheStatus('Refreshing…');
  api('POST', '/api/settings/cache/refresh').then(function (d) {
    usageCacheStatus(d.ok ? 'Refreshing in background ✓' : ('Error: ' + (d.error || 'unknown')));
    setTimeout(function () { usageCacheStatus(''); }, 4000);
  }).catch(function (e) { usageCacheStatus('Error: ' + e.message); });
}

// ── Cache management (moved from Providers → Cache tab) ─────────────────
var SETTINGS = { ttl_minutes: 30, per_provider_ttl: {}, entries: [], refresh: {} };
var _justRefreshedKeys = new Set(); // "provider/kind" rows highlighted after a manual refresh
var _refreshTimer = null;

function fmtAge(sec) {
  if (sec == null) return '—';
  if (sec < 60) return Math.round(sec) + 's';
  if (sec < 3600) return (sec / 60).toFixed(1) + 'm';
  return (sec / 3600).toFixed(1) + 'h';
}

function fmtTime(iso) {
  if (!iso) return '—';
  return String(iso).replace('T', ' ').slice(0, 19);
}

const escC = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ══ Provider type — the axis this page is organised on ═══════════════════
// Every per-provider panel below is chosen by the provider's TYPE
// (`providerTypes` from base.html, resolved server-side from the declared
// `type` with name inference as the fallback), never by its literal name.
// That is what gives a second account of a vendor (`commandcode2`) and a
// second box of a kind (`local-zgx`, `local-sparks`, `llamacpp`) their
// family's panel instead of the generic one.
function pType(prov) {
  if (typeof providerTypeOf === 'function') {
    var t = providerTypeOf(prov);
    if (t) return t;
  }
  // Last-resort inference, for a page rendered without the server-side map
  // (or a fixture). Mirrors src/api/config.infer_provider_type().
  if (/^opencode/.test(prov)) return 'opencode';
  if (/^deepseek/.test(prov)) return 'deepseek';
  if (/^commandcode/.test(prov)) return 'commandcode';
  if (/^llamacpp|^local/.test(prov)) return 'local';
  return '';
}

var TYPE_NOTES = {
  commandcode: 'Vendor account — credits, allowance windows and usage as Command Code reports them.',
  opencode: 'Vendor account — credits, plan windows and console-reported usage.',
  deepseek: 'Vendor account — prepaid balance plus the gateway\u2019s own cache-hit savings.',
  local: 'Self-hosted engine — no credits and no allowance. Spend is $0; this panel shows the tokens served, '
       + 'the engine\u2019s own state, and what those tokens would have cost on a cloud lane.'
};

function typeBanner(prov) {
  var t = pType(prov);
  return '<div style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem">' +
      '<span style="display:inline-flex;align-items:center;padding:0.1rem 0.5rem;border:1px solid hsl(var(--card-border));'
      + 'border-radius:9999px;font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em">'
      + escC(typeof providerTypeLabel === 'function' ? providerTypeLabel(t) : (t || 'Unclassified')) + '</span>' +
      '<span style="font-size:0.65rem;color:hsl(var(--muted-foreground))">'
      + (TYPE_NOTES[t] || 'No type declared — set one on the Providers page to get this family\u2019s panel; '
         + 'the generic view is shown meanwhile.') + '</span>' +
    '</div>';
}

// The same three vendor payloads the vendor panels read, so "is there anything
// for this provider?" is asked the same way for a second account as for the first.
function vendorPayloadPresent(prov, summaries, subscriptions) {
  var t = pType(prov);
  if (t === 'deepseek') return hasOwn(summaries, prov);
  if (t === 'opencode' || t === 'commandcode') return hasOwn(subscriptions, prov);
  return true;
}
function hasOwn(obj, key) { return !!obj && Object.prototype.hasOwnProperty.call(obj, key); }

// Reference rates for the local panel's counterfactual. Stated in the panel on
// purpose: this is a comparison, not a measurement, and the rate it used is
// part of the number. Source: DeepSeek off-peak pricing, 2026-10-05.
var CLOUD_REF = {
  hit: 0.003, miss: 0.15, out: 0.60,
  label: 'DeepSeek-Flash off-peak rates ($0.003 / $0.15 / $0.60 per 1M)'
};

function fmtNum(v, digits) {
  if (v == null || isNaN(v)) return '\u2014';
  return Number(v).toFixed(digits == null ? 1 : digits);
}
function fmtGB(bytes) {
  if (bytes == null || isNaN(bytes)) return '\u2014';
  return (Number(bytes) / 1073741824).toFixed(2) + ' GB';
}
function statCard(label, value, sub) {
  return '<div class="stat-card"><div class="label">' + label + '</div><div class="value">' + value + '</div>'
    + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}
function engineCell(label, value, sub) {
  return '<div style="background:hsl(var(--background));border:1px solid hsl(var(--card-border));'
    + 'border-radius:var(--radius);padding:0.55rem 0.7rem">'
    + '<div class="label" style="margin-bottom:0.15rem">' + label + '</div>'
    + '<div style="font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums">' + value + '</div>'
    + (sub ? '<div class="sub" style="font-size:0.625rem">' + sub + '</div>' : '') + '</div>';
}
function stateDot(color) {
  return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(var(--' + color + '-fg))"></span>';
}

// ── The local engine strip ───────────────────────────────────────────────
// A cloud provider's card reads the vendor's billing API. A self-hosted engine
// has none, so the first thing this panel answers is "what is the box doing
// right now", read from the engine's own /health + /metrics through
// /api/providers/<name>/engine. Absent payload = the provider has no box in the
// gateway config; unreachable payload = the box is down and the strip says so
// while every gateway-side number below stays valid.
function engineStripHtml(prov, eng) {
  if (!eng) {
    return '<div class="stat-card" style="margin-bottom:1rem">'
      + '<div class="label">Engine</div>'
      + '<div class="value" style="font-size:0.85rem;font-weight:400">No engine to read — this provider is not in the gateway config.</div>'
      + '</div>';
  }
  if (!eng.reachable) {
    return '<div class="stat-card" style="border-left:3px solid #f97316;margin-bottom:1rem">'
      + '<div class="label" style="color:#f97316">Engine unreachable</div>'
      + '<div class="value" style="font-size:0.85rem;font-weight:400">' + escC(eng.engine || '')
      + ' &mdash; ' + escC(eng.error || 'no response') + '</div>'
      + '<div class="sub">Tokens, requests and the breakdowns below come from the gateway\u2019s own records and stay valid.</div>'
      + '<div style="margin-top:0.5rem"><button class="btn btn-outline btn-sm" onclick="refreshEngine(\'' + prov + '\')">Retry</button></div>'
      + '</div>';
  }
  var d = eng.derived || {};
  var state = d.ok ? (d.busy ? 'generating' : 'idle') : 'failed';
  var color = !d.ok ? 'red' : (d.busy ? 'amber' : 'green');
  var lanes = (d.lanes != null) ? String(d.lanes) : '\u2014';
  return '<div class="stat-card" style="margin-bottom:1rem">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:0.75rem;flex-wrap:wrap;margin-bottom:0.75rem">'
      + '<div class="label" style="margin:0">Engine &middot; ' + escC(eng.engine || '') + '</div>'
      + '<div style="display:flex;align-items:center;gap:0.6rem;font-size:0.65rem">'
        + '<span style="display:flex;align-items:center;gap:0.35rem">' + stateDot(color) + '<b>' + state + '</b></span>'
        + '<span class="muted">as of ' + escC(String(eng.fetched_at || '').replace('T', ' ').slice(0, 19)) + '</span>'
        + '<button class="btn btn-outline btn-sm" onclick="refreshEngine(\'' + prov + '\')">Refresh</button>'
      + '</div>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:0.5rem">'
      + engineCell('In flight', fmtNum(d.requests_running, 0), 'decoding or prefilling')
      + engineCell('Queued', fmtNum(d.requests_waiting, 0), 'held until a lane frees')
      + engineCell('Lanes', lanes, 'concurrent streams')
      + engineCell('Context', d.context_length != null ? formatTokens(d.context_length) : '\u2014', 'tokens per request')
      + engineCell('Model', escC((eng.declared_models || [])[0] || 'not declared'), 'declared on this provider')
      + engineCell('Served', formatTokens(d.requests_total || 0), 'requests since engine start')
    + '</div>'
    + '</div>';
}

window.refreshEngine = function (prov) {
  var host = document.getElementById('engineStrip-' + prov);
  if (!host) return;
  host.innerHTML = '<div class="stat-card" style="margin-bottom:1rem"><div class="label">Engine</div>'
    + '<div class="value" style="font-size:0.85rem;font-weight:400">Reading\u2026</div></div>';
  fetch('/api/providers/' + encodeURIComponent(prov) + '/engine')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { host.innerHTML = engineStripHtml(prov, d); })
    .catch(function () { host.innerHTML = engineStripHtml(prov, null); });
};

function loadEngine(prov) {
  if (pType(prov) !== 'local') return Promise.resolve(null);
  return fetch('/api/providers/' + encodeURIComponent(prov) + '/engine')
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; });
}


// ── Per-provider section collapse (persisted) ─────────────────────────────
function applyTtlCollapsed(collapsed) {
  const wrap = document.getElementById('ttlCollapse');
  const rows = document.getElementById('ttlRows');
  if (!wrap || !rows) return;
  wrap.classList.toggle('collapsed', collapsed);
  rows.style.display = collapsed ? 'none' : 'flex';
  wrap.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
}

function toggleTtlSection() {
  const wrap = document.getElementById('ttlCollapse');
  const collapsed = !wrap.classList.contains('collapsed');
  localStorage.setItem('lcp-cache-ttl-collapsed', collapsed ? '1' : '0');
  applyTtlCollapsed(collapsed);
}

(function () {
  var wrap = document.getElementById('ttlCollapse');
  if (!wrap) return;
  applyTtlCollapsed(localStorage.getItem('lcp-cache-ttl-collapsed') === '1');
  wrap.querySelector('.ttl-collapse-head').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleTtlSection();
    }
  });
})();

async function loadCacheSettings() {
  try {
    const d = await api('GET', '/api/settings');
    SETTINGS = d;
    document.getElementById('defaultTtlMinutes').value = d.ttl_minutes;
    renderTtlRows();
    renderCacheEntries();
  } catch (e) {
    document.getElementById('settingsStatus').textContent = 'Failed to load settings: ' + e.message;
  }
}

function renderTtlRows() {
  const rows = document.getElementById('ttlRows');
  const provs = new Set(Object.keys(SETTINGS.per_provider_ttl || {}));
  (window.configuredProviders || []).forEach(p => provs.add(p));
  (SETTINGS.entries || []).forEach(e => provs.add(e.provider));
  if (!provs.size) {
    rows.innerHTML = '<div class="form-help">No providers configured.</div>';
    return;
  }
  rows.innerHTML = [...provs].sort().map(p => {
    const cur = (SETTINGS.per_provider_ttl || {})[p];
    const input = cur != null ? cur : '';
    return '<div style="display:flex;align-items:center;gap:0.5rem">' +
      '<span class="mono" style="flex:1;font-size:0.75rem">' + escC(p) + '</span>' +
      '<input class="form-input ttl-min-input" data-prov="' + escC(p) + '" type="number" min="1" step="1" placeholder="default" value="' + input + '" style="width:90px;padding:0.3rem 0.5rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.75rem">' +
      '<button class="btn btn-outline btn-sm" onclick="saveProvTtl(\'' + escC(p) + '\')">Save</button>' +
      '<button class="btn btn-outline btn-sm" onclick="resetProvTtl(\'' + escC(p) + '\')">Reset</button>' +
      '</div>';
  }).join('');
}

async function saveProvTtl(p) {
  const input = document.querySelector('.ttl-min-input[data-prov="' + p + '"]');
  const v = parseInt(input.value, 10);
  const err = document.getElementById('settingsError');
  err.textContent = '';
  if (!v || v < 1) { err.textContent = 'Enter a refresh interval >= 1 minute for ' + p + '.'; return; }
  const d = await api('POST', '/api/settings', { provider: p, ttl_minutes: v });
  if (d.error) { err.textContent = d.error; return; }
  document.getElementById('settingsStatus').textContent = p + ' refreshes every ' + d.ttl_minutes + ' minute(s).';
  loadCacheSettings();
}

async function resetProvTtl(p) {
  const err = document.getElementById('settingsError');
  err.textContent = '';
  const d = await api('POST', '/api/settings', { provider: p });
  if (d.error) { err.textContent = d.error; return; }
  document.getElementById('settingsStatus').textContent = p + ' uses the default refresh interval.';
  loadCacheSettings();
}

function renderCacheEntries() {
  const rows = document.getElementById('cacheRows');
  const ents = SETTINGS.entries || [];
  if (!ents.length) {
    rows.innerHTML = '<tr><td colspan="5" class="empty">No cached entries yet — new providers are picked up on the next refresh cycle.</td></tr>';
    return;
  }
  rows.innerHTML = ents.map(e => {
    const key = e.provider + '/' + e.kind;
    const just = _justRefreshedKeys.has(key);
    const st = e.stale_error
      ? '<span class="badge badge-error" title="' + escC(e.stale_error) + '">stale</span>'
      : (just ? '<span class="badge badge-success">fresh · updated</span>' : '<span class="badge badge-success">fresh</span>');
    return '<tr' + (just ? ' class="cache-row-fresh"' : '') + '>' +
      '<td class="mono">' + escC(e.provider) + '</td>' +
      '<td class="mono">' + escC(e.kind) + '</td>' +
      '<td class="mono">' + fmtTime(e.fetched_at) + '</td>' +
      '<td class="mono">' + fmtAge(e.age_seconds) + '</td>' +
      '<td>' + st + '</td>' +
      '</tr>';
  }).join('');
}

async function saveTtl() {
  const err = document.getElementById('settingsError');
  const status = document.getElementById('settingsStatus');
  err.textContent = '';
  const v = parseInt(document.getElementById('defaultTtlMinutes').value, 10);
  if (!v || v < 1) { err.textContent = 'Enter a refresh interval >= 1 minute.'; return; }
  const d = await api('POST', '/api/settings', { ttl_minutes: v });
  if (d.error) { err.textContent = d.error; return; }
  status.textContent = 'Default saved — new providers refresh every ' + d.ttl_minutes + ' minute(s).';
  loadCacheSettings();
}

function setRefreshBusy(busy) {
  const btn = document.getElementById('refreshNowBtn');
  if (!btn) return;
  btn.disabled = busy;
  btn.textContent = busy ? 'Refreshing…' : 'Refresh now';
}

function refreshState(before, entries, timedOut) {
  // `before` maps "provider/kind" → {fetched_at, stale_error} captured before
  // the refresh was requested. Compare against the latest entries to decide
  // whether the background worker has actually re-scraped each entry.
  const after = {};
  (entries || []).forEach(e => { after[e.provider + '/' + e.kind] = e; });
  const keys = Object.keys(before);
  if (!keys.length) {
    const fresh = Object.keys(after);
    return { done: timedOut || fresh.length > 0, updated: fresh.length, failed: 0, timeout: timedOut, freshKeys: fresh };
  }
  let updated = 0, failed = 0, pending = 0;
  const freshKeys = [];
  keys.forEach(k => {
    const a = after[k];
    if (!a) { updated++; freshKeys.push(k); return; }
    const b = before[k];
    if (a.fetched_at && a.fetched_at > b.fetched_at) { updated++; freshKeys.push(k); }
    else if (a.stale_error) failed++;
    else pending++;
  });
  return { done: timedOut || pending === 0, updated, failed, timeout: timedOut, freshKeys };
}

async function refreshNow() {
  const status = document.getElementById('cacheStatus');
  if (_refreshTimer) { clearTimeout(_refreshTimer); _refreshTimer = null; }
  setRefreshBusy(true);
  _justRefreshedKeys = new Set();
  status.textContent = 'Refresh requested — scraping providers in the background…';

  try { await loadCacheSettings(); } catch (e) { /* keep going with what we have */ }

  const before = {};
  (SETTINGS.entries || []).forEach(e => {
    before[e.provider + '/' + e.kind] = { fetched_at: e.fetched_at || '', stale_error: e.stale_error || '' };
  });

  let d;
  try {
    d = await api('POST', '/api/settings/cache/refresh', {});
  } catch (e) {
    status.textContent = 'Refresh failed to start: ' + e.message;
    setRefreshBusy(false);
    return;
  }
  if (d.error) { status.textContent = d.error; setRefreshBusy(false); return; }

  // The worker re-scrapes in the background; poll until every cached entry has
  // a newer fetched_at (or failed) so the user gets real completion feedback.
  const deadline = Date.now() + 30000;
  const poll = async function () {
    let cur = null;
    try { cur = await api('GET', '/api/settings'); } catch (e) { /* keep polling */ }
    if (cur) { SETTINGS = cur; renderTtlRows(); renderCacheEntries(); }
    const st = refreshState(before, cur ? cur.entries : [], Date.now() >= deadline);
    if (!st.done) { _refreshTimer = setTimeout(poll, 1500); return; }
    _refreshTimer = null;
    setRefreshBusy(false);
    _justRefreshedKeys = new Set(st.freshKeys);
    renderCacheEntries();
    setTimeout(function () { _justRefreshedKeys = new Set(); }, 8000);
    const now = new Date().toLocaleTimeString();
    const bits = [];
    if (st.updated > 0) bits.push(st.updated + ' provider' + (st.updated === 1 ? '' : 's') + ' updated');
    if (st.failed > 0) bits.push(st.failed + ' failed');
    const suffix = bits.length ? ' (' + bits.join(', ') + ')' : '';
    if (st.timeout) {
      status.textContent = 'Refresh still running in the background — showing the latest data.' + suffix;
    } else if (!bits.length) {
      status.textContent = 'Refresh completed at ' + now + ' — no cached entries to update.';
    } else {
      status.textContent = 'Refresh completed at ' + now + suffix + '.';
    }
  };
  _refreshTimer = setTimeout(poll, 1200);
}

async function clearCache() {
  const status = document.getElementById('cacheStatus');
  status.textContent = 'Clearing cache…';
  const d = await api('POST', '/api/settings/cache/clear', {});
  if (d.error) { status.textContent = d.error; return; }
  _justRefreshedKeys = new Set();
  status.textContent = 'Cache cleared — background worker will re-scrape shortly.';
  setTimeout(loadCacheSettings, 800);
}

loadCacheSettings();
setInterval(loadCacheSettings, 15000);

// ── State ──
var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
window._tabState = {};
var INITIAL_DAYS = 7;
// Series stashed by the panel builder and drawn after the panels are in the
// DOM. A <pre> or <canvas> cannot be filled while it is still a string.
var _sparkSeries = {};
var _gaugeSeries = {};

// Draw the trend sparklines and the subscription gauges for every provider
// panel. Called once after panelsDiv.innerHTML, and again on a range change so
// a 7d -> 30d switch redraws the trend rather than leaving the 7d picture up.
function renderTrendAndGauges() {
  if (!window.LCPSpark) return;   // vendored module absent: leave the text empty
  Object.keys(_sparkSeries).forEach(function (prov) {
    var el = document.getElementById('spark-trend-' + prov);
    if (!el) return;
    var series = _sparkSeries[prov];
    var info = LCPSpark.mount(el, series, { mode: 'braille', width: 46 });
    var sumEl = document.getElementById('spark-sum-' + prov);
    if (!sumEl) return;
    if (!info) { sumEl.textContent = ''; return; }
    var isLocal = pType(prov) === 'local';
    var fmt = isLocal
      ? function (n) { return Math.round(n).toLocaleString() + ' tok'; }
      : function (n) { return '$' + n.toFixed(n < 1 ? 4 : 2); };
    sumEl.textContent = 'min ' + fmt(info.min) + ' · max ' + fmt(info.max) +
      ' · last ' + fmt(info.last) + ' · ' + info.points + ' points';
  });
  Object.keys(_gaugeSeries).forEach(function (canvasId) {
    var c = document.getElementById(canvasId);
    if (!c) return;
    LCPSpark.gauge(c, _gaugeSeries[canvasId], { size: 88, sub: 'used' });
  });
}
document.getElementById('genTime').textContent = new Date().toISOString().replace('T',' ').slice(0,19) + ' UTC';

function formatTokens(n) {
    if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return String(n);
}

function monthPct() {
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), 1);
    var end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    return ((now - start) / (end - start)) * 100;
}

function renderDailyChart(canvasId, daily, metric) {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return;
    metric = metric || 'cost';
    var labels = daily.map(function(d) { var p = d.date.split('-'); return p[2] + ' ' + (monthNames[parseInt(p[1])-1] || ''); });
    var values = daily.map(function(d) { return metric === 'tokens' ? (d.tokens || 0) : (d.cost || 0); });
    var isTokens = metric === 'tokens';
    window._charts = window._charts || {};
    window._charts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: isTokens ? 'Daily Tokens' : 'Daily Cost (USD)',
                data: values,
                backgroundColor: 'hsl(217 91% 60% / 0.6)',
                borderColor: 'hsl(217 91% 60%)',
                borderWidth: 1,
                borderRadius: 3,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: 'hsl(var(--muted-foreground))', maxTicksLimit: 15, font: { size: 10 } }, grid: { display: false } },
                y: { ticks: { color: 'hsl(var(--muted-foreground))', callback: function(v) { return isTokens ? formatTokens(v) : '$' + v.toFixed(2); }, font: { size: 10 } }, grid: { color: 'hsl(var(--card-border) / 0.3)' } }
            }
        }
    });
}

function renderBreakdownTable(containerId, data, labelKey, metric) {
    var el = document.getElementById(containerId);
    if (!el) return;
    metric = metric || 'cost';
    var isTokens = metric === 'tokens';
    // Sort by the display metric: cost (default) or token volume.
    var keys = Object.keys(data).sort(function(a,b) {
        if (isTokens) return (data[b].completion_tokens + data[b].prompt_tokens) - (data[a].completion_tokens + data[a].prompt_tokens);
        return data[b].cost - data[a].cost;
    });
    if (keys.length === 0) {
        el.innerHTML = '<div class="empty-state">No data for this period</div>';
        return;
    }
    var maxVal = 1;
    keys.forEach(function(k) {
        var v = isTokens ? (data[k].completion_tokens + data[k].prompt_tokens) : data[k].cost;
        if (v > maxVal) maxVal = v;
    });
    var html = '<table class="breakdown-table"><thead><tr><th scope="col">' + labelKey + '</th>' +
        (isTokens ? '' : '<th scope="col" class="cost-col">Cost</th>') +
        '<th scope="col" class="cost-col">Requests</th><th scope="col" class="cost-col">Tokens</th><th scope="col">Share</th></tr></thead><tbody>';
    keys.forEach(function(k) {
        var d = data[k];
        var v = isTokens ? (d.completion_tokens + d.prompt_tokens) : d.cost;
        var pct = maxVal > 0 ? ((v / maxVal) * 100) : 0;
        var barColor = maxVal > 0 && v === maxVal ? 'progress-blue' : 'progress-green';
        html += '<tr>' +
            '<td><b>' + k + '</b></td>' +
            (isTokens ? '' : '<td class="cost-col">$' + d.cost.toFixed(4) + '</td>') +
            '<td class="cost-col">' + d.requests + '</td>' +
            '<td class="cost-col">' + formatTokens(d.prompt_tokens + d.completion_tokens) + '</td>' +
            '<td style="width:120px"><div class="progress-bar"><div class="progress-fill ' + barColor + '" style="width:' + Math.round(pct) + '%"></div></div></td>' +
            '</tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
}

function loadStats(provider, days) {
    days = days || INITIAL_DAYS;
    return fetch('/api/usage/stats?provider=' + encodeURIComponent(provider) + '&days=' + days)
        .then(function(r) { return r.json(); });
}

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── Credentials (collapsible card in each vendor panel) ──
// Every credential helper takes the PROVIDER KEY, not the vendor name, and every
// element id is suffixed with it. That is what makes a second account of a
// vendor land on its own card and its own stored cookie instead of silently
// reusing the first account's field: `commandcode` and `commandcode2` each get
// their own input, and each read/write goes to /api/cost-plugins/cookie/<key>.
var _ocCredState = {};   // prov -> {cookie: bool, wsid: bool}
var _ccCredState = {};   // prov -> {cookie: bool}

function loadOcCredStatus(prov) {
    var key = prov || 'opencode';
    Promise.all([
        fetch('/api/cost-plugins/cookie/' + encodeURIComponent(key)).then(function(r){return r.json()}),
        fetch('/api/cost-plugins/workspace-id/' + encodeURIComponent(key)).then(function(r){return r.json()})
    ]).then(function(res){
        _ocCredState[key] = {cookie: !!res[0].has_cookie, wsid: !!res[1].has_workspace_id};
        updateOcCredSummary(key);
    }).catch(function () {});
}

function updateOcCredSummary(prov) {
    var key = prov || 'opencode';
    var st = _ocCredState[key] || {cookie: false, wsid: false};
    var el = document.getElementById('ocCredSummary_' + key);
    if (!el) return;
    if (st.cookie && st.wsid) {
        el.innerHTML = '<span class="badge badge-success">STORED</span>';
    } else if (st.cookie || st.wsid) {
        el.innerHTML = '<span class="badge badge-warning">partial</span>';
    } else {
        el.innerHTML = '<span class="badge" style="background:hsl(var(--secondary));color:hsl(var(--muted-foreground))">not set</span>';
    }
}

function toggleOcCreds(prov) {
    var body = document.getElementById('ocCredBody_' + (prov || 'opencode'));
    if (!body) return;
    var card = body.parentElement;
    var shown = body.style.display !== 'none';
    body.style.display = shown ? 'none' : 'block';
    if (shown) card.classList.remove('open'); else card.classList.add('open');
}

function saveOcCookie(prov) {
    var key = prov || 'opencode';
    var input = document.getElementById('ocCookieInput_' + key);
    var val = ((input && input.value) || '').trim();
    if (!val) { alert('Paste the auth cookie first.'); return; }
    if (val.indexOf('=') === -1) { alert('That looks like a bare token value. Paste the full name=value cookie, e.g. auth=...'); return; }
    fetch('/api/cost-plugins/cookie/' + encodeURIComponent(key), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cookie: val})
    }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) { if (input) input.value = ''; loadOcCredStatus(key); loadPage(); }
        else alert('Error: ' + (d.error || 'unknown'));
    });
}

function clearOcCookie(prov) {
    var key = prov || 'opencode';

        method: 'POST',
        headers: {'Content-Type': 'application/json'},

}

function loadPage() {
    var providers = configuredProviders || [];
    return buildPage(providers).catch(function(e) { console.error(e); });
}

function buildPage(providers) {
    return Promise.all([
        Promise.all(providers.map(function(p) { return loadStats(p, INITIAL_DAYS); })),
        loadSummaries(),
        loadSubscriptions(),
        loadBalances(),
        // Self-hosted providers are read from their own box (one request each,
        // only for type=local). A failure resolves to null and costs nothing.
        Promise.all(providers.map(function(p) { return loadEngine(p); }))
    ]).then(function(results) {
        var statsList = results[0];
        var summaries = results[1];
        var subscriptions = results[2];
        var balances = results[3];
        var engineList = results[4];

        // Shared helpers for subscription usage bars (opencode + commandcode)
        function barColor(pct) { return pct >= 90 ? 'red' : pct >= 70 ? 'orange' : pct >= 40 ? 'yellow' : 'green'; }
        function fmtCountdown(sec) {
            if (!sec || sec <= 0) return '';
            var d = Math.floor(sec / 86400);
            var h = Math.floor((sec % 86400) / 3600);
            var m = Math.floor((sec % 3600) / 60);
            var parts = [];
            if (d > 0) parts.push(d + 'd');
            if (h > 0) parts.push(h + 'h');
            if (m > 0 || parts.length === 0) parts.push(m + 'm');
            return parts.join(' ');
        }
        function fmtResetAt(sec) {
            if (!sec || sec <= 0) return '';
            var resetDate = new Date(Date.now() + sec * 1000);
            var mon = monthNames[resetDate.getMonth()];
            var day = resetDate.getDate();
            var h = String(resetDate.getHours()).padStart(2, '0');
            var min = String(resetDate.getMinutes()).padStart(2, '0');
            return mon + ' ' + day + ' ' + h + ':' + min;
        }

        var tabBar = document.getElementById('providerTabs');
        var panelsDiv = document.getElementById('providerPanels');
        var tabsHtml = '';
        var panelsHtml = '';

        // Cache configuration is a fixed first sub-tab, distinct from the
        // per-provider usage tabs.
        tabsHtml += '<button class="tab-btn" id="tabBtn-cache" onclick="switchTab(\'cache\')">Cache config</button>';
        panelsHtml += '';

        providers.forEach(function(prov, i) {
            var activeClass = i === 0 ? ' active' : '';
            tabsHtml += '<button class="tab-btn' + activeClass + '" onclick="switchTab(\'' + prov + '\')">' + providerDisplayName(prov) + '</button>';

            var stats = statsList[i] || {daily:[], by_model:{}, by_profile:{}, totals:{cost:0, requests:0}};
            var sum = summaries[prov];
            var panelId = 'panel-' + prov;
            var dailyChartId = 'chart-daily-' + prov;
            var modelTableId = 'table-model-' + prov;
            var profileTableId = 'table-profile-' + prov;
            // The TYPE decides which panel is built below (see pType above).
            var vType = pType(prov);
            var eng = engineList[i] || null;

            panelsHtml += '<div class="tab-panel' + activeClass + '" id="' + panelId + '">';

            // ── Type banner ──
            // States the family this panel belongs to and, for a provider with
            // no declared type, says so instead of silently showing the generic
            // view.
            panelsHtml += typeBanner(prov);

            // ── Engine strip (self-hosted only) ──
            if (vType === 'local') {
                panelsHtml += '<div id="engineStrip-' + prov + '">' + engineStripHtml(prov, eng) + '</div>';
            }

            // ── Trend card ──
            // Every provider panel gets its daily series as a text sparkline.
            // It is built from `stats.daily`, which this page already fetched,
            // so it costs no extra request and no new dependency. The series is
            // stashed in _sparkSeries and mounted after innerHTML, because a
            // canvas/pre cannot be drawn into a string.
            var isLocalProv = vType === 'local';
            var trendSeries = (stats.daily || []).map(function (d) {
                return isLocalProv ? (d.tokens || 0) : (d.cost || 0);
            });
            _sparkSeries[prov] = trendSeries;
            var trendUnit = isLocalProv ? 'tokens/day' : 'USD/day';
            var trendName = isLocalProv ? 'Daily tokens' : 'Daily spend';
            panelsHtml += '<div class="stat-cards" style="margin-bottom:1rem">' +
                '<div class="stat-card" style="grid-column:1/-1">' +
                  '<div class="label">' + trendName + ' · last ' + trendSeries.length + ' days</div>' +
                  '<pre class="spark" id="spark-trend-' + prov + '" aria-label="' + trendName + ' trend, ' + trendSeries.length + ' days"></pre>' +
                  '<div class="spark-sum" id="spark-sum-' + prov + '"></div>' +
                '</div>' +
              '</div>';

            // A vendor family with no payload for THIS account: the vendor
            // readers are registered per vendor, so a second account of a
            // vendor shows nothing rather than an error. Say it here, once,
            // instead of leaving a credentials card that reads like a failure.
            if (vType && vType !== 'local' && !vendorPayloadPresent(prov, summaries, subscriptions)) {
                panelsHtml += '<div class="stat-card" style="margin-bottom:1rem">' +
                    '<div class="label">No vendor payload for <b>' + escC(prov) + '</b> yet</div>' +
                    '<div class="value" style="font-size:0.85rem;font-weight:400">The vendor readers are registered per vendor name (opencode / deepseek / commandcode), so this account\u2019s own credential is not being read — credits, allowance and vendor-reported usage are unavailable for it. Traffic, tokens and cost below come from the gateway\u2019s own rows and are complete.</div>' +
                    '</div>';
            }

            if (vType === 'deepseek') {
                var bal = (sum && sum.balance) ? sum.balance : {};
                var available = bal.available || 0;
                var spent = bal.spent;
                var topped = bal.topped_up || 0;
                var granted = bal.total_granted || 0;
                var cache = stats.cache || {hit_tokens:0, miss_tokens:0, savings:0};
                var cacheTotal = cache.hit_tokens + cache.miss_tokens;
                var cacheRate = cacheTotal > 0 ? (cache.hit_tokens / cacheTotal * 100) : 0;

                var statCardsHtml = '<div class="stat-card"><div class="label">Available Balance</div><div class="value">$' + available.toFixed(2) + '</div><div class="sub">' + (bal.currency || 'USD') + '</div></div>' +
                    '<div class="stat-card"><div class="label">Total Spent (API)</div><div class="value">' + (spent != null ? '$' + spent.toFixed(2) : '\u2014') + '</div><div class="sub">topped $' + topped.toFixed(2) + ' + granted $' + granted.toFixed(2) + '</div></div>';
                if (cacheTotal > 0) {
                    statCardsHtml += '<div class="stat-card"><div class="label">Cache Hit Rate</div><div class="value">' + cacheRate.toFixed(1) + '%</div><div class="sub">' + formatTokens(cache.hit_tokens) + ' hit / ' + formatTokens(cache.miss_tokens) + ' miss</div></div>' +
                        '<div class="stat-card"><div class="label">Cache Savings</div><div class="value">$' + cache.savings.toFixed(4) + '</div><div class="sub">from cache-hit discount</div></div>';
                }
                panelsHtml += '<div class="stat-cards">' + statCardsHtml + '</div>';
            } else if (vType === 'opencode') {
                var sub = subscriptions[prov] || {};
                // ── Collapsible credentials card ──
                panelsHtml += '<div class="stat-card ov-collapse-card" style="margin-bottom:1rem">' +
                    '<div class="label ov-collapse-trigger" onclick="toggleOcCreds(\'' + prov + '\')" style="display:flex;justify-content:space-between;align-items:center">Credentials' +
                    '<span style="display:flex;align-items:center;gap:0.5rem;font-weight:400">' +
                    '<span id="ocCredSummary_' + prov + '" style="font-size:0.65rem">…</span>' +
                    '<span class="ov-collapse-chevron" id="ocCredChevron_' + prov + '">▾</span>' +
                    '</span></div>' +
                    '<div class="ov-collapse-body" id="ocCredBody_' + prov + '" style="display:none;margin-top:0.75rem;border-top:1px solid hsl(var(--card-border));padding-top:0.75rem">' +
                    '<div class="oc-cred-row"><label>Cookie</label>' +
                    '<input type="password" id="ocCookieInput_' + prov + '" placeholder="auth=... (full name=value cookie)" autocomplete="off" style="flex:1;padding:0.375rem 0.5rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.75rem">' +
                    '<button class="btn-sm btn-primary" onclick="saveOcCookie(\'' + prov + '\')">Save</button>' +
                    '<button class="btn-sm" onclick="clearOcCookie(\'' + prov + '\')">Clear</button>' +
                    '</div>' +
                    '<div class="oc-cred-row"><label>Workspace</label>' +
                    '<input type="text" id="ocWsIdInput_' + prov + '" placeholder="wrk_..." autocomplete="off" style="flex:1;padding:0.375rem 0.5rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.75rem">' +
                    '<button class="btn-sm btn-primary" onclick="saveOcWsId(\'' + prov + '\')">Save</button>' +
                    '<button class="btn-sm" onclick="clearOcWsId(\'' + prov + '\')">Clear</button>' +
                    '</div>' +
                    '<div style="font-size:0.625rem;color:hsl(var(--muted-foreground));margin-top:0.5rem">Stored encrypted. The <b>API key</b> on the Providers page (Console: Keys, <b>Expiration: Never</b>) is the durable credential and carries the usage totals. This cookie and the Workspace ID are <b>not</b> read by the cost card &mdash; they only feed model discovery; the card&rsquo;s fallback is the <b>console session</b> (Providers page &rarr; Authorise), which is a rotating one-shot refresh token that dies whenever a refresh token is replayed. <b>Credits and budgets are person-only on this console</b> &mdash; they refuse every API key, so only a live console session can read them.</div>' +
                    '</div>' +
                    '</div>';
                if (sub._error) {
                    var errMsg = 'OpenCode subscription API error: ' + (sub.detail || 'unknown');
                    if (sub._error === 'permission_denied') {
                        errMsg = 'OpenCode usage unavailable — every stored credential was refused with HTTP 403. Credits and budgets are person-only on this console (the API key still reads usage), so re-authorise the console session from the Providers page.';
                    } else if (sub._error === 'auth_failed') {
                        errMsg = 'OpenCode usage data unavailable — no stored credential can read the console. Paste an API key (Console: Keys, Expiration: Never) on the Providers page, or re-authorise the console session.';
                    }
                    panelsHtml += '<div class="stat-card" style="border-left:3px solid #f97316;margin-bottom:1rem"><div class="label" style="color:#f97316">⚠ Subscription Status</div><div class="value" style="font-size:0.85rem;font-weight:400">' + errMsg + '</div></div>';
                }

                // ── Available credits (from the billing page) ──
                var ocbal = balances[prov] || {};
                if (ocbal.balance != null) {
                    var ocPlan = ocbal.plan ? ' · ' + esc(ocbal.plan) : '';
                    panelsHtml += '<div class="stat-card" style="margin-bottom:1rem"><div class="label">Available Credits</div><div class="value">$' + ocbal.balance.toFixed(2) + '</div><div class="sub">' + (ocbal.currency || 'USD') + ocPlan + (ocbal._stale ? ' · stale' : '') + '</div></div>';
                } else if (ocbal._error) {
                    panelsHtml += '<div class="stat-card" style="border-left:3px solid #f97316;margin-bottom:1rem"><div class="label" style="color:#f97316">⚠ Credits Status</div><div class="value" style="font-size:0.85rem;font-weight:400">' + esc(ocbal.detail || ocbal._error) + '</div></div>';
                }

                // ── Vendor usage (console-reported) ──
                // This account carries no plan ceiling, so there is no percentage
                // to draw: show the vendor's real numbers instead of a bar.
                if (sub.total_cost_usd != null || sub.total_requests != null) {
                    var fmtTok = function (n) {
                        if (!n) { return '0'; }
                        if (n >= 1e9) { return (n / 1e9).toFixed(2) + 'B'; }
                        if (n >= 1e6) { return (n / 1e6).toFixed(1) + 'M'; }
                        if (n >= 1e3) { return (n / 1e3).toFixed(1) + 'K'; }
                        return String(n);
                    };
                    panelsHtml += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:0.75rem;margin-bottom:1rem">' +
                        (sub.month_to_date_usd != null
                            ? '<div class="stat-card"><div class="label">Monthly Spend (' + esc(sub.month_label || 'month') + ')</div><div class="value">$' + (sub.month_to_date_usd || 0).toFixed(2) + '</div><div class="sub">console-reported</div></div>' +
                              '<div class="stat-card"><div class="label">Monthly Requests</div><div class="value">' + (sub.month_requests || 0).toLocaleString() + '</div><div class="sub">this month</div></div>'
                            : '') +
                        '<div class="stat-card"><div class="label">Vendor Cost (' + esc(sub.range || '7d') + ')</div><div class="value">$' + (sub.total_cost_usd || 0).toFixed(2) + '</div><div class="sub">console-reported</div></div>' +
                        '<div class="stat-card"><div class="label">Vendor Requests</div><div class="value">' + (sub.total_requests || 0).toLocaleString() + '</div><div class="sub">' + esc(sub.range || '7d') + '</div></div>' +
                        '<div class="stat-card"><div class="label">Cache Reads</div><div class="value">' + fmtTok(sub.total_cache_read_tokens) + '</div><div class="sub">' + esc(sub.range || '7d') + '</div></div>' +
                        '</div>' +
                        (sub.limit_available === false
                            ? '<div style="font-size:0.625rem;color:hsl(var(--muted-foreground));margin-bottom:1rem">OpenCode is prepaid pay-as-you-go with no monthly allowance, so there is no percentage to fill: usage is capped only by the credit balance above.</div>'
                            : '') +
                        (sub.last_activity_date
                            ? '<div style="font-size:0.625rem;color:hsl(var(--muted-foreground));margin-bottom:1rem">Last vendor-recorded usage on this workspace: <b>' + esc(sub.last_activity_date) + '</b>' + (sub.days_since_activity != null ? ' (' + sub.days_since_activity + ' days ago)' : '') + ' &mdash; an empty window above means no traffic, not a failed fetch.</div>'
                            : '');
                }

                // ── Plan status ──
                // The Go plan reports an exhausted quota as status:"rate-limited"
                // at percent 100.  Scope it to the route it applies to: the Go
                // window is enforced on /zen/go/v1 only, while LCP's provider
                // config points at /inference/openai/v1 (verified answering 200
                // while the Go month read 100%), so the card must not read as
                // "the gateway is being refused".
                var ocLimited = ['rolling', 'weekly', 'monthly'].filter(function (w) {
                    return sub[w + '_status'] && sub[w + '_status'] !== 'ok';
                });
                if (ocLimited.length) {
                    panelsHtml += '<div class="stat-card" style="border-left:3px solid #f97316;margin-bottom:1rem"><div class="label" style="color:#f97316">Go plan quota exhausted</div><div class="value" style="font-size:0.85rem;font-weight:400">OpenCode Go is refusing calls on ' + esc(ocLimited.join(', ')) + ' — on the /zen/go/v1 route only. LCP calls /inference/openai/v1, which still answers, so this is not blocking gateway traffic.</div></div>';
                }

                // ── Subscription windows ──
                // A radial gauge per window instead of a flat fill bar: the
                // percentage is a share of a fixed allowance, which is exactly
                // what a dial communicates. The numeric percentage stays as
                // text beside the canvas, so nothing depends on the canvas
                // rendering (aria-hidden on the canvas, value in .bar-pct).
                var barsHtml = '';
                var gaugeWindows = [
                    { key: 'rolling', label: 'Rolling (5h)' },
                    { key: 'weekly', label: 'Weekly' },
                    { key: 'monthly', label: 'Monthly' }
                ];
                gaugeWindows.forEach(function (w) {
                    if (sub[w.key + '_pct'] == null) return;
                    var pct = sub[w.key + '_pct'];
                    var resetSec = sub[w.key + '_reset_sec'];
                    var canvasId = 'gauge-' + prov + '-' + w.key;
                    _gaugeSeries[canvasId] = pct;
                    var legend = fmtCountdown(resetSec)
                        ? 'resets in <b>' + fmtCountdown(resetSec) + '</b>'
                        : 'no reset reported';
                    var at = fmtResetAt(resetSec);
                    if (at) legend += '<br>at <b>' + at + '</b>';
                    barsHtml += '<div class="usage-bar-item usage-gauge-item">' +
                        '<div class="gauge-head"><span class="bar-label">' + w.label + '</span>' +
                        '<span class="bar-pct">' + pct.toFixed(0) + '%</span></div>' +
                        '<div class="gauge-body">' +
                          '<canvas id="' + canvasId + '" aria-hidden="true"></canvas>' +
                          '<div class="gauge-legend">' + legend + '</div>' +
                        '</div>' +
                      '</div>';
                });
                if (barsHtml) {
                    panelsHtml += '<div class="usage-bars">' + barsHtml + '</div>';
                }

                // ── v2 member-budget rules (configuration, not spend) ──
                // Shared / model-specific policy rules, listed by the console
                // only on /api/v2/budgets/members.  The payload carries no
                // measured spend against them, so they are shown as config —
                // never as a percentage bar.
                var ocRules = sub.budget_rules || [];
                if (ocRules.length) {
                    panelsHtml += '<div class="stat-card" style="margin-bottom:1rem"><div class="label">Member budget rules (' + ocRules.length + ')</div><div class="sub">' +
                        ocRules.map(function (r) {
                            var lim = (r.limit_usd != null) ? '$' + Number(r.limit_usd).toFixed(2) : 'no limit';
                            var per = r.per ? ' / ' + esc(String(r.per)) : '';
                            var tgt = r.selector ? ' · ' + esc(String(r.selector)) : '';
                            return esc(String(r.audience || 'rule')) + ': ' + lim + ' · ' + esc(String(r.scope || '')) + per + tgt;
                        }).join('<br>') +
                        '</div><div class="sub" style="font-size:0.625rem">Shared and model-specific caps apply independently of the member cap above.</div></div>';
                }
            } else if (vType === 'commandcode') {
                var ccsub = subscriptions[prov] || {};
                // ── Collapsible credentials card (cookie only) ──
                panelsHtml += '<div class="stat-card ov-collapse-card" style="margin-bottom:1rem">' +
                    '<div class="label ov-collapse-trigger" onclick="toggleCcCreds(\'' + prov + '\')" style="display:flex;justify-content:space-between;align-items:center">Credentials' +
                    '<span style="display:flex;align-items:center;gap:0.5rem;font-weight:400">' +
                    '<span id="ccCredSummary_' + prov + '" style="font-size:0.65rem">…</span>' +
                    '<span class="ov-collapse-chevron" id="ccCredChevron_' + prov + '">▾</span>' +
                    '</span></div>' +
                    '<div class="ov-collapse-body" id="ccCredBody_' + prov + '" style="display:none;margin-top:0.75rem;border-top:1px solid hsl(var(--card-border));padding-top:0.75rem">' +
                    '<div class="oc-cred-row"><label>Cookie</label>' +
                    '<input type="password" id="ccCookieInput_' + prov + '" placeholder="__Secure-...session_token=... (full name=value cookie)" autocomplete="off" style="flex:1;padding:0.375rem 0.5rem;background:hsl(var(--background));border:1px solid hsl(var(--card-border));border-radius:var(--radius);color:hsl(var(--foreground));font-size:0.75rem">' +
                    '<button class="btn-sm btn-primary" onclick="saveCcCookie(\'' + prov + '\')">Save</button>' +
                    '<button class="btn-sm" onclick="clearCcCookie(\'' + prov + '\')">Clear</button>' +
                    '</div>' +
                    '<div style="font-size:0.625rem;color:hsl(var(--muted-foreground));margin-top:0.5rem">Stored encrypted, keyed by provider name (' + escC(prov) + ') — a second account of this vendor keeps its own cookie. Pasting one enables credits + usage tracking from api.commandcode.ai for <b>' + escC(prov) + '</b>.</div>' +
                    '</div>' +
                    '</div>';
                if (ccsub._error) {
                    var ccErrMsg = ccsub._error === 'auth_failed'
                        ? 'Command Code credits unavailable — cookie missing or invalid. Paste the session cookie above to enable usage tracking.'
                        : 'Command Code credits API error: ' + (ccsub.detail || 'unknown');
                    panelsHtml += '<div class="stat-card" style="border-left:3px solid #f97316;margin-bottom:1rem"><div class="label" style="color:#f97316">⚠ Subscription Status</div><div class="value" style="font-size:0.85rem;font-weight:400">' + ccErrMsg + '</div></div>';
                } else if (ccsub.monthly_credits_remaining != null) {
                    var ccPlanCard = '';
                    if (ccsub.plan_id) {
                        ccPlanCard = '<div class="stat-card"><div class="label">Plan</div><div class="value" style="font-size:1.1rem">' + ccsub.plan_id + '</div><div class="sub">' + (ccsub.plan_status || '') + '</div></div>';
                    }
                    panelsHtml += '<div class="stat-cards">' +
                        '<div class="stat-card"><div class="label">Monthly Credits</div><div class="value">$' + ccsub.monthly_credits_remaining.toFixed(2) + '</div><div class="sub">remaining this month</div></div>' +
                        '<div class="stat-card"><div class="label">Purchased</div><div class="value">$' + ccsub.purchased_credits.toFixed(2) + '</div><div class="sub">top-up / pay-as-you-go</div></div>' +
                        ccPlanCard +
                        '</div>';

                    // Usage totals from Command Code's own usage page.
                    var ccTotals = ccsub.usage_summary || {};
                    if (ccTotals.total_tokens != null || ccTotals.total_runs != null) {
                        var ccTotalCards = '';
                        if (ccTotals.total_tokens != null) {
                            ccTotalCards += '<div class="stat-card"><div class="label">Total Tokens</div><div class="value">' + formatTokens(ccTotals.total_tokens) + '</div><div class="sub">billing period</div></div>';
                        }
                        if (ccTotals.total_runs != null) {
                            ccTotalCards += '<div class="stat-card"><div class="label">Total Runs</div><div class="value">' + ccTotals.total_runs.toLocaleString() + '</div><div class="sub">' + (ccTotals.failed_runs || 0) + ' failed</div></div>';
                        }
                        if (ccTotals.total_monthly_credits != null) {
                            ccTotalCards += '<div class="stat-card"><div class="label">Monthly Usage</div><div class="value">$' + ccTotals.total_monthly_credits.toFixed(2) + '</div><div class="sub">billing period</div></div>';
                        }
                        if (ccTotalCards) {
                            panelsHtml += '<div class="stat-cards">' + ccTotalCards + '</div>';
                        }
                    }

                    var ccBars = '';
                    // Same radial-gauge treatment as the OpenCode panel, driven
                    // by Command Code's own five-hour / weekly / monthly caps.
                    // `> 0` on monthly is kept from the old bar: a plan with no
                    // monthly cap configured must not draw a 0% dial.
                    var ccWindows = [
                        { key: 'five_hour', label: 'Rolling (5h)', pct: ccsub.five_hour_pct, reset: ccsub.five_hour_reset_sec, always: false },
                        { key: 'weekly', label: 'Weekly', pct: ccsub.weekly_pct, reset: ccsub.weekly_reset_sec, always: false },
                        { key: 'monthly', label: 'Monthly', pct: ccsub.monthly_pct, reset: ccsub.monthly_reset_sec, always: true }
                    ];
                    ccWindows.forEach(function (w) {
                        if (w.pct == null) return;
                        if (w.key === 'monthly' && !(w.pct > 0)) return;
                        var canvasId = 'gauge-cc-' + prov + '-' + w.key;
                        _gaugeSeries[canvasId] = w.pct;
                        var legend = fmtCountdown(w.reset)
                            ? 'resets in <b>' + fmtCountdown(w.reset) + '</b>'
                            : 'no reset reported';
                        var at = fmtResetAt(w.reset);
                        if (at) legend += '<br>at <b>' + at + '</b>';
                        var used = w.key === 'monthly' ? ccsub.monthly_used : (w.key === 'weekly' ? ccsub.weekly_used : ccsub.five_hour_used);
                        var cap = w.key === 'monthly' ? ccsub.monthly_cap : (w.key === 'weekly' ? ccsub.weekly_cap : ccsub.five_hour_cap);
                        if (used != null && cap != null) {
                            legend += '<br>$<b>' + Number(used).toFixed(2) + '</b> of $<b>' + Number(cap).toFixed(2) + '</b>';
                        }
                        ccBars += '<div class="usage-bar-item usage-gauge-item">' +
                            '<div class="gauge-head"><span class="bar-label">' + w.label + '</span>' +
                            '<span class="bar-pct">' + w.pct.toFixed(0) + '%</span></div>' +
                            '<div class="gauge-body">' +
                              '<canvas id="' + canvasId + '" aria-hidden="true"></canvas>' +
                              '<div class="gauge-legend">' + legend + '</div>' +
                            '</div>' +
                          '</div>';
                    });
                    if (ccBars) {
                        panelsHtml += '<div class="usage-bars">' + ccBars + '</div>';
                    }
                }
            } else if (vType === 'local') {
                // ── Local panel ──
                // A self-hosted engine has no credits, no allowance and no
                // vendor bill, so the money cards are replaced rather than
                // zeroed: marginal cost is $0 by construction, and the only
                // figure that means anything in money is what these tokens
                // would have cost on a cloud lane.
                var lt = stats.totals || {};
                var lcache = stats.cache || {hit_tokens: 0, miss_tokens: 0};
                var engD = (eng && eng.reachable && eng.derived) ? eng.derived : null;
                var hitT = lcache.hit_tokens || 0;
                var missT = lcache.miss_tokens || 0;
                var outT = lt.completion_tokens || 0;
                var cloudEq = (hitT / 1e6) * CLOUD_REF.hit + (missT / 1e6) * CLOUD_REF.miss + (outT / 1e6) * CLOUD_REF.out;
                var cacheTot = hitT + missT;
                var hitPct = cacheTot > 0 ? (hitT / cacheTot * 100) : null;
                panelsHtml += '<div class="stat-cards">' +
                    statCard('Marginal cost', '$0.00', 'own hardware — no credits, no allowance') +
                    statCard('Cloud equivalent', '$' + cloudEq.toFixed(2), 'these tokens on the reference rate below') +
                    statCard('Tokens served', formatTokens(lt.tokens || 0), (lt.requests || 0).toLocaleString() + ' requests') +
                    statCard('Tokens in / out', formatTokens(lt.prompt_tokens || 0) + ' / ' + formatTokens(outT), 'prompt / completion') +
                    (hitPct != null ? statCard('Prompt cache hit', hitPct.toFixed(1) + '%', formatTokens(hitT) + ' of ' + formatTokens(cacheTot)) : '') +
                  '</div>';
                if (engD) {
                    // The engine's own throughput and capacity, which the
                    // gateway cannot measure (see the note below).
                    panelsHtml += '<div class="stat-cards">' +
                        statCard('Decode', fmtNum(engD.decode_tokens_per_s) + ' tok/s', 'engine lifetime average') +
                        statCard('Prefill', fmtNum(engD.prefill_tokens_per_s, 0) + ' tok/s', 'engine lifetime average') +
                        statCard('Draft accept', engD.mtp_accept_pct != null ? fmtNum(engD.mtp_accept_pct) + '%' : '\u2014', 'speculative tokens kept') +
                        statCard('KV pool used', engD.pool_used_pct != null ? fmtNum(engD.pool_used_pct) + '%' : '\u2014', 'shared attention pool') +
                        statCard('Kept prompt cache', engD.kept_cap_used_pct != null ? fmtNum(engD.kept_cap_used_pct) + '%' : '\u2014', fmtGB(engD.kept_bytes) + ' of ' + fmtGB(engD.kept_bytes_cap)) +
                      '</div>';
                }
                panelsHtml += '<div style="font-size:0.625rem;color:hsl(var(--muted-foreground));margin-bottom:1rem">' +
                    'Cost is $0 by construction (own hardware); every cost axis below is replaced by tokens. The cloud-equivalent figure is a counterfactual at '
                    + CLOUD_REF.label + ' — a comparison, not spend. Engine figures are cumulative since the engine started, not per window. '
                    + 'Throughput is read from the engine\u2019s own counters because the gateway\u2019s latency column is a single HTTP hop and, for a streamed reply, '
                    + 'records time to first byte — it cannot measure local tokens/second.' +
                    '</div>';
            } else {
                panelsHtml += '<div class="stat-cards">' +
                    '<div class="stat-card"><div class="label">Gateway Spend (30d)</div><div class="value">$' + stats.totals.cost.toFixed(4) + '</div><div class="sub">' + stats.totals.requests + ' requests</div></div>' +
                    '</div>';
            }

            panelsHtml += '<div class="date-filters" id="dateFilt-' + prov + '">' +
                '<button class="date-pill active" data-range="7" onclick="applyDateRange(this,\'' + prov + '\',7)">7 days</button>' +
                '<button class="date-pill" data-range="30" onclick="applyDateRange(this,\'' + prov + '\',30)">30 days</button>' +
                '<button class="date-pill" data-range="month" onclick="applyDateRange(this,\'' + prov + '\',\'month\')">This month</button>' +
                '<button class="date-pill" data-range="last" onclick="applyDateRange(this,\'' + prov + '\',\'last\')">Last month</button>' +
                '<input class="date-pill-input" type="date" id="dsFrom-' + prov + '" title="Start">' +
                '<input class="date-pill-input" type="date" id="dsTo-' + prov + '" title="End">' +
                '<button class="date-pill" data-range="custom" onclick="applyDateRange(this,\'' + prov + '\',\'custom\')">Apply</button>' +
                '</div>';

            panelsHtml += '<div class="chart-wrap"><h3 style="font-size:0.85rem;margin-bottom:0.5rem" id="chartTitle-' + prov + '">' + (isLocalProv ? 'Daily Tokens (7 days)' : 'Daily Spending (7 days)') + '</h3><div style="height:250px"><canvas id="' + dailyChartId + '"></canvas></div></div>';

            panelsHtml += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">' +
                '<div class="chart-wrap"><h3 style="font-size:0.85rem;margin-bottom:0.5rem">By Model</h3><div id="' + modelTableId + '"></div></div>' +
                '<div class="chart-wrap"><h3 style="font-size:0.85rem;margin-bottom:0.5rem">By Profile</h3><div id="' + profileTableId + '"></div></div>' +
                '</div>';

            panelsHtml += '</div>';
        });

        tabBar.innerHTML = tabsHtml;
        panelsDiv.innerHTML = panelsHtml;

        providers.forEach(function(prov, i) {
            var stats = statsList[i] || {daily:[], by_model:{}, by_profile:{}};
            var isLocal = pType(prov) === 'local';
            // Initialize per-tab state on first load
            window._tabState[prov] = { range: String(INITIAL_DAYS), label: INITIAL_DAYS + ' days' };
            renderDailyChart('chart-daily-' + prov, stats.daily, isLocal ? 'tokens' : 'cost');
            renderBreakdownTable('table-model-' + prov, stats.by_model, 'Model', isLocal ? 'tokens' : 'cost');
            renderBreakdownTable('table-profile-' + prov, stats.by_profile, 'Profile', isLocal ? 'tokens' : 'cost');
            // Each vendor panel reads the credential status of ITS OWN provider
            // key, so a second account of a vendor shows its own STORED/not-set
            // badge and never the first account's.
            if (pType(prov) === 'opencode' && typeof loadOcCredStatus === 'function') loadOcCredStatus(prov);
            if (pType(prov) === 'commandcode' && typeof loadCcCredStatus === 'function') loadCcCredStatus(prov);
        });
        renderTrendAndGauges();
    });
}

window.switchTab = function(prov) {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    var btn = document.querySelector('.tab-btn[onclick*="' + prov + '"]');
    var panel = document.getElementById('panel-' + prov);
    if (btn) btn.classList.add('active');
    if (panel) panel.classList.add('active');

    // Cache config tab has no chart state — nothing further to restore.
    if (prov === 'cache') return;

    // Restore this tab's saved chart title from state
    var st = window._tabState[prov];
    var titleEl = document.getElementById('chartTitle-' + prov);
    var isLocalTab = pType(prov) === 'local';
    if (titleEl && st && st.label) {
        titleEl.textContent = (isLocalTab ? 'Daily Tokens (' : 'Daily Spending (') + st.label + ')';
    }
    if (!st) {
        window._tabState[prov] = { range: '7', label: '7 days' };
    }
};

window.applyDateRange = function(btnEl, provider, range) {
    var container = btnEl.parentElement;
    container.querySelectorAll('.date-pill').forEach(function(p) { p.classList.remove('active'); });
    btnEl.classList.add('active');

    var start, end, label;
    var today = new Date();
    var d = new Date(today);

    if (range === 'custom') {
        start = document.getElementById('dsFrom-' + provider).value;
        end = document.getElementById('dsTo-' + provider).value;
        if (!start || !end) return;
        label = start + ' ~ ' + end;
    } else if (range === 7) {
        d.setDate(d.getDate() - 6);
        start = d.toISOString().slice(0,10);
        end = today.toISOString().slice(0,10);
        label = '7 days';
    } else if (range === 30) {
        d.setDate(d.getDate() - 29);
        start = d.toISOString().slice(0,10);
        end = today.toISOString().slice(0,10);
        label = '30 days';
    } else if (range === 'month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().slice(0,10);
        end = today.toISOString().slice(0,10);
        label = 'This month';
    } else if (range === 'last') {
        var firstDay = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        var lastDay = new Date(today.getFullYear(), today.getMonth(), 0);
        start = firstDay.toISOString().slice(0,10);
        end = lastDay.toISOString().slice(0,10);
        label = 'Last month';
    }

    // Save per-tab state so this tab remembers its selected range
    window._tabState[provider] = { range: String(range), label: label };

    var titleEl = document.getElementById('chartTitle-' + provider);
    var isLocal = pType(provider) === 'local';
    if (titleEl) titleEl.textContent = (isLocal ? 'Daily Tokens (' : 'Daily Spending (') + label + ')';

    fetch('/api/usage/stats?provider=' + encodeURIComponent(provider) + '&start=' + start + '&end=' + end)
        .then(function(r) { return r.json(); })
        .then(function(stats) {
            var canvasKey = 'chart-daily-' + provider;
            if (window._charts && window._charts[canvasKey]) {
                window._charts[canvasKey].destroy();
            }
            renderDailyChart(canvasKey, stats.daily || [], isLocal ? 'tokens' : 'cost');
            renderBreakdownTable('table-model-' + provider, stats.by_model || {}, 'Model', isLocal ? 'tokens' : 'cost');
            renderBreakdownTable('table-profile-' + provider, stats.by_profile || {}, 'Profile', isLocal ? 'tokens' : 'cost');
            // Redraw the trend sparkline for this provider: the range just
            // changed, so the 7d picture must not stay up next to a 30d chart.
            _sparkSeries[provider] = (stats.daily || []).map(function (d) {
                return isLocal ? (d.tokens || 0) : (d.cost || 0);
            });
            renderTrendAndGauges();
        })
        .catch(function(e) {
            console.error('Date filter fetch failed', e);
        });
};

// Deep-link support: /usage#<provider> opens that provider's tab, and
// /usage#cache opens the cache configuration sub-tab.
function applyHashProvider() {
    var hashProv = (window.location.hash || '').replace(/^#/, '');
    if (hashProv === 'cache' || (hashProv && configuredProviders.indexOf(hashProv) !== -1)) {
        switchTab(hashProv);
    }
}
window.addEventListener('hashchange', applyHashProvider);

buildPage(configuredProviders).then(function() {
    applyHashProvider();
}).catch(function(e) {
    console.error('Failed to load usage page', e);
});
